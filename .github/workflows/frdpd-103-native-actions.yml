name: Native RemoteApp interaction acceptance
on:
  push:
    branches: [investigate/frdpd-103-mstsc-20260924]
    paths: ['.github/workflows/frdpd-103-native-actions.yml']
permissions:
  contents: read
  actions: read
env:
  SOURCE_RUN: '35992992165'
  SOURCE_SHA: d2dc6b6d7b0d5e7ded35f5ca24d760f5d33a9596
  CANDIDATE_SHA: d2dc6b6d7b0d5e7ded35f5ca24d760f5d33a9596
  CANDIDATE_TREE: cfbea18ef02d78b68a44f2d69d6cd8225e4eb133
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  native-actions:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Close only the disposable fixture first-use dialog
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File investigations/frdpd-103/native-preflight.ps1
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: capture-native-input-35992992165
          run-id: 35992992165
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-cipher
      - name: Authenticate the exact tested native runtime
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from secure_release.crypto import decrypt_file
          root=Path(os.environ['RUNNER_TEMP']);(root/'native-private').mkdir(exist_ok=True)
          decrypt_file(root/'native-cipher'/'native.enc',root/'native-private'/'native-rootfs.tar.gz',os.environ['BUILDER_INPUT_PRIVATE_KEY'],{'purpose':'frdpd-103-native-input','run_id':os.environ['SOURCE_RUN'],'source_sha':os.environ['SOURCE_SHA']})
          '@ | python -
      - name: Exercise native mstsc after the unchanged offscreen stability gate
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path('investigations/frdpd-103/native.py');s=p.read_text()
          for old,new in [
              ('time.monotonic()-stable_since>=10','time.monotonic()-stable_since>=30'),
              ("REPORT.get('stable_window_seconds',0)>=10", "REPORT.get('stable_window_seconds',0)>=30"),
              ("    data=shell('sudo docker logs server 2>&1\\n',capture=True,check=False).stdout;", "    import runpy\n    runpy.run_path(str(Path(__file__).with_name('native-actions.py')))['exercise'](globals(),client.pid)\n    data=shell('sudo docker logs server 2>&1\\n',capture=True,check=False).stdout;")]:
              assert s.count(old)==1, 'Native fixture hook changed'
              s=s.replace(old,new,1)
          p.write_text(s)
          '@ | python -
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python investigations/frdpd-103/native.py
          Set-Content "$env:RUNNER_TEMP/native-exit" $LASTEXITCODE
          exit 0
      - name: Encrypt native interaction evidence
        if: always()
        shell: pwsh
        run: |
          @'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'native-diagnostics.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for p in (root/'native-private').glob('*'):
                  if p.is_file() and p.suffix in ('.log','.json','.png','.txt'):out.add(p,arcname=p.name)
          encrypt_file(archive,root/'native-diagnostics.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-native-actions','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA'],'tree_sha':os.environ['CANDIDATE_TREE'],'source_run':os.environ['SOURCE_RUN']})
          archive.unlink()
          '@ | python -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-native-actions-${{ github.run_id }}
          path: ${{ runner.temp }}/native-diagnostics.enc
          compression-level: 0
          retention-days: 1
      - name: Clean disposable guest and report actual status
        if: always()
        shell: pwsh
        run: |
          Get-Process qemu-system-x86_64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $rc=1
          if (Test-Path "$env:RUNNER_TEMP/native-exit") {$rc=[int](Get-Content "$env:RUNNER_TEMP/native-exit")}
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP/native-private","$env:RUNNER_TEMP/native-cipher" -ErrorAction SilentlyContinue
          exit $rc
