name: FRDPD PR 124 protected review inputs
on:
  push:
    branches: [test/frdpd-124-verify-7b46685-20260930]
    paths: ['.github/workflows/frdpd-124-review-inputs.yml']
permissions:
  contents: read
jobs:
  review-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: a878906518325c6787361d8f653f771ee0dde707
      SOURCE_TREE: bff6b55ac4a84631f41ce4bb7824a1caee23a5af
      PUBLIC_TOOLKIT_SHA: a45e17c8c9afe4fa402edec5ab007f4c12d74ce5
      ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a45e17c8c9afe4fa402edec5ab007f4c12d74ce5
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Verify and package public offline decryptor
        run: |
          set -euo pipefail
          python tools/verify_wheelhouse.py
          python tools/tink_offline.py --version
          git archive --format=tar.gz --output="$RUNNER_TEMP/public-toolkit.tar.gz" "$PUBLIC_TOOLKIT_SHA" secure_release tools vendor requirements.lock README.md
      - name: Export exact source only in authenticated encrypted form
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          .offline-tink/py313-linux-x86_64/bin/python - <<'PY'
          import os, subprocess, tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          os.umask(0o077)
          root = Path(os.environ['RUNNER_TEMP']) / 'protected-review-inputs'
          root.mkdir(mode=0o700)
          source = root / 'source'
          ask = root / 'askpass'
          ask.write_text('#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%s\\n" "$SOURCE_READ_TOKEN" ;; esac\n')
          ask.chmod(0o700)
          env = dict(os.environ, GIT_ASKPASS=str(ask), GIT_TERMINAL_PROMPT='0')
          try:
              with (root / 'fetch.log').open('wb') as log:
                  def git(*args):
                      return subprocess.check_output(['git', *args], env=env, stderr=log, timeout=180)
                  git('init', '-q', str(source))
                  git('-C', str(source), 'remote', 'add', 'origin', 'https://github.com/dobord/frdpd.git')
                  git('-C', str(source), 'fetch', '--depth=1', 'origin', os.environ['SOURCE_SHA'])
                  git('-C', str(source), 'checkout', '-q', '--detach', 'FETCH_HEAD')
                  if git('-C', str(source), 'rev-parse', 'HEAD').decode().strip() != os.environ['SOURCE_SHA']:
                      raise ValueError('Source commit mismatch')
                  if git('-C', str(source), 'rev-parse', 'HEAD^{tree}').decode().strip() != os.environ['SOURCE_TREE']:
                      raise ValueError('Source tree mismatch')
                  git('-C', str(source), 'archive', '--format=tar.gz', '--output=' + str(root / 'source.tar.gz'), 'HEAD')
              context = {'purpose': 'frdpd-124-review-source-v1', 'source_sha': os.environ['SOURCE_SHA'], 'tree_sha': os.environ['SOURCE_TREE'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'builder_sha': os.environ['GITHUB_SHA'], 'repository': os.environ['GITHUB_REPOSITORY']}
              encrypt_file(root / 'source.tar.gz', Path(os.environ['RUNNER_TEMP']) / 'source.enc', os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'], context)
          finally:
              ask.unlink(missing_ok=True)
              os.environ.pop('SOURCE_READ_TOKEN', None)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frdpd-124-protected-inputs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source.enc
            ${{ runner.temp }}/public-toolkit.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - if: always()
        run: rm -rf "$RUNNER_TEMP/protected-review-inputs" "$RUNNER_TEMP/source.enc" "$RUNNER_TEMP/public-toolkit.tar.gz"
