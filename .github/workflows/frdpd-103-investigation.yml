name: Isolated frdpd PR 103 investigation
on:
  push:
    branches: [investigate/frdpd-103-mstsc-20260924]
    paths: ['.github/workflows/frdpd-103-investigation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frdpd-103-isolated-${{ github.ref }}
  cancel-in-progress: false
env:
  # Public key only. The private counterpart is never sent to CI.
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  protocol-baseline:
    if: github.ref == 'refs/heads/investigate/frdpd-103-mstsc-20260924'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Install and package public hash-pinned decryption dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip download --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock -d "${{ runner.temp }}/frdpd-wheels"
          cp secure_release/crypto.py requirements.lock "${{ runner.temp }}/frdpd-wheels/"
          mkdir -p "${{ runner.temp }}/frdpd-private" "${{ runner.temp }}/frdpd-encrypted"
          chmod 700 "${{ runner.temp }}/frdpd-private"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frdpd-103-public-decryption-dependencies-${{ github.run_id }}
          path: ${{ runner.temp }}/frdpd-wheels/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Fetch only authorized fixed source without executing it
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import os, subprocess, json
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'frdpd-private'
          source = root / 'source'
          askpass = root / 'askpass'
          askpass.write_text('#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%s\\n" "$SOURCE_READ_TOKEN" ;; esac\n')
          askpass.chmod(0o700)
          env = dict(os.environ, GIT_ASKPASS=str(askpass), GIT_TERMINAL_PROMPT='0')
          code, stage = 1, 'initialization'
          try:
              with (root / 'fetch.log').open('w') as log:
                  for stage, cmd in [
                      ('init',['git','init',str(source)]),
                      ('origin',['git','-C',str(source),'remote','add','origin','https://github.com/dobord/frdpd.git']),
                      ('fetch',['git','-C',str(source),'fetch','--depth=1','origin','642e9f0e372dfe1e3b74bd735878318988e58e91']),
                      ('checkout',['git','-C',str(source),'checkout','--detach','FETCH_HEAD']),
                      ('submodules',['git','-C',str(source),'-c','url.https://github.com/.insteadOf=git@github.com:','submodule','update','--init','--recursive','--depth=1'])]:
                      result = subprocess.run(cmd, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=600)
                      code = result.returncode
                      if code:
                          break
          finally:
              askpass.unlink(missing_ok=True)
              (root/'fetch-status.json').write_text(json.dumps({'stage':stage,'exit':code,'token_present':bool(os.environ.get('SOURCE_READ_TOKEN'))}))
          if code:
              raise SystemExit('Source preparation failed; details are encrypted.')
          PY
      - name: Encrypt source and preparation diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import os, tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file, fingerprint
          root=Path(os.environ['RUNNER_TEMP'])
          private=root/'frdpd-private'
          archive=root/'preparation.tar.gz'
          assert fingerprint(os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY']) == 'ace06f7c92062012382beb875e78f07ea6da31dfc99bf69c2726cc46b96e256b'
          with tarfile.open(archive,'w:gz') as out:
              out.add(private,arcname='preparation',filter=lambda item: None if '.git' in Path(item.name).parts or Path(item.name).name=='askpass' else item)
          encrypt_file(archive,root/'frdpd-encrypted'/'preparation.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],
                       {'purpose':'frdpd-103-preparation','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':'642e9f0e372dfe1e3b74bd735878318988e58e91'})
          archive.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frdpd-103-encrypted-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/frdpd-encrypted/preparation.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Build and test only inside Docker with no source credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/frdpd-private"
          rc=0
          docker build --build-arg FRDP_BUILD_COMPONENT_TESTS=ON -f "$root/source/server/frdp/test/e2e/Dockerfile" -t frdpd-103:baseline "$root/source" >"$root/build.log" 2>&1 || rc=$?
          printf 'docker_build_exit=%s\n' "$rc" > "$root/status.txt"
          if [ "$rc" -eq 0 ]; then
            docker run --rm --network none --entrypoint bash frdpd-103:baseline -lc 'cmake --build /opt/freerdp-build --parallel 2 && ctest --test-dir /opt/freerdp-build --output-on-failure -R "TestFreeRDPFrdp(GfxPolicy|GraphicsAdapter|DisplayControl|E2EScripts)|TestFreeRDPCodecZGfx|TestServerChannels"' >>"$root/build.log" 2>&1 || rc=$?
            printf 'focused_tests_exit=%s\n' "$rc" >> "$root/status.txt"
          fi
          printf '%s\n' "$rc" > "$root/exit-code"
      - name: Encrypt build diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import os, tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']); private=root/'frdpd-private'
          archive=root/'diagnostics.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for path in sorted(private.iterdir()):
                  if path.is_file() and path.name!='askpass': out.add(path,arcname=path.name)
          encrypt_file(archive,root/'frdpd-encrypted'/'diagnostics.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],
                       {'purpose':'frdpd-103-mstsc-baseline','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':'642e9f0e372dfe1e3b74bd735878318988e58e91'})
          archive.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frdpd-103-encrypted-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/frdpd-encrypted/diagnostics.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Report status and remove job-local plaintext
        if: always()
        shell: bash
        run: |
          rc=1
          if [ -f "$RUNNER_TEMP/frdpd-private/exit-code" ]; then rc=$(cat "$RUNNER_TEMP/frdpd-private/exit-code"); fi
          rm -rf "$RUNNER_TEMP/frdpd-private" "$RUNNER_TEMP/frdpd-encrypted" "$RUNNER_TEMP/frdpd-wheels"
          exit "$rc"
