name: Isolated frdpd PR 103 investigation
on:
  push:
    branches: [investigate/frdpd-103-mstsc-20260924]
    paths: ['.github/workflows/frdpd-103-investigation.yml', 'investigations/frdpd-103/prepare.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frdpd-103-isolated-${{ github.ref }}
  cancel-in-progress: false
env:
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
  SOURCE_BASE: 642e9f0e372dfe1e3b74bd735878318988e58e91
jobs:
  remoteapp-regression:
    if: github.ref == 'refs/heads/investigate/frdpd-103-mstsc-20260924'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Initialize encrypted diagnostic workspace
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          mkdir -p "$RUNNER_TEMP/frdpd-private" "$RUNNER_TEMP/frdpd-encrypted" "$RUNNER_TEMP/native-input"
          chmod 700 "$RUNNER_TEMP/frdpd-private" "$RUNNER_TEMP/native-input"
      - name: Prepare checksum-pinned private candidate without executing it
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          umask 077
          python investigations/frdpd-103/prepare.py
      - name: Build and exercise unit and full wrapper tests inside Docker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/frdpd-private"
          rc=0
          docker build --build-arg FRDP_BUILD_COMPONENT_TESTS=ON -f "$root/source/server/frdp/test/e2e/Dockerfile" -t frdpd-103:fixed "$root/source" >"$root/build.log" 2>&1 || rc=$?
          printf 'docker_build_exit=%s\n' "$rc" > "$root/status.txt"
          if [ "$rc" -eq 0 ]; then
            touch "$root/image-ready"
            docker run --rm --network none --entrypoint bash frdpd-103:fixed -lc 'cmake --build /opt/freerdp-build --parallel 2 && ctest --test-dir /opt/freerdp-build --show-only | grep -q TestFreeRDPFrdpRemoteAppContract && ctest --test-dir /opt/freerdp-build --output-on-failure -R "TestFreeRDPFrdp(RemoteAppContract|GfxPolicy|GraphicsAdapter|DisplayControl|E2EScripts|ListenerPolicyBoundary|XorgNativeSmoke)|TestFreeRDPCodecZGfx"' >"$root/focused.log" 2>&1 || rc=$?
            printf 'focused_exit=%s\n' "$rc" >> "$root/status.txt"
            full=0
            docker run --rm --network none --entrypoint bash frdpd-103:fixed -lc 'FRDP_BUILD_DIR=/opt/freerdp-build FRDP_BUILD_JOBS=2 /src/scripts/test.sh' >"$root/full-wrapper.log" 2>&1 || full=$?
            printf 'full_wrapper_exit=%s\n' "$full" >> "$root/status.txt"
            if [ "$full" -ne 0 ]; then rc=1; fi
            compat=0
            docker run --rm --network none --entrypoint bash frdpd-103:fixed -lc 'cmake --build /opt/freerdp-build --parallel 2 --target TestWinPRUtils TestSspi TestCore winpr-hash && ctest --test-dir /opt/freerdp-build --output-on-failure -R "^(TestSAM|TestAcquireCredentialsHandle|TestWinPRHashCLI|TestSettings|TestWtsDvcAuthorization|TestPeerCredentials|TestNlaCredentials)$"' >"$root/compatibility.log" 2>&1 || compat=$?
            printf 'compatibility_exit=%s\n' "$compat" >> "$root/status.txt"
            if [ "$compat" -ne 0 ]; then rc=1; fi
          fi
          printf '%s\n' "$rc" > "$root/exit-code"
      - name: Exercise real RemoteApp and classic clients on isolated Xorg backends
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/frdpd-private"
          if [ ! -f "$root/image-ready" ]; then exit 0; fi
          for backend in xorg-dummy xorg-native; do
            rc=0
            FRDP_E2E_NO_BUILD=1 FRDP_E2E_IMAGE=frdpd-103:fixed FRDP_LAYERED_DISPLAY_BACKEND="$backend" FRDP_E2E_PROFILE_TIMEOUT=600 FRDP_E2E_ARTIFACTS="$root/e2e-$backend" COMPOSE_PROJECT_NAME="frdpd103-${backend}-${GITHUB_RUN_ID}" bash "$root/source/server/frdp/test/e2e/run-layered.sh" >"$root/e2e-$backend.log" 2>&1 || rc=$?
            printf 'e2e_%s_exit=%s\n' "$backend" "$rc" >> "$root/status.txt"
            if [ "$rc" -ne 0 ]; then printf '1\n' > "$root/exit-code"; fi
          done
      - name: Prepare stripped private Linux Docker runtime for native Windows fixture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/frdpd-private"
          if [ ! -f "$root/image-ready" ]; then exit 0; fi
          docker run --name frdpd-native-export --network none --entrypoint bash frdpd-103:fixed -lc 'rm -rf /src /opt/freerdp-pristine-source /opt/freerdp-pristine-build; find /opt/freerdp-build -type d -name CMakeFiles -prune -exec rm -rf {} +; rm -rf /opt/freerdp-build/Testing; apt-get clean' >"$root/native-export.log" 2>&1
          docker export frdpd-native-export | gzip -1 > "$root/native-rootfs.tar.gz"
          docker rm frdpd-native-export >>"$root/native-export.log" 2>&1
          sha256sum "$root/native-rootfs.tar.gz" > "$root/native-image-sha256.txt"
      - name: Encrypt native input for the existing builder transport key
        if: always()
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from secure_release.crypto import encrypt_file,public_text
          root=Path(os.environ['RUNNER_TEMP'])
          source=root/'frdpd-private'/'native-rootfs.tar.gz'
          if source.exists():
              encrypt_file(source,root/'native-input'/'native.enc',public_text(os.environ['BUILDER_INPUT_PRIVATE_KEY']),{'purpose':'frdpd-103-native-input','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_BASE']})
              source.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frdpd-103-native-input-${{ github.run_id }}
          path: ${{ runner.temp }}/native-input/native.enc
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
      - name: Encrypt all diagnostic and provenance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file,fingerprint
          root=Path(os.environ['RUNNER_TEMP']); private=root/'frdpd-private'
          archive=root/'regression.tar.gz'
          assert fingerprint(os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'])=='ace06f7c92062012382beb875e78f07ea6da31dfc99bf69c2726cc46b96e256b'
          with tarfile.open(archive,'w:gz') as out:
              for path in sorted(private.iterdir()):
                  if path.name not in ('source','askpass','native-rootfs.tar.gz'): out.add(path,arcname=path.name)
          encrypt_file(archive,root/'frdpd-encrypted'/'regression.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-regression','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_BASE']})
          archive.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frdpd-103-encrypted-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frdpd-encrypted/regression.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Report real status and remove job-local plaintext
        if: always()
        shell: bash
        run: |
          rc=1
          if [ -f "$RUNNER_TEMP/frdpd-private/exit-code" ]; then rc=$(cat "$RUNNER_TEMP/frdpd-private/exit-code"); fi
          rm -rf "$RUNNER_TEMP/frdpd-private" "$RUNNER_TEMP/frdpd-encrypted" "$RUNNER_TEMP/native-input"
          exit "$rc"
