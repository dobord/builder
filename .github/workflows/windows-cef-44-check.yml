name: Windows CEF 44 verification
on:
  push:
    branches: [repair/windows-cef-44]
permissions:
  contents: read
jobs:
  public-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch bounded public Chromium inputs at the production revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-inputs
          for path in \
            LICENSE \
            ui/accessibility/platform/browser_accessibility.h \
            ui/accessibility/platform/browser_accessibility.cc \
            ui/accessibility/platform/browser_accessibility_manager.cc \
            ui/accessibility/platform/child_iterator.h \
            ui/accessibility/ax_node.h \
            base/containers/adapters.h; do
            mkdir -p "public-inputs/$(dirname "$path")"
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 60 --max-filesize 1048576 \
              "https://raw.githubusercontent.com/chromium/chromium/79460ebecaa5625e57a5fb679a735659e73dc687/$path" \
              -o "public-inputs/$path"
          done
          cd public-inputs
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-chromium-inputs-${{ github.run_id }}
          path: public-inputs/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
