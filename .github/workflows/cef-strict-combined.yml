name: Strict CEF combined SDK qualification
on:
  workflow_dispatch:
  push:
    branches: [feature/cef-static-integration]
    paths:
      - .github/workflows/cef-strict-combined.yml
      - secure_release/cef_strict_combined.py
      - secure_release/safeio.py
      - secure_release/cef_sdk_example.py
      - secure_release/cef_sdk_headers.py
      - secure_release/cef_sdk_aliases.py
      - secure_release/cef_sdk_protoc.py
      - tests/test_cef_sdk_protoc.py
      - tests/fixtures/cef-sdk-protoc/**
      - tests/test_cef_sdk_aliases.py
      - tests/test_cef_sdk_headers.py
      - tests/fixtures/cef-sdk-headers/**
      - tests/test_cef_sdk_example.py
      - secure_release/cef_freerdp_profile.py
      - secure_release/cef_frozen_dependencies.py
      - secure_release/cef_harfbuzz_boundary.py
      - ci/cef-harfbuzz-interface.json
      - tests/test_cef_harfbuzz_boundary.py
      - tests/test_cef_harfbuzz_c_api.py
      - tests/test_cef_harfbuzz_includes.py
      - tests/test_cef_harfbuzz_uploaded_proof.py
      - tests/test_cef_harfbuzz_metadata_alias.py
      - tests/test_cef_harfbuzz_archive_alias.py
      - tests/fixtures/cef-libpng-alias/**
      - secure_release/cef_frozen_evidence.py
      - tests/test_cef_frozen_dependencies.py
      - tests/test_cef_frozen_evidence.py
      - tests/fixtures/cef-frozen-dependencies/**
      - triplets/x64-linux-static-release.cmake
      - tests/test_cef_freerdp_profile.py
      - tests/fixtures/freerdp-host-isolation/**
      - secure_release/cef_combined_port.py
      - secure_release/cef_qualified_export.py
      - secure_release/cef_build.py
      - tests/test_cef_combined_port.py
      - tests/fixtures/cef-qualified-export/**
      - secure_release/cef_dependency_source.py
      - tests/test_cef_dependency_source.py
      - tests/fixtures/cef-dependency-source/**
      - secure_release/cef_combined_identity.py
      - tests/test_cef_combined_identity.py
      - secure_release/cef_nss_isolation.py
      - secure_release/cef_native_link_static.py
      - secure_release/cef_x11_static.py
      - secure_release/cef_unwind_backtrace.py
      - secure_release/cef_unwind_backtrace.h
      - tests/test_cef_native_link_static.py
      - tests/test_cef_x11_static.py
      - tests/test_cef_unwind_backtrace.py
      - tests/test_cef_qualification_workflows.py
      - ci/cef-strict-combined-lock.json
permissions:
  contents: read
  actions: read
concurrency:
  group: cef-strict-combined-linux-1873bb62
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.lock.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require an explicit reviewed checkpoint before expensive work
        id: lock
        shell: python
        run: |
          import json, os, pathlib
          value = json.loads(pathlib.Path("ci/cef-strict-combined-lock.json").read_text())
          ready = isinstance(value, dict) and value.get("checkpoint") is not None
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("ready=" + ("true" if ready else "false") + "\n")
          if not ready:
              raise SystemExit("CEF_STRICT_COMBINED_CHECKPOINT_REQUIRED")
  linux:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: 936bbb0e7cb7d6d10f8f5ef5874521466278c799
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: b4bb281192ea8bb004542012ac804b988a4ff403
          path: private-engine-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: private-vcpkg/.full-upstream
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 2aff22e09daaa5c28780c5766a70ee13e61c93b6
          path: private-vcpkg/.full-cef
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/lockfreecoro
          ref: 24038aed3a0be642adb60e71bd994ae8f0d90140
          path: private-lockfreecoro
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/lfc-ui
          ref: 307afeab287b283514e036aa82ea1bd331dbac2a
          path: private-lfc-ui
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install hash-pinned Python build tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r build-tools.lock
      - name: Recover hosted-runner capacity and install native prerequisites
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 autoconf autoconf-archive automake libtool pkg-config ninja-build gperf flex bison nasm gettext texinfo libltdl-dev xvfb xauth fonts-dejavu-core ccache openssl
          df -h /
      - name: Validate final combined helper syntax
        run: python -m py_compile secure_release/cef_dependency_source.py secure_release/cef_strict_combined.py secure_release/cef_combined_identity.py secure_release/cef_nss_isolation.py secure_release/cef_native_link_static.py secure_release/cef_x11_static.py secure_release/cef_unwind_backtrace.py
      - name: Verify bounded pinned Git acquisition and vcpkg source cache
        run: python -m unittest discover -s tests -p test_cef_dependency_source.py -v
      - name: Verify combined host identity with the pinned checkpoint codec
        env:
          REQUIRE_CEF_COMBINED_IDENTITY_FIXTURE: '1'
        run: python -m unittest discover -s tests -p test_cef_combined_identity.py -v
      - name: Verify ABI-tracked qualified port and native export before combined restore
        env:
          REQUIRE_CEF_COMBINED_PORT_FIXTURE: '1'
        run: python -m unittest discover -s tests -p test_cef_combined_port.py -v
      - name: Verify pinned installed example and native vcpkg SDK packaging
        env:
          CEF_SDK_EXAMPLE_LFC_UI_ROOT: ${{ github.workspace }}/private-lfc-ui
          CEF_SDK_EXAMPLE_REGISTRY_ROOT: ${{ github.workspace }}/private-vcpkg
          CEF_SDK_EXAMPLE_VCPKG_ROOT: ${{ github.workspace }}/private-vcpkg/.full-upstream
          REQUIRE_CEF_SDK_EXAMPLE: '1'
        run: python -m unittest discover -s tests -p test_cef_sdk_example.py -v
      - name: Verify public GLib inclusion header and native SDK packaging
        env:
          CEF_SDK_HEADERS_GLIB_PORT: ${{ github.workspace }}/private-vcpkg/.full-upstream/ports/glib/portfile.cmake
          CEF_SDK_HEADERS_VCPKG_ROOT: ${{ github.workspace }}/private-vcpkg/.full-upstream
          REQUIRE_CEF_SDK_HEADERS: '1'
        run: python -m unittest discover -s tests -p test_cef_sdk_headers.py -v
      - name: Verify owned SDK aliases through native vcpkg packaging and relocation
        env:
          CEF_SDK_ALIASES_VCPKG_ROOT: ${{ github.workspace }}/private-vcpkg/.full-upstream
          REQUIRE_CEF_SDK_ALIASES: '1'
        run: python -m unittest discover -s tests -p test_cef_sdk_aliases.py -v
      - name: Verify owned versioned protoc through SDK transport
        env:
          CEF_SDK_PROTOC_VCPKG_ROOT: ${{ github.workspace }}/private-vcpkg/.full-upstream
          REQUIRE_CEF_SDK_PROTOC: '1'
        run: python -m unittest discover -s tests -p test_cef_sdk_protoc.py -v
      - name: Verify pinned HarfBuzz C boundary before archive replay
        env:
          REQUIRE_CEF_HARFBUZZ_BOUNDARY: '1'
          REQUIRE_CEF_FREETYPE_INCLUDE_FIXTURE: '1'
          CEF_FREETYPE_SOURCE_ARCHIVE: ${{ runner.temp }}/cef-freetype-source.tar.gz
          CEF_FREETYPE_PORT_FIXTURE: ${{ github.workspace }}/private-vcpkg/.full-upstream/ports/freetype/portfile.cmake
          CEF_HARFBUZZ_SOURCE_FIXTURE: ${{ runner.temp }}/cef-harfbuzz-source/harfbuzz-14.2.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cef-harfbuzz-source.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "$archive" https://github.com/harfbuzz/harfbuzz/archive/14.2.1.tar.gz
          echo "b7642a81eb021bf96cf8c91c5ebdde7f4fdfd40c76db722f00cf001125f4b81b954d08485774d2b23318d49b1e954fa0189ba8f10db56d148f33f9d90891d0cb  $archive" | sha512sum -c -
          mkdir "$RUNNER_TEMP/cef-harfbuzz-source"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cef-harfbuzz-source"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "$CEF_FREETYPE_SOURCE_ARCHIVE" https://gitlab.freedesktop.org/freetype/freetype/-/archive/VER-2-14-3/freetype-VER-2-14-3.tar.gz
          echo "c3b6b0cc4b428c9c647ab2148386901dfd315273b68051940e8fea6010d46fdd2913467c3ef58be0d499b8e2ef5a0f1a4cc5e739756155587f4f7dff08ef9695  $CEF_FREETYPE_SOURCE_ARCHIVE" | sha512sum -c -
          python -m unittest discover -s tests -p test_cef_harfbuzz_includes.py -v
          python -m unittest discover -s tests -p test_cef_harfbuzz_boundary.py -v
          python -m unittest discover -s tests -p test_cef_harfbuzz_c_api.py -v
          python -m unittest discover -s tests -p test_cef_harfbuzz_uploaded_proof.py -v
          python -m unittest discover -s tests -p test_cef_harfbuzz_metadata_alias.py -v
          python -m unittest discover -s tests -p test_cef_harfbuzz_archive_alias.py -v
      - name: Verify frozen archive ownership with native vcpkg before restore
        env:
          CEF_FROZEN_VCPKG_ROOT: ${{ github.workspace }}/private-vcpkg/.full-upstream
          REQUIRE_CEF_FROZEN_VCPKG: '1'
        run: |
          python -m unittest discover -s tests -p test_cef_frozen_dependencies.py -v
          python -m unittest discover -s tests -p test_cef_frozen_evidence.py -v
      - name: Verify declared FreeRDP features with hostile host libva before restore
        run: python -m unittest discover -s tests -p test_cef_freerdp_profile.py -v
      - name: Verify exact engine profile adapters before combined restore
        run: |
          python -m unittest discover -s tests -p test_cef_native_link_static.py -v
          python -m unittest discover -s tests -p test_cef_x11_static.py -v
          python -m unittest discover -s tests -p test_cef_unwind_backtrace.py -v
          python -m unittest discover -s tests -p test_cef_qualification_workflows.py -v
      - name: Run checkpoint-resumed final combined SDK qualification
        id: combined
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m secure_release.cef_strict_combined
      - name: Summarize rejected symbol coverage without exposing diagnostics
        if: ${{ failure() && steps.combined.outcome == 'failure' }}
        run: python -m secure_release.cef_frozen_evidence
      - name: Upload non-sensitive combined qualification summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cef-strict-combined-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-strict-combined-summary.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Build encrypted diagnostic artifact
        if: always()
        uses: ./.github/actions/encrypted-logs
        with:
          public_key_b64: ${{ secrets.BUILDER_ENCRYPTED_LOGS_PUBLIC_KEY_B64 }}
          roots: |
            ${{ runner.temp }}
            ${{ github.workspace }}/private-vcpkg/.full-cef/static-diagnostics
