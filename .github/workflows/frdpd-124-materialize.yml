name: FRDPD PR 124 private patch object
on:
  push:
    branches: [test/frdpd-124-verify-7b46685-20260930]
    paths: ['.github/workflows/frdpd-124-materialize.yml']
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Apply reviewed private patch with exact input and output hashes
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, sys, urllib.error, urllib.request
          from pathlib import Path
          os.umask(0o077)
          root = Path(os.environ['RUNNER_TEMP']) / 'private-patch-object'
          root.mkdir(mode=0o700)
          endpoint = 'https://api.github.com/repos/dobord/frdpd/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['SOURCE_READ_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def fetch_blob(sha):
              req = urllib.request.Request(endpoint + '/' + sha, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = base64.b64decode(json.load(response)['content'])
              if blob_hash(data) != sha:
                  raise ValueError('input object mismatch')
              return data
          old = fetch_blob('b719cd7ee07b1d4d87b758b974e5d4768e0fcd61')
          patch = fetch_blob('4982fe3942f9352cd4b8a89ab18b83aaadfe4d95')
          path = root / 'server/frdp/frdp-session-agent/frdp-session-agent.c'
          path.parent.mkdir(parents=True)
          path.write_bytes(old)
          patch_path = root / 'review.patch'
          patch_path.write_bytes(patch)
          with (root / 'apply.log').open('wb') as log:
              subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', str(patch_path)], cwd=root, stdout=log, stderr=log, check=True, timeout=30)
              subprocess.run(['git', 'apply', '--whitespace=error-all', str(patch_path)], cwd=root, stdout=log, stderr=log, check=True, timeout=30)
          data = path.read_bytes()
          expected = '35d72a5e7789f7e3ee97fcbfd49921fdd620b7d9'
          if blob_hash(data) != expected:
              raise ValueError('output object mismatch')
          # Store only the reviewed immutable object in the private repository. This
          # job never creates commits or updates any branch, tag, release or secret.
          payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
          request = urllib.request.Request(endpoint, data=payload, headers=headers, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              print(json.dumps({'materialized': False, 'http_status': error.code, 'expected_blob': expected}))
              sys.exit(1)
          if result.get('sha') != expected:
              raise ValueError('stored object mismatch')
          print(json.dumps({'materialized': True, 'blob_sha': expected, 'refs_updated': False}))
          PY
      - if: always()
        run: rm -rf "$RUNNER_TEMP/private-patch-object"
