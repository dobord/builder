name: Resumable Windows CEF engine iteration
on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/cef-windows-engine-iteration.yml
      - ci/cef-windows-engine-lock.json
permissions:
  contents: read
  actions: read
concurrency:
  group: cef-windows-engine-iteration
  cancel-in-progress: true
jobs:
  windows:
    runs-on: ${{ fromJSON(vars.CEF_STATIC_WINDOWS_RUNNER_LABELS || '["windows-2022"]') }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: 114592cf5595131f9bd968e1afd1f2c575f2301c
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 8cc991137287ca18e989e2bb292e2323ba052b28
          path: private-cef
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install hash-pinned checkpoint cryptography
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - name: Verify exact source revisions and workspace capacity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C private-vcpkg rev-parse HEAD) -ne '114592cf5595131f9bd968e1afd1f2c575f2301c') { throw 'vcpkg revision mismatch' }
          if ((git -C private-cef rev-parse HEAD) -ne '8cc991137287ca18e989e2bb292e2323ba052b28') { throw 'CEF revision mismatch' }
          $drive = Get-PSDrive -Name C
          Write-Host ("CEF_WINDOWS_ITERATION_FREE_BYTES=" + $drive.Free)
          if ($drive.Free -lt 84825604096) { throw 'CEF_WINDOWS_ITERATION_CAPACITY_LT_79_GIB' }
      - name: Validate Windows iteration worker syntax
        run: |
          python -m py_compile secure_release/cef_windows_iteration.py
      - name: Run exact Windows CEF compilation slice with bounded header identity
        id: iteration
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m secure_release.cef_windows_iteration
      - name: Upload encrypted Windows CEF checkpoint
        if: ${{ !cancelled() && steps.iteration.outputs.checkpoint_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cef-windows-engine-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-windows-engine-checkpoint-encrypted/*.enc
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload non-sensitive Windows iteration summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cef-windows-engine-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-windows-engine-summary.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
