name: Resumable Windows CEF engine iteration
on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/cef-windows-engine-iteration.yml
      - ci/cef-windows-engine-lock.json
permissions:
  contents: read
  actions: read
concurrency:
  group: cef-windows-engine-iteration-1873bb62
  cancel-in-progress: true
jobs:
  windows:
    runs-on: ${{ fromJSON(vars.CEF_STATIC_WINDOWS_RUNNER_LABELS || '["windows-2022"]') }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: 39dccd415da14d8051559d66069019475d95787c
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 03abd124ebe3b8a57fb78470a75b5aa3ce064e31
          path: private-cef
          persist-credentials: false
      - name: Preserve exact public fixture newlines
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: v8/v8
          ref: 4323497a6a73839e6d5260f6acd7ec0212cb3321
          path: public-v8
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /include/
            /src/torque/implementation-visitor.cc
            /src/objects/map.h
            /src/objects/object-macros.h
            /src/objects/js-interceptor-map.h
            /src/objects/map.tq
            /src/objects/js-interceptor-map.tq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chromium/chromium
          ref: 79460ebecaa5625e57a5fb679a735659e73dc687
          path: public-chromium
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /third_party/rust/cxx/v1/cxx.h
            /third_party/rust/chromium_crates_io/vendor/cxx-v1/include/cxx.h
            /base/containers/adapters.h
            /base/containers/adapters_internal.h
            /ui/accessibility/ax_node.h
            /ui/accessibility/platform/browser_accessibility.h
            /ui/accessibility/platform/browser_accessibility.cc
            /ui/accessibility/platform/child_iterator.h
            /ui/accessibility/platform/browser_accessibility_manager.cc
            /third_party/blink/renderer/platform/wtf/text/wtf_string.h
            /third_party/blink/renderer/platform/wtf/text/code_point_iterator.h
            /third_party/blink/renderer/core/layout/inline/inline_items_data.cc
            /third_party/blink/renderer/platform/wtf/text/text_offset_map.h
            /base/no_destructor.h
            /google_apis/common/api_key_request_util.h
            /components/autofill/core/common/credit_card_number_validation.h
            /content/browser/renderer_host/frame_tree.h
            /content/browser/locks/lock_manager.h
            /components/password_manager/core/browser/affiliation/affiliated_match_helper.cc
            /components/password_manager/core/browser/password_store/stored_credential.h
            /base/functional/bind_internal.h
            /components/password_manager/core/browser/password_store/password_store_backend_error.h
            /components/password_manager/core/browser/password_store/password_store_backend_error.cc
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install hash-pinned checkpoint cryptography
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - name: Verify exact source revisions and workspace capacity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C private-vcpkg rev-parse HEAD) -ne '39dccd415da14d8051559d66069019475d95787c') { throw 'vcpkg revision mismatch' }
          if ((git -C private-cef rev-parse HEAD) -ne '03abd124ebe3b8a57fb78470a75b5aa3ce064e31') { throw 'CEF revision mismatch' }
          if ((git -C public-v8 rev-parse HEAD) -ne '4323497a6a73839e6d5260f6acd7ec0212cb3321') { throw 'V8 regression revision mismatch' }
          if ((git -C public-chromium rev-parse HEAD) -ne '79460ebecaa5625e57a5fb679a735659e73dc687') { throw 'Chromium regression revision mismatch' }
          $drive = Get-PSDrive -Name C
          Write-Host ("CEF_WINDOWS_ITERATION_FREE_BYTES=" + $drive.Free)
          if ($drive.Free -lt 84825604096) { throw 'CEF_WINDOWS_ITERATION_CAPACITY_LT_79_GIB' }
      - name: Validate Windows iteration worker syntax
        run: |
          python -m py_compile secure_release/cef_windows_iteration.py
      - name: Test reviewed Windows checkpoint host migration
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
        run: python -m unittest tests.test_cef_windows_runner_image_migration -v
      - name: Test reviewed Windows checkpoint workspace migration
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
        run: python -m unittest tests.test_cef_windows_workspace_path_migration -v
      - name: Test fail-closed Windows checkpoint transport retry
        run: python -m unittest tests.test_cef_windows_checkpoint_transport_retry -v
      - name: Test reviewed Windows source repair and checkpoint transition
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
          CEF_WINDOWS_LAYOUT_SOURCE_ROOT: ${{ github.workspace }}/public-v8
          CEF_WINDOWS_CFUNCTION_SOURCE_ROOT: ${{ github.workspace }}/public-v8
          CEF_WINDOWS_ACCESSIBILITY_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_DOM_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_STRING_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_INLINE_ITEMS_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_API_KEY_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_CREDIT_CARD_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_FRAME_TREE_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_LOCK_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_AFFILIATED_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_BACKEND_ERROR_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
        run: python -m unittest discover -s tests -p test_cef_windows_source_repair.py -v
      - name: Test reviewed Windows credit-card string repair
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
          CEF_WINDOWS_CREDIT_CARD_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
        run: python -m unittest tests.test_cef_windows_credit_card_string_repair -v
      - name: Test reviewed Windows frame-tree V17 repair
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
          CEF_WINDOWS_LAYOUT_SOURCE_ROOT: ${{ github.workspace }}/public-v8
          CEF_WINDOWS_ACCESSIBILITY_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_STRING_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_FRAME_TREE_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_LOCK_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_AFFILIATED_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_BACKEND_ERROR_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
        run: python -m unittest tests.test_cef_windows_frame_tree_iterator_repair -v
      - name: Test reviewed Windows lock-manager V18 repair
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
          CEF_WINDOWS_LAYOUT_SOURCE_ROOT: ${{ github.workspace }}/public-v8
          CEF_WINDOWS_ACCESSIBILITY_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_STRING_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_LOCK_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_AFFILIATED_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_BACKEND_ERROR_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
        run: python -m unittest tests.test_cef_windows_lock_manager_repair -v
      - name: Test reviewed Windows affiliated-result V19 repair
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
          CEF_WINDOWS_LAYOUT_SOURCE_ROOT: ${{ github.workspace }}/public-v8
          CEF_WINDOWS_ACCESSIBILITY_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_STRING_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_LOCK_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_AFFILIATED_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_BACKEND_ERROR_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
        run: python -m unittest tests.test_cef_windows_affiliated_result_repair -v
      - name: Test reviewed Windows backend-error V20 repair
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
          CEF_WINDOWS_LAYOUT_SOURCE_ROOT: ${{ github.workspace }}/public-v8
          CEF_WINDOWS_ACCESSIBILITY_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_STRING_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_LOCK_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_AFFILIATED_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
          CEF_WINDOWS_BACKEND_ERROR_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
        run: python -m unittest tests.test_cef_windows_backend_error_repair -v
      - name: Test bounded Windows diagnostics
        run: python -m unittest discover -s tests -p test_cef_windows_diagnostics.py -v
      - name: Test authenticated ciphertext-only diagnostic transport
        run: python -m unittest discover -s tests -p test_encrypted_logs.py -v
      - name: Run exact Windows CEF compilation slice with bounded header identity
        id: iteration
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m secure_release.cef_windows_iteration
      - name: Capture bounded Windows iteration diagnostics
        if: ${{ !cancelled() && (steps.iteration.outcome == 'success' || steps.iteration.outcome == 'failure') }}
        run: python -m secure_release.cef_windows_diagnostics
      - name: Preserve encrypted Windows iteration diagnostics
        if: ${{ !cancelled() && (steps.iteration.outcome == 'success' || steps.iteration.outcome == 'failure') }}
        uses: ./.github/actions/encrypted-logs
        with:
          roots: |
            ${{ runner.temp }}/cef-windows-iteration-diagnostics
            ${{ runner.temp }}/cef-windows-engine-logs
      - name: Upload bounded Windows diagnostic status
        if: ${{ !cancelled() && (steps.iteration.outcome == 'success' || steps.iteration.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cef-windows-engine-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-windows-engine-diagnostics.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload encrypted Windows CEF checkpoint
        if: ${{ !cancelled() && steps.iteration.outputs.checkpoint_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cef-windows-engine-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-windows-engine-checkpoint-encrypted/*.enc
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload non-sensitive Windows iteration summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cef-windows-engine-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-windows-engine-summary.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
