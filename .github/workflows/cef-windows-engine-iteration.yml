name: Resumable Windows CEF engine iteration
on:
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/cef-windows-engine-iteration.yml
permissions:
  contents: read
jobs:
  validate-definition:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate workflow definition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'CEF_WINDOWS_ITERATION_WORKFLOW_DEFINITION_VALID'
