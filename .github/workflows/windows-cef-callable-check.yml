name: Windows CEF callable verification
on:
  push:
    branches: [repair/windows-cef-43-callable]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CEF_WINDOWS_LAYOUT_SOURCE_ROOT: ${{ github.workspace }}/public-v8
      CEF_WINDOWS_CFUNCTION_SOURCE_ROOT: ${{ github.workspace }}/public-v8
      CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/public-cef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: v8/v8
          ref: 4323497a6a73839e6d5260f6acd7ec0212cb3321
          path: public-v8
          persist-credentials: false
          sparse-checkout: |
            include
            src/base
            src/torque
            src/objects
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 03abd124ebe3b8a57fb78470a75b5aa3ce064e31
          path: public-cef
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact public source revisions
        run: >-
          python -c "import os,subprocess;
          pins={'.':os.environ['GITHUB_SHA'],'public-v8':'4323497a6a73839e6d5260f6acd7ec0212cb3321','public-cef':'03abd124ebe3b8a57fb78470a75b5aa3ce064e31'};
          assert all(subprocess.check_output(['git','-C',path,'rev-parse','HEAD'],text=True).strip()==sha for path,sha in pins.items())"
      - name: Verify offline wheelhouse
        run: python tools/verify_wheelhouse.py
      - name: Install only hash-pinned offline cryptography
        run: >-
          python -m pip install --no-index --find-links=vendor/wheels --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - name: Native callable and complete checkpoint transition regressions
        run: python -m unittest tests.test_cef_windows_callable_repair tests.test_cef_windows_source_repair tests.test_cef_windows_layout_repair tests.test_cef_windows_tail_size_repair tests.test_cef_windows_cfunction_span_repair tests.test_openssl_tink_logs -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
