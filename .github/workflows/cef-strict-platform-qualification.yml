name: Strict CEF full-platform qualification
on:
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/cef-strict-platform-qualification.yml
permissions:
  contents: read
jobs:
  qualify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: 8fd1ca83ba365f3fe3884d86f7ef6608c2095f2b
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact private graph revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-vcpkg rev-parse HEAD)" = "8fd1ca83ba365f3fe3884d86f7ef6608c2095f2b"
          echo "STRICT_GRAPH_SOURCE_CHECKOUT_OK"
