name: Strict CEF full-platform qualification
on:
  workflow_dispatch:
  push:
    branches: [feature/cef-static-integration]
    paths:
      - '.github/workflows/cef-strict-platform-qualification.yml'
permissions:
  contents: read
concurrency:
  group: cef-strict-platform-qualification
  cancel-in-progress: false
jobs:
  qualify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: 8fd1ca83ba365f3fe3884d86f7ef6608c2095f2b
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: private-vcpkg/.full-upstream
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 37729fd2b1db127c1658098d69ab63adc70e045f
          path: private-vcpkg/.full-cef
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned diagnostic encryption libraries
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - name: Recover hosted-runner capacity and install native tools
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 autoconf autoconf-archive automake libtool pkg-config ninja-build gperf flex bison nasm gettext texinfo libltdl-dev xvfb xauth fonts-dejavu-core
          df -h /
      - name: Qualify exact complete static platform graph
        id: qualify
        shell: bash
        env:
          CEF_CONTRACT_SOURCE: ${{ github.workspace }}/private-vcpkg/.full-cef
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cef-strict-evidence"
          python -I -m unittest discover -s ci/cef-full/tests -v             >"$RUNNER_TEMP/cef-strict-contract.log" 2>&1
          python ci/cef-full/native.py             --root .             --work "$RUNNER_TEMP/cef-strict-work"             --evidence "$RUNNER_TEMP/cef-strict-evidence"             >"$RUNNER_TEMP/cef-strict-native.log" 2>&1
          python - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cef-strict-evidence/native-full.json"
          value = json.loads(evidence.read_text())
          required = {
              "schema": 1,
              "status": "success",
              "kind": "cef-static-platform-preflight",
              "full_platform_graph_qualified": True,
              "cef_runtime_verified": False,
              "gpu_runtime_qualified": False,
              "module_count": 36,
          }
          for key, expected in required.items():
              if value.get(key) != expected:
                  raise RuntimeError(f"strict platform receipt mismatch: {key}")
          public = {key: value[key] for key in (
              "schema", "status", "kind", "full_platform_graph_qualified",
              "cef_runtime_verified", "gpu_runtime_qualified", "module_count",
              "manifest_sha256", "executable_sha256", "archive_count", "needed"
          ) if key in value}
          public["vcpkg_commit"] = "8fd1ca83ba365f3fe3884d86f7ef6608c2095f2b"
          public["cef_recipe_commit"] = "37729fd2b1db127c1658098d69ab63adc70e045f"
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cef-strict-summary.json"
          target.write_text(json.dumps(public, sort_keys=True, indent=2) + "\n")
          PY
        working-directory: private-vcpkg
      - name: Encrypt bounded diagnostics on failure
        if: failure()
        env:
          ARTIFACT_ENCRYPTION_PUBLIC_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_PUBLIC_KEY }}
        shell: python
        run: |
          import os, pathlib
          from secure_release import crypto
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          target = root / "cef-strict-diagnostic.log"
          budget = 64 * 1024 * 1024
          with target.open("wb") as out:
              for name in ("cef-strict-contract.log", "cef-strict-native.log"):
                  source = root / name
                  if not source.is_file() or budget <= 0:
                      continue
                  size = min(source.stat().st_size, budget)
                  with source.open("rb") as stream:
                      stream.seek(max(0, source.stat().st_size - size))
                      data = stream.read(size)
                  out.write(("\n===== " + name + " =====\n").encode())
                  out.write(data)
                  budget -= len(data)
          context = {
              "schema": 1,
              "purpose": "cef-strict-platform-qualification",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "builder_commit": os.environ["GITHUB_SHA"],
              "vcpkg_commit": "8fd1ca83ba365f3fe3884d86f7ef6608c2095f2b",
              "cef_recipe_commit": "37729fd2b1db127c1658098d69ab63adc70e045f",
          }
          crypto.encrypt_file(
              target, root / "cef-strict-diagnostic.enc",
              os.environ["ARTIFACT_ENCRYPTION_PUBLIC_KEY"], context)
      - name: Upload encrypted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cef-strict-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-strict-diagnostic.enc
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
      - name: Upload non-sensitive success receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cef-strict-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-strict-summary.json
          retention-days: 7
          if-no-files-found: error
