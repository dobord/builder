name: Windows CEF inline optional verification
on:
  push:
    branches: [repair/windows-cef-47-inline-empty]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
      CEF_WINDOWS_LAYOUT_SOURCE_ROOT: ${{ github.workspace }}/public-v8
      CEF_WINDOWS_CFUNCTION_SOURCE_ROOT: ${{ github.workspace }}/public-v8
      CEF_WINDOWS_ACCESSIBILITY_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
      CEF_WINDOWS_STRING_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
    steps:
      - name: Preserve byte-exact public fixture newlines
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 03abd124ebe3b8a57fb78470a75b5aa3ce064e31
          path: private-cef
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: v8/v8
          ref: 4323497a6a73839e6d5260f6acd7ec0212cb3321
          path: public-v8
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /include/
            /src/torque/implementation-visitor.cc
            /src/objects/map.h
            /src/objects/object-macros.h
            /src/objects/js-interceptor-map.h
            /src/objects/map.tq
            /src/objects/js-interceptor-map.tq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chromium/chromium
          ref: 79460ebecaa5625e57a5fb679a735659e73dc687
          path: public-chromium
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /base/containers/adapters.h
            /base/containers/adapters_internal.h
            /ui/accessibility/ax_node.h
            /ui/accessibility/platform/browser_accessibility.h
            /ui/accessibility/platform/browser_accessibility.cc
            /ui/accessibility/platform/child_iterator.h
            /ui/accessibility/platform/browser_accessibility_manager.cc
            /third_party/blink/renderer/platform/wtf/text/wtf_string.h
            /third_party/blink/renderer/platform/wtf/text/code_point_iterator.h
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact public input revisions
        shell: python
        run: |
          import os, subprocess
          pins = {'.': os.environ['GITHUB_SHA'], 'private-cef': '03abd124ebe3b8a57fb78470a75b5aa3ce064e31', 'public-v8': '4323497a6a73839e6d5260f6acd7ec0212cb3321', 'public-chromium': '79460ebecaa5625e57a5fb679a735659e73dc687'}
          for path, pin in pins.items():
              actual = subprocess.check_output(['git', '-C', path, 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin:
                  raise RuntimeError('Public regression revision mismatch: ' + path)
      - name: Verify and install hash-pinned offline test runtime
        run: |
          python tools/verify_wheelhouse.py
          python -m pip install --disable-pip-version-check --no-index --find-links vendor/wheels --require-hashes --only-binary=:all: -r requirements.lock
          python tools/tink_offline.py --version
      - name: Report native Windows Clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:ProgramFiles/LLVM/bin/clang-cl.exe" --version'
      - name: Verify syntax
        run: python -m py_compile secure_release/cef_windows_source_repair.py tests/test_cef_windows_inline_empty_repair.py
      - name: Verify original failure, sentinel semantics and native checkpoint upgrade
        run: python -m unittest tests.test_cef_windows_inline_empty_repair -v
      - name: Verify complete source repair and authenticated diagnostic regressions
        run: |
          python -m unittest discover -s tests -p test_cef_windows_source_repair.py -v
          python -m unittest discover -s tests -p test_cef_windows_diagnostics.py -v
          python -m unittest discover -s tests -p test_encrypted_logs.py -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
