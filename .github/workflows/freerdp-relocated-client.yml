name: FreeRDP relocated static client qualification
on:
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/freerdp-relocated-client.yml
permissions:
  contents: read
concurrency:
  group: freerdp-relocated-client-v22
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: b4bb281192ea8bb004542012ac804b988a4ff403
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: private-vcpkg/.relocated-upstream
          persist-credentials: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 autoconf autoconf-archive automake libtool pkg-config ninja-build
      - name: Install minimal static FreeRDP client graph
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
          VCPKG_DISABLE_METRICS: "1"
          VCPKG_BINARY_SOURCES: clear
        run: |
          set -euo pipefail
          test "$(git -C private-vcpkg rev-parse HEAD)" = "b4bb281192ea8bb004542012ac804b988a4ff403"
          upstream="$GITHUB_WORKSPACE/private-vcpkg/.relocated-upstream"
          test "$(git -C "$upstream" rev-parse HEAD)" = "9e593bb18ea69cc5095e012465dcd675a822ed0d"
          bash "$upstream/bootstrap-vcpkg.sh" -disableMetrics >"$RUNNER_TEMP/freerdp-v22-bootstrap.log" 2>&1
          set +e
          "$upstream/vcpkg" install 'freerdp[client,urbdrc]' \
            --triplet=x64-linux-static-release \
            --host-triplet=x64-linux-static-release \
            "--overlay-ports=$GITHUB_WORKSPACE/private-vcpkg/ports" \
            "--overlay-triplets=$GITHUB_WORKSPACE/private-vcpkg/triplets" \
            "--x-install-root=$RUNNER_TEMP/freerdp-v22-installed" \
            --binarysource=clear >"$RUNNER_TEMP/freerdp-v22-install.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python - <<'PY'
          import os, pathlib, re
          runner = pathlib.Path(os.environ["RUNNER_TEMP"])
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          install = (runner/"freerdp-v22-install.log").read_text(errors="replace")[-1048576:]
          buildtrees = workspace/"private-vcpkg/.relocated-upstream/buildtrees"
          package = "unknown"
          for pattern in (
              r"error: building ([a-z0-9][a-z0-9+_.-]*):",
              r"BUILD_FAILED[^\n]*?([a-z0-9][a-z0-9+_.-]+):x64-linux-static-release",
              r"([a-z0-9][a-z0-9+_.-]+):x64-linux-static-release failed",
          ):
              match = re.search(pattern, install, re.I)
              if match:
                  package = match.group(1).lower()
                  break
          root = buildtrees/package if package != "unknown" else buildtrees/"freerdp"
          names = []
          for name in re.findall(r"([A-Za-z0-9_.+~-]+\.log)", install):
              if name not in names:
                  names.append(name)
          files = []
          if root.is_dir():
              for name in names[-12:]:
                  matches=[p for p in root.rglob(name) if p.is_file()
                           and not any(part in {"CMakeScratch","CMakeTmp"}
                                       or part.startswith("TryCompile") for part in p.parts)]
                  if matches:
                      files.append(max(matches,key=lambda p:p.stat().st_mtime))
              if not files:
                  files=sorted(
                      [p for p in root.rglob("*.log") if p.is_file()
                       and p.stat().st_size <= 16*1024**2
                       and not any(part in {"CMakeScratch","CMakeTmp"}
                                   or part.startswith("TryCompile") for part in p.parts)],
                      key=lambda p:p.stat().st_mtime,reverse=True
                  )[:10]
          text="\n".join(p.read_text(errors="replace")[-524288:] for p in files) or install
          category="unknown"; details=[]
          patch_text=""
          if root.is_dir():
              patch_logs=[p for p in root.glob("patch-*-err.log") if p.is_file()]
              patch_text="\n".join(p.read_text(errors="replace")[-131072:] for p in patch_logs[-12:])
          if re.search(r"(patch failed:|patch does not apply|corrupt patch at line|Applying patch failed:)", install+"\n"+patch_text, re.I):
              category="patch"
              patch_names = re.findall(r"Applying patch\s+([^\s\r\n]+)", install)
              if patch_names:
                  name = pathlib.PurePosixPath(patch_names[-1].replace("\\", "/")).name
                  if re.fullmatch(r"[A-Za-z0-9_.+-]{1,120}", name):
                      details.append("patch_name=" + name)
              match = re.search(
                  r"(?:patch failed:\s*|error:\s*)([^:\r\n]+?)(?::\d+|:\s*patch does not apply)",
                  patch_text, re.I,
              )
              if match:
                  name = pathlib.PurePosixPath(match.group(1).strip().replace("\\", "/")).name
                  if re.fullmatch(r"[A-Za-z0-9_.+-]{1,120}", name):
                      details.append("patch_file=" + name)
              if re.search(r"corrupt patch at line", patch_text, re.I):
                  details.append("patch_reason=corrupt")
              elif re.search(r"(?:patch failed:|patch does not apply)", patch_text, re.I):
                  details.append("patch_reason=context")
              else:
                  details.append("patch_reason=unknown")
          elif re.search(r"(undefined reference|collect2: error|ld(?:\.lld)?: error)", text, re.I):
              category="link-error"
          elif re.search(r"(?:fatal\s+)?error\s*:", text, re.I):
              category="compiler-error"
          elif re.search(r"CMake Error", text):
              category="cmake-error"
          elif re.search(r"(FAILED:|ninja: build stopped|make(?:\[[0-9]+\])?: \*\*\*)", text):
              category="build-error"
          missing = re.search(r"Could not find a package configuration file provided by\s+['\"]?([A-Za-z0-9+_.-]+)", text, re.I)
          if missing:
              category="missing-cmake-package"
              details.append("missing_package="+missing.group(1).lower())
          cmake = re.search(r"CMake Error at ([^:\r\n]+):(\d+)", text)
          if cmake:
              name=pathlib.PurePosixPath(cmake.group(1).replace("\\","/")).name
              if re.fullmatch(r"[A-Za-z0-9_.+-]{1,120}",name):
                  details.append("cmake_source="+name)
          undefined = re.search(r"undefined reference to [\x60'\"]?([A-Za-z_][A-Za-z0-9_@$.:+<>~/-]{0,127})", text, re.I)
          if undefined:
              details.append("undefined_symbol="+undefined.group(1))
          if names:
              details.append("reported_logs="+",".join(names[-6:]))
          if files:
              name=files[0].name
              if re.fullmatch(r"[A-Za-z0-9_.+~-]{1,120}",name):
                  details.append("terminal_log="+name)
          print("FREERDP_V23_INSTALL_FAILURE package="+package+" category="+category+
                ((" "+" ".join(details)) if details else ""))
          PY
            exit "$rc"
          fi
      - name: Configure relocated client without pkg-config
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/freerdp-v22-installed/x64-linux-static-release"
          src="$RUNNER_TEMP/freerdp-v22-consumer"
          build="$RUNNER_TEMP/freerdp-v22-consumer-build"
          mkdir -p "$src"
          cat >"$src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.31)
          project(freerdp_v22_relocated LANGUAGES C)
          find_package(FreeRDP-Client 3.31.1 EXACT CONFIG REQUIRED)
          foreach(target IN ITEMS freerdp-client FreeRDP::libusb-static)
            if(NOT TARGET ${target})
              message(FATAL_ERROR "missing target ${target}")
            endif()
          endforeach()
          get_target_property(_closure FreeRDP::libusb-static INTERFACE_LINK_LIBRARIES)
          if(NOT _closure)
            message(FATAL_ERROR "empty libusb static closure")
          endif()
          list(LENGTH _closure _closure_count)
          if(NOT _closure_count EQUAL 2)
            message(FATAL_ERROR "unexpected libusb static closure count")
          endif()
          set(_names)
          foreach(item IN LISTS _closure)
            if(NOT IS_ABSOLUTE "${item}" OR NOT EXISTS "${item}")
              message(FATAL_ERROR "non-relocatable or missing static closure item")
            endif()
            get_filename_component(_name "${item}" NAME)
            list(APPEND _names "${_name}")
          endforeach()
          list(SORT _names)
          if(NOT _names STREQUAL "libudev.a;libusb-1.0.a")
            message(FATAL_ERROR "unexpected Linux libusb static closure")
          endif()
          add_executable(static_usb_probe main.c)
          target_link_libraries(static_usb_probe PRIVATE FreeRDP::libusb-static)
          CMAKE
          cat >"$src/main.c" <<'C'
          struct libusb_context;
          int libusb_init(struct libusb_context**);
          void libusb_exit(struct libusb_context*);
          struct udev;
          struct udev* udev_new(void);
          struct udev* udev_unref(struct udev*);
          int main(void) {
            struct libusb_context* usb = 0;
            struct udev* udev = udev_new();
            if (!udev || libusb_init(&usb) != 0) return 1;
            libusb_exit(usb);
            udev_unref(udev);
            return 0;
          }
          C
          cmake -S "$src" -B "$build" -G Ninja \
            "-DCMAKE_PREFIX_PATH=$prefix" \
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=TRUE
          cmake --build "$build" --target static_usb_probe --verbose
          "$build/static_usb_probe"
          echo "FREERDP_V23_RELOCATED_CLIENT_LINK_QUALIFIED"
