name: Public offline decryption tools bundle
on:
  push:
    branches: [test/frdpd-124-completion-20261001]
    paths: [.github/workflows/public-offline-review-tools.yml]
permissions:
  contents: read
jobs:
  public-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: a45e17c8c9afe4fa402edec5ab007f4c12d74ce5
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Verify public wheelhouse and archive pinned public repository
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a45e17c8c9afe4fa402edec5ab007f4c12d74ce5
          python tools/verify_wheelhouse.py
          git archive --format=tar.gz --output="$RUNNER_TEMP/public-builder-tools.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-offline-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/public-builder-tools.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - if: always()
        run: rm -f "$RUNNER_TEMP/public-builder-tools.tar.gz"
