name: Isolated native topology and PAM diagnosis
on:
  push:
    branches: [investigate/frdpd-103-mstsc-20260924]
    paths: ['.github/workflows/frdpd-103-focused.yml']
permissions:
  contents: read
concurrency:
  group: frdpd-103-focused-${{ github.ref }}
  cancel-in-progress: true
env:
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Initialize encrypted evidence
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          mkdir -p "$RUNNER_TEMP/focused-private" "$RUNNER_TEMP/focused-cipher"
          chmod 700 "$RUNNER_TEMP/focused-private"
      - name: Prepare exact private candidate without executing project code
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          umask 077
          python - <<'PY'
          import os,subprocess,urllib.request,json,base64,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'focused-private'; source=root/'source'
          ask=root/'askpass'
          ask.write_text('#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%s\\n" "$SOURCE_READ_TOKEN" ;; esac\n'); ask.chmod(0o700)
          env=dict(os.environ,GIT_ASKPASS=str(ask),GIT_TERMINAL_PROMPT='0')
          try:
              with (root/'prepare.log').open('w') as log:
                  def git(*args): return subprocess.run(['git',*args],env=env,stdout=log,stderr=log,timeout=600,check=True)
                  git('init',str(source)); git('-C',str(source),'remote','add','origin','https://github.com/dobord/frdpd.git')
                  base='0e665b8dda40cc8a3fb597e94013495fd66ec0c3'
                  git('-C',str(source),'fetch','--depth=1','origin',base); git('-C',str(source),'checkout','--detach','FETCH_HEAD')
                  git('-C',str(source),'-c','url.https://github.com/.insteadOf=git@github.com:','submodule','update','--init','--recursive','--depth=1')
                  sha='283706dd8289dd3f26b88c218dfa54c5eba69621'
                  req=urllib.request.Request('https://api.github.com/repos/dobord/frdpd/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['SOURCE_READ_TOKEN'],'Accept':'application/vnd.github+json'})
                  with urllib.request.urlopen(req,timeout=60) as response: document=json.load(response)
                  patch=base64.b64decode(document['content'])
                  assert hashlib.sha256(patch).hexdigest()=='8b88d4551374ea5db52ca4380e0680d1b43351dda04154e793167fd56ecc5758'
                  assert hashlib.sha1(b'blob '+str(len(patch)).encode()+b'\0'+patch).hexdigest()==sha
                  (root/'candidate.patch').write_bytes(patch)
                  git('-C',str(source),'apply','--index',str(root/'candidate.patch')); git('-C',str(source),'diff','--cached','--check')
                  tree=subprocess.check_output(['git','-C',str(source),'write-tree'],text=True).strip()
                  (root/'provenance.json').write_text(json.dumps({'base_sha':base,'tree_sha':tree,'patch_blob':sha}))
          finally: ask.unlink(missing_ok=True)
          PY
      - name: Build and exercise the actual diagnostic executable inside Docker
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/focused-private"
          build=0
          docker build --build-arg FRDP_BUILD_COMPONENT_TESTS=ON -f "$root/source/server/frdp/test/e2e/Dockerfile" -t frdpd-focused:fixed "$root/source" >"$root/build.log" 2>&1 || build=$?
          echo "build=$build" >"$root/status.txt"
          if [ "$build" -eq 0 ]; then
            touch "$root/image-ready"
            rc=0
            docker run --rm --network none -e FRDP_AGENT_NATIVE_DIAGNOSTICS=1 --entrypoint bash frdpd-focused:fixed -lc 'cmake --build /opt/freerdp-build --parallel 2 && ctest --test-dir /opt/freerdp-build --output-on-failure -R "^(TestFreeRDPFrdpAgentNativeTopology|TestFreeRDPFrdpServiceIpc|TestFreeRDPFrdpRemoteAppContract)$"' >"$root/diagnostic.log" 2>&1 || rc=$?
            echo "diagnostic=$rc" >>"$root/status.txt"
          fi
      - name: Exercise session lifecycle with systemd really running as container PID 1
        if: always()
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/focused-private"
          if [ ! -f "$root/image-ready" ]; then exit 0; fi
          rc=0
          printf 'FROM frdpd-focused:fixed\nRUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends systemd systemd-sysv dbus && apt-get clean\n' >"$root/Systemd.Dockerfile"
          docker build -t frdpd-focused:systemd -f "$root/Systemd.Dockerfile" "$root" >"$root/systemd-build.log" 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            docker run -d --name frdpd-focused-systemd --privileged --cgroupns=private --network none --tmpfs /run --tmpfs /run/lock --tmpfs /tmp --entrypoint /sbin/init frdpd-focused:systemd >"$root/systemd-start.log" 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              ready=0
              for i in $(seq 1 30); do
                if docker exec frdpd-focused-systemd systemctl is-system-running 2>/dev/null | grep -Eq 'running|degraded'; then ready=1; break; fi
                sleep 1
              done
              if [ "$ready" -eq 1 ]; then
                docker exec frdpd-focused-systemd bash -lc 'cmake --build /opt/freerdp-build --parallel 2 && ctest --test-dir /opt/freerdp-build --output-on-failure -R "^(TestFreeRDPFrdpSesmandLogindLifecycle|TestFreeRDPFrdpSesmandScopeRuntimeLimits|TestFreeRDPFrdpSystemdRecovery)$"' >"$root/systemd-tests.log" 2>&1 || rc=$?
              else rc=125; fi
              docker logs frdpd-focused-systemd >"$root/systemd-boot.log" 2>&1
              docker exec frdpd-focused-systemd journalctl --no-pager -n 150 >"$root/systemd-journal.log" 2>&1 || true
            fi
          fi
          echo "systemd=$rc" >>"$root/status.txt"
          docker rm -f frdpd-focused-systemd >/dev/null 2>&1 || true
      - name: Encrypt all diagnostics
        if: always()
        run: |
          python - <<'PY'
          import os,tarfile,json
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']); private=root/'focused-private'; archive=root/'focused.tar.gz'
          with tarfile.open(archive,'w:gz') as tar:
              for p in sorted(private.iterdir()):
                  if p.is_file() and p.name!='askpass': tar.add(p,arcname=p.name)
          encrypt_file(archive,root/'focused-cipher'/'focused.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-focused','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':'0e665b8dda40cc8a3fb597e94013495fd66ec0c3'})
          archive.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-focused-${{ github.run_id }}
          path: ${{ runner.temp }}/focused-cipher/focused.enc
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Clean up and report actual outcomes
        if: always()
        run: |
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']); p=root/'focused-private'/'status.txt'
          statuses=dict(line.split('=',1) for line in p.read_text().splitlines()) if p.exists() else {}
          passed=all(statuses.get(k)=='0' for k in ('build','diagnostic','systemd'))
          shutil.rmtree(root/'focused-private',ignore_errors=True)
          shutil.rmtree(root/'focused-cipher',ignore_errors=True)
          raise SystemExit(0 if passed else 1)
          PY
