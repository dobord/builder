name: FRDPD 124 encrypted review bundle
on:
  push:
    branches: [test/frdpd-124-completion-20261001]
    paths: [.github/workflows/frdpd-124-review-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: 654eb9bccb32e26220c034ab405994a4f563c3ce
      SOURCE_TREE: ab77d228b89c511476542474468c1402a14f7fa4
      ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Verify and prepare public offline tools
        run: |
          python tools/verify_wheelhouse.py
          python tools/tink_offline.py --version
          git archive --format=tar.gz --output="$RUNNER_TEMP/builder-public.tar.gz" a45e17c8c9afe4fa402edec5ab007f4c12d74ce5
      - name: Export exact private source only inside an authenticated envelope
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path.cwd() / 'tools'))
          import tink_offline
          python = tink_offline._venv_python(tink_offline._environment_path())
          program = r'''
          import json, os, subprocess, tarfile, traceback
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          os.umask(0o077)
          root = Path(os.environ['RUNNER_TEMP']) / 'frdpd-review-input'
          root.mkdir(mode=0o700)
          source = root / 'source'
          ask = root / 'askpass'
          ask.write_text('#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%s\\n" "$SOURCE_READ_TOKEN" ;; esac\n')
          ask.chmod(0o700)
          rc = 1
          try:
              env = dict(os.environ, GIT_ASKPASS=str(ask), GIT_TERMINAL_PROMPT='0')
              with (root / 'fetch.log').open('wb') as log:
                  def git(*args):
                      subprocess.run(['git', *args], env=env, stdout=log, stderr=log, check=True, timeout=180)
                  git('init', str(source))
                  git('-C', str(source), 'remote', 'add', 'origin', 'https://github.com/dobord/frdpd.git')
                  git('-C', str(source), 'fetch', '--depth=1', 'origin', os.environ['SOURCE_SHA'])
                  git('-C', str(source), 'checkout', '--detach', 'FETCH_HEAD')
                  tree = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD^{tree}'], text=True).strip()
                  if tree != os.environ['SOURCE_TREE']:
                      raise ValueError('source tree mismatch')
                  git('-C', str(source), 'archive', '--format=tar', '--output=' + str(root / 'source.tar'), 'HEAD')
              (root / 'provenance.json').write_text(json.dumps({'source_sha': os.environ['SOURCE_SHA'], 'tree_sha': tree, 'builder_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT']}))
              rc = 0
          except Exception:
              (root / 'error.log').write_text(traceback.format_exc())
          finally:
              ask.unlink(missing_ok=True)
              os.environ.pop('SOURCE_READ_TOKEN', None)
              archive = root / 'review.tar.gz'
              with tarfile.open(archive, 'w:gz') as out:
                  for name in ('source.tar', 'fetch.log', 'provenance.json', 'error.log'):
                      path = root / name
                      if path.exists(): out.add(path, arcname=name)
              context = {'purpose': 'frdpd-124-source-review-v1', 'source_sha': os.environ['SOURCE_SHA'], 'tree_sha': os.environ['SOURCE_TREE'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'builder_sha': os.environ['GITHUB_SHA'], 'repository': 'dobord/builder'}
              encrypt_file(archive, Path(os.environ['RUNNER_TEMP']) / 'source-review.enc', os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'], context)
          raise SystemExit(rc)
          '''
          raise SystemExit(subprocess.run([str(python), '-c', program], check=False).returncode)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-frdpd-124-source-${{ github.run_id }}
          path: ${{ runner.temp }}/source-review.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-builder-offline-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/builder-public.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - if: always()
        run: rm -rf "$RUNNER_TEMP/frdpd-review-input" "$RUNNER_TEMP/source-review.enc" "$RUNNER_TEMP/builder-public.tar.gz"
