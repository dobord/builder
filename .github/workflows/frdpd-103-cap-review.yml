name: Reviewed GFX contract and regression verification
on:
  push:
    branches: [investigate/frdpd-103-mstsc-20260924]
    paths: ['.github/workflows/frdpd-103-cap-review.yml']
permissions:
  contents: read
concurrency:
  group: frdpd-103-cap-review-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 334cfa8554993578f48de643622cece6737a038b
  CANDIDATE_SHA: 334cfa8554993578f48de643622cece6737a038b
  CANDIDATE_TREE: 5a528eda5c43118340173da77ad37de9311733ab
  BASE_SHA: 3637007a36881a460693be50d66079291c1f4d33
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      full_exit: ${{ steps.full.outputs.rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          mkdir -m 700 "$RUNNER_TEMP/review-private"
      - name: Fetch exact private source without executing it
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os,subprocess,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'review-private';source=root/'source';ask=root/'askpass'
          ask.write_text('#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%s\\n" "$SOURCE_READ_TOKEN" ;; esac\n');ask.chmod(0o700)
          try:
              env=dict(os.environ,GIT_ASKPASS=str(ask),GIT_TERMINAL_PROMPT='0')
              with (root/'fetch.log').open('w') as log:
                  def git(*args): subprocess.run(['git',*args],env=env,stdout=log,stderr=log,timeout=600,check=True)
                  git('init',str(source));git('-C',str(source),'remote','add','origin','https://github.com/dobord/frdpd.git')
                  git('-C',str(source),'fetch','--depth=4','origin',os.environ['SOURCE_SHA']);git('-C',str(source),'checkout','--detach','FETCH_HEAD')
                  assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD^{tree}'],text=True).strip()==os.environ['CANDIDATE_TREE']
                  git('-C',str(source),'-c','url.https://github.com/.insteadOf=git@github.com:','submodule','update','--init','--recursive','--depth=1')
                  (root/'provenance.json').write_text(json.dumps({'commit':os.environ['SOURCE_SHA'],'tree':os.environ['CANDIDATE_TREE'],'source_edits':False}))
          finally: ask.unlink(missing_ok=True)
          PY
      - name: Build the persisted product candidate in Docker
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/review-private"
          docker build --build-arg FRDP_BUILD_COMPONENT_TESTS=ON -f "$root/source/server/frdp/test/e2e/Dockerfile" -t frdpd-cap-review:fixed "$root/source" >"$root/build.log" 2>&1
      - name: Red and green control for the forbidden AVC flag combination
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/review-private"
          cat > "$root/cap-control.py" <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('/src'); path='server/frdp/frdpd/gfx_policy.c'
          texts={'old':subprocess.check_output(['git','-C','/src','show','3637007a36881a460693be50d66079291c1f4d33:'+path],text=True),'fixed':(root/path).read_text()}
          main='\nint main(void) { RDPGFX_CAPSET input={RDPGFX_CAPVERSION_106,4,RDPGFX_CAPS_FLAG_AVC_THINCLIENT}, output={0}; if (frdpd_gfx_select_capability(&input,1,FALSE,&output)!=0) return 2; printf("confirmed_flags=0x%08x\\n",output.flags); return output.flags==RDPGFX_CAPS_FLAG_AVC_DISABLED ? 0 : 1; }\n'
          for label,text in texts.items():
              p=Path('/tmp')/(label+'.c');p.write_text('#include <stdio.h>\n'+text.split('\nBOOL frdpd_gfx_rfx_compress(',1)[0]+main)
              # Match the project's GNU C dialect. WinPR's public SSPI header itself
              # uses deprecated typedefs; this is not a warning in our selector.
              command=['cc','-std=gnu11','-Wall','-Wextra','-Werror','-Wno-deprecated-declarations','-I/src/server/frdp/frdpd','-I/src/freerdp/include','-I/opt/freerdp-build/include','-I/src/freerdp/winpr/include','-I/opt/freerdp-build/winpr/include',str(p),'-o','/tmp/'+label]
              subprocess.run(command,check=True)
              result=subprocess.run(['/tmp/'+label],capture_output=True,text=True)
              print(label, result.returncode, result.stdout.strip(), flush=True)
              assert result.returncode==(1 if label=='old' else 0)
          PY
          docker run --rm --init --network none -v "$root/cap-control.py:/control.py:ro" --entrypoint python3 frdpd-cap-review:fixed /control.py >"$root/red-green.log" 2>&1
      - name: Focused protocol and E2E assertion regressions
        run: |
          set -euo pipefail
          docker run --rm --init --network none --entrypoint bash frdpd-cap-review:fixed -lc 'ctest --test-dir /opt/freerdp-build --timeout 120 --output-on-failure --no-tests=error -R "TestFreeRDPFrdp(GfxPolicy|RemoteAppContract|GraphicsAdapter|E2EScripts|ListenerPolicyBoundary|SessionResources|X11WindowCapture.*|SharedBuffer|AgentStop|AgentNativeTopology)$"' >"$RUNNER_TEMP/review-private/focused.log" 2>&1
      - name: Full wrapper without excluding failures
        id: full
        run: |
          set -uo pipefail
          rc=0
          docker run --rm --init --network none --entrypoint bash frdpd-cap-review:fixed -lc 'FRDP_BUILD_DIR=/opt/freerdp-build FRDP_BUILD_JOBS=2 /src/scripts/test.sh' >"$RUNNER_TEMP/review-private/full.log" 2>&1 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" > "$RUNNER_TEMP/review-private/full-exit.txt"
      - name: Complete independent RemoteApp and classic E2E on both backends
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/review-private"
          for backend in xorg-dummy xorg-native; do
            FRDP_E2E_NO_BUILD=1 FRDP_E2E_IMAGE=frdpd-cap-review:fixed FRDP_LAYERED_DISPLAY_BACKEND="$backend" FRDP_E2E_PROFILE_TIMEOUT=300 FRDP_E2E_ARTIFACTS="$root/e2e-$backend" COMPOSE_PROJECT_NAME="capreview-${backend}-${GITHUB_RUN_ID}" bash "$root/source/server/frdp/test/e2e/run-layered.sh" >"$root/e2e-$backend.log" 2>&1
          done
      - name: Local authentication, graphics, resize and reconnect scenario
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/review-private"
          FRDP_BUILD_COMPONENT_TESTS=ON FRDP_E2E_IMAGE=frdpd-cap-review:fixed FRDP_E2E_PROFILE_TIMEOUT=600 FRDP_E2E_ARTIFACTS="$root/local/artifacts" COMPOSE_PROJECT_NAME="capreview-local-${GITHUB_RUN_ID}" bash "$root/source/server/frdp/test/e2e/run.sh" local >"$root/local.log" 2>&1
      - name: Export exact runtime and encrypt runner input
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/review-private"
          docker run --name review-export --network none --entrypoint bash frdpd-cap-review:fixed -lc 'rm -rf /src /opt/freerdp-pristine-source /opt/freerdp-pristine-build; find /opt/freerdp-build -type d -name CMakeFiles -prune -exec rm -rf {} +; rm -rf /opt/freerdp-build/Testing; apt-get clean' >"$root/export.log" 2>&1
          docker export review-export | gzip -1 > "$root/native-rootfs.tar.gz"
          docker rm review-export >>"$root/export.log"
          python - <<'PY'
          import os
          from pathlib import Path
          from secure_release.crypto import encrypt_file,public_text
          root=Path(os.environ['RUNNER_TEMP'])
          encrypt_file(root/'review-private'/'native-rootfs.tar.gz',root/'native.enc',public_text(os.environ['BUILDER_INPUT_PRIVATE_KEY']),{'purpose':'frdpd-103-native-input','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA']})
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-native-input-${{ github.run_id }}
          path: ${{ runner.temp }}/native.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Encrypt detailed Linux evidence
        if: always()
        run: |
          python - <<'PY'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'review.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for p in (root/'review-private').glob('*'):
                  if p.name not in ('source','askpass','native-rootfs.tar.gz'):out.add(p,arcname=p.name)
          encrypt_file(archive,root/'review.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-reviewed-linux','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA']})
          archive.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-review-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/review.enc
          retention-days: 1
          compression-level: 0
      - if: always()
        run: |
          sudo rm -rf "$RUNNER_TEMP/review-private" "$RUNNER_TEMP/review.enc" "$RUNNER_TEMP/native.enc"
  full-regression-gate:
    needs: linux
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report real full wrapper status, not just focused tests
        env:
          FULL_EXIT: ${{ needs.linux.outputs.full_exit }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$FULL_EXIT" = 0
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          mkdir -m 700 "$RUNNER_TEMP/rpm-private"
      - name: Fetch authorized source data
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'rpm-private';source=root/'source';ask=root/'askpass'
          ask.write_text('#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%s\\n" "$SOURCE_READ_TOKEN" ;; esac\n');ask.chmod(0o700)
          try:
              env=dict(os.environ,GIT_ASKPASS=str(ask),GIT_TERMINAL_PROMPT='0')
              with (root/'fetch.log').open('w') as log:
                  def git(*args):subprocess.run(['git',*args],env=env,stdout=log,stderr=log,timeout=600,check=True)
                  git('init',str(source));git('-C',str(source),'remote','add','origin','https://github.com/dobord/frdpd.git')
                  git('-C',str(source),'fetch','--depth=4','origin',os.environ['SOURCE_SHA']);git('-C',str(source),'checkout','--detach','FETCH_HEAD')
                  assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD^{tree}'],text=True).strip()==os.environ['CANDIDATE_TREE']
                  git('-C',str(source),'-c','url.https://github.com/.insteadOf=git@github.com:','submodule','update','--init','--recursive','--depth=1')
          finally: ask.unlink(missing_ok=True)
          PY
      - name: RPM dependency bootstrap, strict ABI and actual package build in Fedora
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rpm-private"
          cat > "$root/run-rpm.sh" <<'SH'
          set -euo pipefail
          dnf -y install git rpm-build dnf-plugins-core
          git config --global --add safe.directory /src
          cd /src
          git show 3637007a36881a460693be50d66079291c1f4d33:packaging/rpm/frdpd.spec >/tmp/old.spec
          if rpmspec --parse /tmp/old.spec >/evidence/old-parse.log 2>&1; then echo 'Old spec unexpectedly parsed' >&2; exit 1; fi
          grep -F 'Version required' /evidence/old-parse.log
          rpmspec --parse packaging/rpm/frdpd.spec >/evidence/bootstrap-parse.log
          dnf -y builddep packaging/rpm/frdpd.spec
          abi=$(pkg-config --variable=abi_videodrv xorg-server)
          test -n "$abi"
          rpmspec -q --requires packaging/rpm/frdpd.spec >/evidence/resolved-requires.log
          grep -Fx "xorg-x11-server(Xorg-ABI-VIDEODRV) = $abi" /evidence/resolved-requires.log
          git config --global --add safe.directory /src/freerdp
          bash scripts/apply-freerdp-patches.sh
          mkdir -p /root/rpmbuild/SOURCES
          tar --exclude-vcs --exclude=server/frdp/test/e2e/artifacts --transform='s,^,frdpd-0.1.0/,' -czf /root/rpmbuild/SOURCES/frdpd-0.1.0.tar.gz .
          rpmbuild --define '_smp_mflags -j2' -ba packaging/rpm/frdpd.spec
          xorg=$(find /root/rpmbuild/RPMS -name 'frdpd-xorg-0.1.0-*.x86_64.rpm' -print -quit)
          test -n "$xorg"
          rpm -qp --requires "$xorg" >/evidence/package-requires.log
          grep -Fx "xorg-x11-server(Xorg-ABI-VIDEODRV) = $abi" /evidence/package-requires.log
          rpm -qpl "$xorg" >/evidence/package-files.log
          grep -Fx '/usr/lib64/frdpd/xorg/modules/frdp_drv.so' /evidence/package-files.log
          ! grep -F '/root/rpmbuild' /evidence/package-files.log
          SH
          docker run --rm --init -v "$root/source:/src" -v "$root:/evidence" --entrypoint bash fedora:42 /evidence/run-rpm.sh >"$root/rpm.log" 2>&1
      - name: Encrypt RPM evidence
        if: always()
        run: |
          python - <<'PY'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'rpm.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for p in (root/'rpm-private').glob('*.log'):out.add(p,arcname=p.name)
          encrypt_file(archive,root/'rpm.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-reviewed-rpm','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA']})
          archive.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-review-rpm-${{ github.run_id }}
          path: ${{ runner.temp }}/rpm.enc
          retention-days: 1
          compression-level: 0
      - if: always()
        run: |
          sudo rm -rf "$RUNNER_TEMP/rpm-private" "$RUNNER_TEMP/rpm.enc"
  native:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
        backend: [xorg-dummy, xorg-native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SOURCE_RUN: ${{ github.run_id }}
      TEST_OS: ${{ matrix.os }}
      TEST_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
          architecture: x64
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File investigations/frdpd-103/native-preflight.ps1
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: review-native-input-${{ github.run_id }}
          path: ${{ runner.temp }}/native-cipher
      - name: Authenticate exact candidate runtime
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from secure_release.crypto import decrypt_file
          root=Path(os.environ['RUNNER_TEMP']);(root/'native-private').mkdir(exist_ok=True)
          decrypt_file(root/'native-cipher'/'native.enc',root/'native-private'/'native-rootfs.tar.gz',os.environ['BUILDER_INPUT_PRIVATE_KEY'],{'purpose':'frdpd-103-native-input','run_id':os.environ['SOURCE_RUN'],'source_sha':os.environ['SOURCE_SHA']})
          '@ | python -
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Record actual Windows product and processor architecture
        shell: pwsh
        run: |
          @{ operating_system=(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture); processor=(Get-CimInstance Win32_Processor | Select-Object Architecture); python_architecture='x64' } | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP/native-private/host-product.json"
      - name: Native RemoteApp stability and debug evidence
        shell: pwsh
        run: |
          @'
          import os,json
          from pathlib import Path
          p=Path('investigations/frdpd-103/native.py');s=p.read_text()
          boot="set +e; sudo cloud-init status --wait --format=json; rc=$?; set -e; case $rc in 0|2) ;; *) exit $rc ;; esac; test -f /var/lib/cloud/instance/boot-finished; sudo systemctl is-active --quiet docker; sudo docker info >/dev/null\\n"
          pairs=[('FRDP_DISPLAY_BACKEND=xorg-dummy\\n','FRDP_DISPLAY_BACKEND='+os.environ['TEST_BACKEND']+'\\nWLOG_LEVEL=DEBUG\\n'),('time.monotonic()-stable_since>=10','time.monotonic()-stable_since>=30'),("REPORT.get('stable_window_seconds',0)>=10","REPORT.get('stable_window_seconds',0)>=30"),('sudo cloud-init status --wait; sudo docker info >/dev/null\\n',boot)]
          for old,new in pairs:
              assert s.count(old)==1, 'Fixture contract changed'
              s=s.replace(old,new,1)
          p.write_text(s)
          (Path(os.environ['RUNNER_TEMP'])/'native-private'/'matrix.json').write_text(json.dumps({'os':os.environ['TEST_OS'],'backend':os.environ['TEST_BACKEND'],'source':os.environ['SOURCE_SHA'],'cloud_init_degraded_requires_boot_finished_and_docker':True}))
          '@ | python -
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python investigations/frdpd-103/native.py
          Set-Content "$env:RUNNER_TEMP/native-exit" $LASTEXITCODE
          exit 0
      - name: Encrypt all native session evidence
        if: always()
        shell: pwsh
        run: |
          @'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'native.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for p in (root/'native-private').glob('*'):
                  if p.is_file() and p.suffix in ('.log','.json','.png','.txt'):out.add(p,arcname=p.name)
          encrypt_file(archive,root/'native.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-reviewed-native','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA'],'os':os.environ['TEST_OS'],'backend':os.environ['TEST_BACKEND']})
          archive.unlink()
          '@ | python -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-review-${{ matrix.os }}-${{ matrix.backend }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native.enc
          retention-days: 1
          compression-level: 0
      - name: Clean and report actual native result
        if: always()
        shell: pwsh
        run: |
          Get-Process qemu-system-x86_64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $rc=1
          if (Test-Path "$env:RUNNER_TEMP/native-exit") {$rc=[int](Get-Content "$env:RUNNER_TEMP/native-exit")}
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP/native-private","$env:RUNNER_TEMP/native-cipher" -ErrorAction SilentlyContinue
          exit $rc
