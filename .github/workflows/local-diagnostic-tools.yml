name: Offline local diagnostic tools
# No private inputs or decryption in Actions. Public source fixtures only.
# Include current archive aliases and the pinned HarfBuzz declaration sources.
on:
  push:
    branches: [feature/cef-static-integration]
    paths: [.github/workflows/local-diagnostic-tools.yml]
permissions:
  contents: read
jobs:
  public-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Package tracked public source and hash-pinned wheels only
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/local-diagnostic-tools"
          mkdir -p "$kit/wheels" "$kit/upstream"
          python -m pip download --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock -d "$kit/wheels"
          git archive --format=tar HEAD > "$kit/builder-source.tar"
          cp requirements.lock "$kit/requirements.lock"
          git rev-parse HEAD > "$kit/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$kit/source-tree.txt"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "$kit/upstream/cef-source.tar.gz" https://github.com/dobord/cef/archive/2aff22e09daaa5c28780c5766a70ee13e61c93b6.tar.gz
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "$kit/upstream/freerdp-source.tar.gz" https://github.com/FreeRDP/FreeRDP/archive/63b948ca5cb94307fd5444ee6e73927a41ccdab4.tar.gz
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "$kit/upstream/harfbuzz-source.tar.gz" https://github.com/harfbuzz/harfbuzz/archive/14.2.1.tar.gz
          echo "b7642a81eb021bf96cf8c91c5ebdde7f4fdfd40c76db722f00cf001125f4b81b954d08485774d2b23318d49b1e954fa0189ba8f10db56d148f33f9d90891d0cb  $kit/upstream/harfbuzz-source.tar.gz" | sha512sum -c -
          mkdir -p "$kit/upstream/vcpkg/scripts"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "$kit/upstream/vcpkg/scripts/ports.cmake" https://raw.githubusercontent.com/microsoft/vcpkg/9e593bb18ea69cc5095e012465dcd675a822ed0d/scripts/ports.cmake
          for path in base/BUILD.gn base/debug/stack_trace_posix.cc base/debug/stack_trace_android.cc base/debug/debug.gni build/config/c++/c++.gni ui/gfx/x/BUILD.gn ui/gfx/x/xlib_support.cc ui/gfx/x/xlib.h ui/gfx/x/xlib_support.h ui/gfx/x/xlib_xcb.h ui/gtk/gtk_ui.cc third_party/expat/BUILD.gn tools/generate_library_loader/generate_library_loader.gni tools/generate_library_loader/generate_library_loader.py; do
            mkdir -p "$kit/upstream/$(dirname "$path")"
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "$kit/upstream/$path" "https://raw.githubusercontent.com/chromium/chromium/79460ebecaa5625e57a5fb679a735659e73dc687/$path"
          done
          mkdir -p "$kit/upstream/third_party/webrtc/modules/desktop_capture"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' 'https://webrtc.googlesource.com/src/+/6f37672d358475cd17544121a12494da454d85fb/modules/desktop_capture/BUILD.gn?format=TEXT' | base64 --decode > "$kit/upstream/third_party/webrtc/modules/desktop_capture/BUILD.gn"
          (cd "$kit" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          python -m pip install --disable-pip-version-check --no-index --find-links="$kit/wheels" --require-hashes --only-binary=:all: -r requirements.lock
          python -m unittest discover -s tests -p test_encrypted_logs.py -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-local-diagnostic-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/local-diagnostic-tools
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
