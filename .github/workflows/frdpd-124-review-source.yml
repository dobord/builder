name: FRDPD PR 124 encrypted source review
on:
  push:
    branches: [test/frdpd-124-verify-7b46685-20260930]
    paths: ['.github/workflows/frdpd-124-review-source.yml']
permissions:
  contents: read
jobs:
  review-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Encrypt exact private source without publishing plaintext
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          os.umask(0o077)
          root = Path(os.environ['RUNNER_TEMP']) / 'source-review'
          root.mkdir(mode=0o700)
          source = root / 'source'
          sha = '654eb9bccb32e26220c034ab405994a4f563c3ce'
          expected_tree = 'ab77d228b89c511476542474468c1402a14f7fa4'
          ask = root / 'askpass'
          ask.write_text('#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%s\\n" "$SOURCE_READ_TOKEN" ;; esac\n')
          ask.chmod(0o700)
          try:
              env = dict(os.environ, GIT_ASKPASS=str(ask), GIT_TERMINAL_PROMPT='0')
              with (root / 'fetch.log').open('w') as log:
                  def git(*args):
                      subprocess.run(['git', *args], env=env, stdout=log, stderr=log, check=True, timeout=120)
                  git('init', str(source))
                  git('-C', str(source), 'remote', 'add', 'origin', 'https://github.com/dobord/frdpd.git')
                  git('-C', str(source), 'fetch', '--depth=1', 'origin', sha)
              tree = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'FETCH_HEAD^{tree}'], text=True).strip()
              if tree != expected_tree:
                  raise ValueError('source tree mismatch')
          finally:
              ask.unlink(missing_ok=True)
              os.environ.pop('SOURCE_READ_TOKEN', None)
          archive = root / 'source.tar.gz'
          subprocess.run(['git', '-C', str(source), 'archive', '--format=tar.gz', '--output=' + str(archive), sha], check=True, timeout=120)
          provenance = {'repository': 'dobord/frdpd', 'source_sha': sha, 'tree_sha': tree, 'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(), 'builder_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID']}
          subprocess.run(['openssl', 'cms', '-encrypt', '-binary', '-aes-256-gcm', '-outform', 'DER', '-in', str(archive), '-out', str(root / 'source.cms'), '-recip', 'investigations/frdpd-124/session-review-cert.pem', '-keyopt', 'rsa_padding_mode:oaep', '-keyopt', 'rsa_oaep_md:sha256'], check=True, timeout=60)
          archive.unlink()
          (root / 'provenance.json').write_text(json.dumps(provenance, indent=2))
          print(json.dumps(provenance, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frdpd-124-private-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-review/source.cms
            ${{ runner.temp }}/source-review/provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - if: always()
        run: rm -rf "$RUNNER_TEMP/source-review"
