name: FreeRDP static configure failure identity
on:
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/freerdp-static-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: freerdp-static-configure-diagnostic
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: 52bef1a3c2bfef7d20f2ad9f7f9ce86ad7a91534
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: private-vcpkg/.freerdp-diag-upstream
          persist-credentials: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 autoconf autoconf-archive automake libtool pkg-config ninja-build nasm yasm
      - name: Reproduce and classify FreeRDP configure
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
          VCPKG_DISABLE_METRICS: "1"
          VCPKG_BINARY_SOURCES: clear
        run: |
          set -euo pipefail
          upstream="$GITHUB_WORKSPACE/private-vcpkg/.freerdp-diag-upstream"
          test "$(git -C private-vcpkg rev-parse HEAD)" = "52bef1a3c2bfef7d20f2ad9f7f9ce86ad7a91534"
          bash "$upstream/bootstrap-vcpkg.sh" -disableMetrics >"$RUNNER_TEMP/freerdp-bootstrap.log" 2>&1
          set +e
          "$upstream/vcpkg" install 'freerdp[client,ffmpeg,proxy,server,urbdrc,winpr-tools,x11]'             --triplet=x64-linux-static-release             --host-triplet=x64-linux-static-release             "--overlay-ports=$GITHUB_WORKSPACE/private-vcpkg/ports"             "--overlay-triplets=$GITHUB_WORKSPACE/private-vcpkg/triplets"             "--x-install-root=$RUNNER_TEMP/freerdp-installed"             --binarysource=clear >"$RUNNER_TEMP/freerdp-install.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "FREERDP_STATIC_CONFIGURE_QUALIFIED"
            exit 0
          fi
          python - <<'PY'
          import os, pathlib, re
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          runner = pathlib.Path(os.environ["RUNNER_TEMP"])
          buildtrees = workspace / "private-vcpkg/.freerdp-diag-upstream/buildtrees"
          root = buildtrees / "freerdp"
          install_text = (runner / "freerdp-install.log").read_text(errors="replace")[-1048576:]
          pieces = [install_text]
          recent = []
          if buildtrees.is_dir():
              recent = sorted(
                  [p for p in buildtrees.rglob("*") if p.is_file() and
                   (p.suffix in {".log", ".txt"} or "config" in p.name.lower())],
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )[:40]
              pieces.extend(p.read_text(errors="replace")[-262144:] for p in recent)
          text = "\n".join(pieces)
          package = "unknown"
          for pattern in (
              r"error: building ([a-z0-9][a-z0-9+_.-]*):",
              r"BUILD_FAILED[^\n]*?([a-z0-9][a-z0-9+_.-]+):x64-linux-static-release",
              r"([a-z0-9][a-z0-9+_.-]+):x64-linux-static-release failed",
          ):
              match = re.search(pattern, install_text, re.I)
              if match:
                  package = match.group(1).lower()
                  break
          if package == "unknown" and recent:
              try:
                  candidate = recent[0].relative_to(buildtrees).parts[0].lower()
                  if re.fullmatch(r"[a-z0-9][a-z0-9+_.-]*", candidate):
                      package = candidate
              except (ValueError, IndexError):
                  pass
          build_stage = (
              "build" if re.search(r"vcpkg_execute_build_process\.cmake", install_text, re.I)
              else "configure"
          )
          category, token = "unknown", ""
          if build_stage == "build":
              # Do not mistake non-fatal CMake feature-summary lines for the
              # package failure once vcpkg has already entered the build step.
              compiler = re.search(
                  r"(?:fatal\s+)?error(?:\s+([A-Z][0-9]{4}))?\s*:",
                  text, re.I,
              )
              linker = re.search(
                  r"(?:undefined reference|collect2: error|ld(?:\.lld)?: error|LNK[0-9]{4})",
                  text, re.I,
              )
              if linker:
                  category = "link-error"
              elif compiler:
                  category = "compiler-error"
                  raw = (compiler.group(1) or "").lower()
                  if re.fullmatch(r"[a-z][0-9]{4}", raw):
                      token = raw
              elif re.search(r"(?:FAILED:|ninja: build stopped|make(?:\[[0-9]+\])?: \*\*\*)", text):
                  category = "build-error"
          else:
              patterns = [
                  ("missing-cmake-package", r"Could not find a package configuration file provided by\s+['\"]?([A-Za-z0-9+_.-]+)"),
                  ("missing-feature", r"(?:Could NOT find|Could not find)\s+([A-Za-z0-9+_.-]+)"),
                  ("missing-pkgconfig", r"Package\s+['\"]?([A-Za-z0-9+_.-]+)['\"]?[^\n]*(?:not found|was not found)"),
                  ("missing-library", r"(?:Could NOT find|NOTFOUND).*?([A-Za-z0-9+_.-]+)"),
                  ("unknown-option", r"Manually-specified variables were not used by the project:\s*\n\s*([A-Za-z0-9_+.-]+)"),
              ]
              for label, pattern in patterns:
                  m = re.search(pattern, text, re.I)
                  if m:
                      category = label
                      raw = m.group(1).lower()
                      if re.fullmatch(r"[a-z0-9_+.-]+", raw):
                          token = raw
                      break
              if category == "unknown":
                  if re.search(r"find_package\(X11 REQUIRED\)", text, re.I) and re.search(r"X11.*not found", text, re.I):
                      category = "x11"
                  elif re.search(r"libusb", text, re.I) and re.search(r"(not found|NOTFOUND)", text):
                      category = "libusb"
                  elif re.search(r"ffmpeg", text, re.I) and re.search(r"(not found|NOTFOUND)", text):
                      category = "ffmpeg"
                  elif re.search(r"CMake Error", text):
                      category = "cmake-error"
          details = ["stage=" + build_stage]
          if root.is_dir():
              caches = sorted(root.rglob("CMakeCache.txt"), key=lambda p: p.stat().st_mtime, reverse=True)
              if caches:
                  cache = caches[0].read_text(errors="replace")
                  for key in ("WITH_CAIRO", "WITH_SWSCALE", "WITH_FFMPEG"):
                      match = re.search(r"^" + key + r":(?:BOOL|UNINITIALIZED)=(ON|OFF)$", cache, re.M)
                      if match:
                          details.append(key.lower() + "=" + match.group(1).lower())
          source_error = re.search(
              r"(?:^|\n)(?:[^\r\n]*[/\\])?([A-Za-z0-9_.+-]+\.(?:c|cc|cpp|cxx|h|hpp))(?::|\()",
              text, re.I,
          )
          if source_error and category in {"compiler-error", "build-error"}:
              name = source_error.group(1)
              if re.fullmatch(r"[A-Za-z0-9_.+-]+", name):
                  details.append("source=" + name)
          cmake_error = re.search(r"CMake Error at ([^:\r\n]+):(\d+)", text)
          if cmake_error:
              source = pathlib.PurePosixPath(cmake_error.group(1).replace("\\", "/")).name
              if re.fullmatch(r"[A-Za-z0-9_.+-]+", source):
                  details.append("cmake_source=" + source)
          suffix = (" token=" + token) if token else ""
          if details:
              suffix += " " + " ".join(details)
          if not re.fullmatch(r"[a-z0-9][a-z0-9+_.-]*|unknown", package):
              package = "unknown"
          print("FREERDP_STATIC_CONFIGURE_FAILURE package=" + package + " category=" + category + suffix)
          PY
          exit "$rc"
