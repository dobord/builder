name: Encrypted Docker endurance qualification
on:
  push:
    branches: [ci/encrypted-docker-endurance]
permissions: {}
concurrency:
  group: encrypted-docker-endurance
  cancel-in-progress: false
jobs:
  endurance:
    if: >-
      github.repository_id == '1372874997' &&
      github.sha == vars.ENDURANCE_CI_RUN_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install only reviewed offline crypto wheels
        run: >-
          python -m pip install --disable-pip-version-check --no-index
          --find-links vendor/wheels --require-hashes --only-binary=:all:
          -r requirements.lock
      - name: Authenticate private snapshot, execute Docker recipe, encrypt evidence
        env:
          ENDURANCE_INPUT_PRIVATE_KEY: ${{ secrets.ENDURANCE_CI_INPUT_PRIVATE_KEY }}
          ENDURANCE_VERIFY_PUBLIC_KEY: ${{ secrets.ENDURANCE_CI_VERIFY_PUBLIC_KEY }}
          ENDURANCE_INPUT_PUBLIC_KEY_B64: ${{ secrets.ENDURANCE_CI_INPUT_PUBLIC_KEY_B64 }}
        run: python -m secure_release.docker_endurance run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-endurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-endurance/evidence.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove remaining private staging
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/docker-endurance" "$RUNNER_TEMP/cipher-endurance"
