name: Isolated native mstsc RemoteApp regression
on:
  push:
    branches: [investigate/frdpd-103-mstsc-20260924]
    paths: ['.github/workflows/frdpd-103-native.yml', 'investigations/frdpd-103/native.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frdpd-103-native-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_RUN: '35965044177'
  SOURCE_SHA: 642e9f0e372dfe1e3b74bd735878318988e58e91
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  native:
    if: github.ref == 'refs/heads/investigate/frdpd-103-mstsc-20260924'
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Install hash-pinned encryption libraries
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: frdpd-103-native-input-${{ env.SOURCE_RUN }}
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-cipher
      - name: Authenticate input and decrypt without executing project code
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from secure_release.crypto import decrypt_file
          root=Path(os.environ['RUNNER_TEMP']); private=root/'native-private'
          private.mkdir(exist_ok=True)
          decrypt_file(root/'native-cipher'/'native.enc',private/'native-rootfs.tar.gz',os.environ['BUILDER_INPUT_PRIVATE_KEY'],{'purpose':'frdpd-103-native-input','run_id':os.environ['SOURCE_RUN'],'source_sha':os.environ['SOURCE_SHA']})
          '@ | python -
      - name: Native mstsc and disposable Docker server without source credentials
        shell: pwsh
        run: |
          python investigations/frdpd-103/native.py
          $rc=$LASTEXITCODE
          Set-Content -Path "$env:RUNNER_TEMP/native-exit" -Value $rc
          Write-Output 'Native test finished; all detailed output is encrypted.'
          exit 0
      - name: Encrypt native screenshots and diagnostic evidence
        if: always()
        shell: pwsh
        run: |
          @'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']); private=root/'native-private'
          archive=root/'native-diagnostics.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              if private.exists():
                  for path in sorted(private.iterdir()):
                      if path.is_file() and path.suffix in ('.log','.json','.png','.txt'):
                          out.add(path,arcname=path.name)
          encrypt_file(archive,root/'native-diagnostics.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-native','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA']})
          archive.unlink()
          '@ | python -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-native-mstsc-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-diagnostics.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove disposable guest and report actual status
        if: always()
        shell: pwsh
        run: |
          Get-Process qemu-system-x86_64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $rc=1
          if (Test-Path "$env:RUNNER_TEMP/native-exit") { $rc=[int](Get-Content "$env:RUNNER_TEMP/native-exit") }
          Remove-Item -Force -Recurse "$env:RUNNER_TEMP/native-private","$env:RUNNER_TEMP/native-cipher" -ErrorAction SilentlyContinue
          exit $rc
