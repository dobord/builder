name: Public synthetic security tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-metadata-probe:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'diagnostics/project-ci-public-metadata'
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Check anonymous access to public metadata
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          urls = {'raw baseline': 'https://raw.githubusercontent.com/microsoft/vcpkg/9e593bb18ea69cc5095e012465dcd675a822ed0d/versions/baseline.json'}
          paths = (
              'repos/google/googletest/git/ref/tags/v1.18.0',
              'repos/google/benchmark/git/ref/tags/v1.9.5',
              'repos/nlohmann/json/git/ref/tags/v3.12.0',
              'repos/nlohmann/json/git/tags/65ee68451d8eb2b5f3a30b410476ab83deb3289b',
              'repos/zeux/pugixml/git/ref/tags/v1.16',
              'repos/actions/checkout/git/matching-refs/tags',
              'repos/actions/upload-artifact/git/matching-refs/tags',
              'repos/actions/cache/git/matching-refs/tags',
              'repos/mymindstorm/setup-emsdk/git/matching-refs/tags',
              'repositories/203863565/git/matching-refs/tags',
          )
          urls.update((path, 'https://api.github.com/' + path) for path in paths)
          class SameHostRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  from urllib.parse import urlsplit
                  source, target = urlsplit(req.full_url), urlsplit(newurl)
                  if source.hostname != 'api.github.com' or target.scheme != 'https' or target.hostname != source.hostname:
                      return None
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          opener = urllib.request.build_opener(SameHostRedirect())
          for label, url in urls.items():
              req = urllib.request.Request(url, headers={'User-Agent': 'builder-dependency-review', 'Content-Type': 'application/json'})
              try:
                  with opener.open(req, timeout=20) as r:
                      data = r.read(16777217)
                      print(label, 'HTTP', r.status, 'quota', r.headers.get('X-RateLimit-Remaining'), 'bytes', len(data))
                      json.loads(data)
              except urllib.error.HTTPError as e:
                  print(label, 'HTTP', e.code, 'quota', e.headers.get('X-RateLimit-Remaining'), 'retry-after', e.headers.get('Retry-After'))
              except (OSError, ValueError) as e:
                  print(label, type(e).__name__)
          PY
  security-tests:
    if: github.ref_name != 'diagnostics/project-ci-public-metadata'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify and install cryptographic libraries from offline wheelhouse
        run: |
          python tools/verify_wheelhouse.py
          python -m pip install --disable-pip-version-check --no-index --find-links=vendor/wheels --require-hashes --only-binary=:all: -r requirements.lock
          python tools/tink_offline.py --version
      - name: Install hash-pinned CMake build tool
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r build-tools.lock
      - name: Compile Python modules before running expensive tests
        run: python -m compileall -q secure_release tests
      - name: Install hash-pinned project-CI manifest parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r project-ci-requirements.lock
      - name: Synthetic tests only; no repository secrets
        env:
          REQUIRE_TINK_TESTS: '1'
        run: python -m secure_release.logged_run --output "${{ runner.temp }}/synthetic-security-tests.log" -- python -m unittest discover -s tests -v
      - name: Public integration prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build nasm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: public-upstream
          persist-credentials: false
      - name: Real vcpkg regression with PUBLIC sources only
        run: python -m secure_release.logged_run --output "${{ runner.temp }}/public-vcpkg-integration.log" -- python tests/public_vcpkg_integration.py public-upstream
      - name: Build encrypted diagnostic artifact
        if: always()
        uses: ./.github/actions/encrypted-logs
        with:
          public_key_b64: ${{ secrets.BUILDER_ENCRYPTED_LOGS_PUBLIC_KEY_B64 }}
          roots: |
            ${{ runner.temp }}
            ${{ github.workspace }}/public-upstream/buildtrees
      - name: Create PUBLIC test ciphertext and disposable test keys
        if: github.event_name != 'pull_request'
        run: python tests/transport_fixture.py create ${{ matrix.platform }}
      - name: Upload PUBLIC synthetic fixtures only
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-test-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-test-fixture/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  artifact-transport:
    needs: security-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify and install cryptographic libraries from offline wheelhouse
        run: |
          python tools/verify_wheelhouse.py
          python -m pip install --disable-pip-version-check --no-index --find-links=vendor/wheels --require-hashes --only-binary=:all: -r requirements.lock
          python tools/tink_offline.py --version
      - name: Verify GitHub API digests and decrypt Linux and Windows fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/transport_fixture.py verify
