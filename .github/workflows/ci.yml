name: Public synthetic security tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install hash-pinned cryptographic libraries and CMake
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r build-tools.lock
      - name: Compile Python modules before running expensive tests
        run: python -m compileall -q secure_release tests
      - name: Synthetic tests only; no repository secrets
        env:
          REQUIRE_TINK_TESTS: '1'
        run: python -m unittest discover -s tests -v
      - name: Public integration prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build nasm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: public-upstream
          persist-credentials: false
      - name: Real vcpkg regression with PUBLIC sources only
        run: python tests/public_vcpkg_integration.py public-upstream
      - name: Create PUBLIC test ciphertext and disposable test keys
        if: github.event_name != 'pull_request'
        run: python tests/transport_fixture.py create ${{ matrix.platform }}
      - name: Upload PUBLIC synthetic fixtures only
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-test-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-test-fixture/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  artifact-transport:
    needs: security-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - name: Verify GitHub API digests and decrypt Linux and Windows fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/transport_fixture.py verify
