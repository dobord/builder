name: Windows CEF DOM memory verification
on:
  push:
    branches: [repair/windows-cef-48-dom-memory]
permissions:
  contents: read
jobs:
  public-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Snapshot exact public builder tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-inputs
          git rev-parse HEAD > public-inputs/builder-commit.txt
          git rev-parse HEAD^{tree} > public-inputs/builder-tree.txt
          git archive HEAD > public-inputs/builder-source.tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chromium/chromium
          ref: 79460ebecaa5625e57a5fb679a735659e73dc687
          path: public-chromium
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /services/data_decoder/xml/dom_builder.h
            /services/data_decoder/xml/dom_builder.cc
            /services/data_decoder/public/cpp/xml_dom.h
            /third_party/rust/cxx/v1/cxx.h
            /third_party/rust/chromium_crates_io/vendor/cxx-v1/include/cxx.h
      - name: Snapshot pinned public XML inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-chromium rev-parse HEAD)" = 79460ebecaa5625e57a5fb679a735659e73dc687
          git -C public-chromium diff --exit-code
          tar -cf public-inputs/chromium-xml-inputs.tar -C public-chromium services/data_decoder/xml/dom_builder.h services/data_decoder/xml/dom_builder.cc services/data_decoder/public/cpp/xml_dom.h third_party/rust/cxx/v1/cxx.h third_party/rust/chromium_crates_io/vendor/cxx-v1/include/cxx.h
          cd public-inputs
          sha256sum builder-source.tar builder-commit.txt builder-tree.txt chromium-xml-inputs.tar > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-dom-memory-inputs-${{ github.run_id }}
          path: public-inputs/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
