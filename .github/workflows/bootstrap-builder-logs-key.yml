name: Bootstrap builder log encryption key
"on":
  workflow_dispatch: {}
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - ".github/workflows/bootstrap-builder-logs-key.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Install pinned Tink runtime
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock

      - name: Generate builder log keypair
        run: python -m secure_release.encrypted_logs keygen --prefix "$RUNNER_TEMP/builder-ci-log-key"

      - name: Store private key in dobord/builder-logs repository secret
        id: store
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          private="$(tr -d '\r\n' < "$RUNNER_TEMP/builder-ci-log-key.private.b64")"
          test -n "$private"
          gh secret set BUILDER_LOGS_PRIVATE_KEY_B64             --repo dobord/builder-logs             --body "$private"
          gh secret list --repo dobord/builder-logs --app actions             | grep -E '^BUILDER_LOGS_PRIVATE_KEY_B64[[:space:]]'
          unset private
          rm -f "$RUNNER_TEMP/builder-ci-log-key.private.b64"
          echo "stored=true" >> "$GITHUB_OUTPUT"

      - name: Upload public key
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: builder-logs-public-key-${{ github.run_id }}
          path: ${{ runner.temp }}/builder-ci-log-key.public.b64
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Upload private-key fallback only when secret storage failed
        if: ${{ steps.store.outputs.stored != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: builder-logs-private-key-fallback-${{ github.run_id }}
          path: ${{ runner.temp }}/builder-ci-log-key.private.b64
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Fail if repository secret storage failed
        if: ${{ steps.store.outputs.stored != 'true' }}
        run: |
          echo "BUILDER_LOGS_SECRET_BOOTSTRAP_FAILED" >&2
          exit 1
