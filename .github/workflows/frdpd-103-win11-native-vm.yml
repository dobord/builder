name: Desktop Windows 11 native-host differential
on:
  push:
    branches: [investigate/frdpd-103-mstsc-20260924]
    paths: ['.github/workflows/frdpd-103-win11-native-vm.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: frdpd-103-win11-native-vm-${{ github.ref }}
  cancel-in-progress: false
env:
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  desktop-win11:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            source: 3637007a36881a460693be50d66079291c1f4d33
            tree: ffa3bd512e739cc396ec56431f0759e501d9c359
            input_run: '36026580121'
            input_name: differential-input-36026580121
          - variant: tcp-reviewed
            source: ca82a3cea02ba7eb1655a2781a24003467300595
            tree: 7e2506adb48269d2d8eabe3aadb4c222d5dd83c8
            input_run: '36035005764'
            input_name: tcp-native-input-36035005764
    runs-on: windows-11-arm
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ matrix.source }}
      CANDIDATE_SHA: ${{ matrix.source }}
      CANDIDATE_TREE: ${{ matrix.tree }}
      SOURCE_RUN: ${{ matrix.input_run }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
          architecture: x64
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/native-private" | Out-Null
      - name: Test LF and CRLF checkout guard without starting a VM
        run: |
          python investigations/frdpd-103/test_native_platform.py
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Install native ARM64 VM dependencies from authenticated distributions
        id: msys
        run: |
          & ./investigations/frdpd-103/install-arm-vm.ps1
      - name: Verify native PE architecture and VM startup before loading private runtime
        env:
          MSYS2_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          python investigations/frdpd-103/native-arm-platform.py
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Fixture-specific first-use consent
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File investigations/frdpd-103/native-preflight.ps1
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.input_name }}
          run-id: ${{ matrix.input_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-cipher
      - name: Authenticate exact baseline or reviewed runtime
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from secure_release.crypto import decrypt_file
          root=Path(os.environ['RUNNER_TEMP'])
          decrypt_file(root/'native-cipher'/'native.enc',root/'native-private'/'native-rootfs.tar.gz',os.environ['BUILDER_INPUT_PRIVATE_KEY'],{'purpose':'frdpd-103-native-input','run_id':os.environ['SOURCE_RUN'],'source_sha':os.environ['SOURCE_SHA']})
          '@ | python -
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Record actual client platform and display driver
        shell: pwsh
        run: |
          @{ operating_system=(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture); processor=(Get-CimInstance Win32_Processor | Select-Object Architecture); video=(Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,VideoProcessor); python_architecture='x64'; qemu_host_architecture='ARM64'; backend='xorg-dummy' } | ConvertTo-Json -Depth 5 | Set-Content "$env:RUNNER_TEMP/native-private/host-product.json"
      - name: Run unchanged mstsc security and capabilities against exact Linux image
        env:
          MSYS2_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          python investigations/frdpd-103/native.py
          Set-Content "$env:RUNNER_TEMP/native-exit" $LASTEXITCODE
          exit 0
      - name: Encrypt native desktop evidence
        if: always()
        shell: pwsh
        run: |
          @'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'native.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for p in (root/'native-private').glob('*'):
                  if p.is_file() and p.suffix in ('.log','.json','.png','.txt'):out.add(p,arcname=p.name)
          encrypt_file(archive,root/'native.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-win11-native-vm','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA'],'input_run':os.environ['SOURCE_RUN'],'variant':os.environ['VARIANT']})
          archive.unlink()
          '@ | python -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-win11-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native.enc
          retention-days: 1
          compression-level: 0
      - name: Clean and report actual result
        if: always()
        shell: pwsh
        run: |
          Get-Process qemu-system-x86_64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $rc=1
          if (Test-Path "$env:RUNNER_TEMP/native-exit") {$rc=[int](Get-Content "$env:RUNNER_TEMP/native-exit")}
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP/native-private","$env:RUNNER_TEMP/native-cipher" -ErrorAction SilentlyContinue
          exit $rc
