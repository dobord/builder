name: Windows CEF Torque size verification
on:
  push:
    branches: [repair/windows-cef-41-tail-size]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4a13eb077cc4425acf398f35f59d3400496b2f6d
          persist-credentials: false
      - name: Snapshot only hash-pinned public V8 files
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tests.cef_windows_layout_inputs import INPUTS, public_input
          root = Path(os.environ['RUNNER_TEMP']) / 'public-v8'
          for path in INPUTS:
              out = root / path
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(public_input(path))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-v8-tail-size-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/public-v8/
          if-no-files-found: error
          retention-days: 3
