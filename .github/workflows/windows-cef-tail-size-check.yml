name: Windows CEF Torque size verification
on:
  push:
    branches: [repair/windows-cef-41-tail-size]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 03abd124ebe3b8a57fb78470a75b5aa3ce064e31
          path: private-cef
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify and install the exact offline cryptography wheelhouse
        run: |
          python tools/verify_wheelhouse.py
          python -m pip install --disable-pip-version-check --no-index --find-links=vendor/wheels --require-hashes --only-binary=:all: -r requirements.lock
          python tools/tink_offline.py --version
      - name: Install hash-pinned test build tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r build-tools.lock
      - name: Verify syntax
        run: python -m compileall -q secure_release tests
      - name: Activate native Windows toolchain for public synthetic tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Native MSVC installation is required' }
          cmd /d /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^(Path|INCLUDE|LIB|LIBPATH|VSINSTALLDIR|VCINSTALLDIR|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|VSCMD_[^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment activation failed' }
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify parent and complete-object size without weakening field checks
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
          REQUIRE_TINK_TESTS: '1'
        run: python -m unittest tests.test_cef_windows_source_repair tests.test_cef_windows_diagnostics tests.test_cef_qualification_workflows tests.test_openssl_tink_logs tests.test_encrypted_logs -v
      - name: Run full public regression suite
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
          REQUIRE_TINK_TESTS: '1'
          REQUIRE_NATIVE_ARCHIVE_AUDIT: '1'
        run: python -m unittest discover -s tests -v
