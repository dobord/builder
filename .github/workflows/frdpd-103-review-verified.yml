name: PR103 review final verification
on:
  push:
    branches: [fix/frdpd-103-review-20260926]
    paths: ['.github/workflows/frdpd-103-review-verified.yml']
permissions:
  contents: read
concurrency:
  group: review103-final-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: e1de36ccf833c0e5d14e8c088cd52417df1d9c47
  SOURCE_TREE: 3ca8e0d5a916f0548e6dababa68f240ef72e994b
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        variant: [full, asan, noavc]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      REVIEW_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Exact source, production assertions and isolated regression
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import runpy,sys,os
          api=runpy.run_path('investigations/frdpd-103/review-ci.py')
          original=api['docker']
          def verified(name,script,timeout=900):
              # Same assertion mode as the canonical Docker build, not NDEBUG.
              script=script.replace('-DWITH_FRDPD_STRICT_WARNINGS=ON','-DWITH_FRDPD_STRICT_WARNINGS=ON -DWITH_VERBOSE_WINPR_ASSERT=OFF')
              if name=='focused':
                  script="grep -q '^#define WITH_GFX_H264' /opt/freerdp-build/include/freerdp/config.h && "+script
              if name.startswith('production-'):
                  positive="grep -q '^#define WITH_GFX_H264' /tmp/review-prod/include/freerdp/config.h"
                  gate=('! '+positive) if os.environ['REVIEW_VARIANT']=='noavc' else positive
                  script=script.replace('ctest --test-dir /tmp/review-prod',gate+'\nctest --test-dir /tmp/review-prod')
              script=script.replace('--output-on-failure --timeout','--output-on-failure --verbose --timeout')
              return original(name,script,timeout)
          api['main'].__globals__['docker']=verified
          sys.exit(api['main']())
          PY
      - name: Encrypt complete diagnostics
        if: always()
        run: |
          python - <<'PY'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'review-evidence.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for p in (root/'review-validation').glob('*'):
                  if p.name not in ('source','askpass'):out.add(p,arcname=p.name)
          encrypt_file(archive,root/'review.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-review-validation','source_sha':os.environ['SOURCE_SHA'],'tree_sha':os.environ['SOURCE_TREE'],'run_id':os.environ['GITHUB_RUN_ID'],'variant':os.environ['REVIEW_VARIANT']})
          archive.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-review-final-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/review.enc
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - if: always()
        run: sudo rm -rf "$RUNNER_TEMP/review-validation" "$RUNNER_TEMP/review.enc"
