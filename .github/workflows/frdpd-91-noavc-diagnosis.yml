name: FRDPD issue 91 noavc diagnosis
on:
  push:
    branches: [test/frdpd-91-window-capture-20260928]
    paths: ['.github/workflows/frdpd-91-noavc-diagnosis.yml']
permissions:
  contents: read
env:
  SOURCE_SHA: 2c85e3d9594fe960c22183cd0131c45f16e6128c
  SOURCE_TREE: 864b8249648cfcbdfaafb7686aaa750ed83e6dc2
  REVIEW_BASE: 3c9171929662704418ed989cb46aa2c021234c76
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REVIEW_VARIANT: noavc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Exact no-AVC strict diagnosis
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os,runpy,sys
          from pathlib import Path
          api=runpy.run_path('investigations/frdpd-103/review-ci.py')
          original=api['docker']
          def diagnosed(name,script,timeout=900):
              script=script.replace('-DWITH_FRDPD_STRICT_WARNINGS=ON','-DWITH_FRDPD_STRICT_WARNINGS=ON -DWITH_VERBOSE_WINPR_ASSERT=OFF')
              script=script.replace('GfxPolicy|ZGfxHistory','GfxPolicy|CursorAdapter|ZGfxHistory')
              script=script.replace('X11WindowTracker|RemoteAppContract','X11WindowTracker|X11WindowCapture|X11WindowCompositor|SceneV2.*|WindowLease|X11ImageConvert|GraphicsControl|DamageState|SharedBuffer|NativePath|RemoteAppContract')
              script=script.replace('--target frdpd frdp-session-agent TestFreeRDPFrdp','--target frdpd frdp-session-agent TestFreeRDPFrdp -- -k 0')
              rc=original(name,script,timeout)
              if rc:
                  p=Path(os.environ['RUNNER_TEMP'])/'review-validation'/(name+'.log')
                  if p.exists():
                      data=p.read_text(errors='replace')
                      print('===== extended '+name+' diagnostics =====')
                      print(data[-120000:])
              return rc
          api['main'].__globals__['docker']=diagnosed
          sys.exit(api['main']())
          PY
