name: Static dependency configure diagnostics
on:
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/static-dependency-diagnostics.yml
permissions:
  contents: read
concurrency:
  group: static-dependency-configure-diagnostics
  cancel-in-progress: true
jobs:
  libudev:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: aaed4aa90086389b491b84db2a648e8e34a14266
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: private-vcpkg/.diag-upstream
          persist-credentials: false
      - name: Install native configure prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 autoconf autoconf-archive automake libtool pkg-config gperf
      - name: Reproduce cef-libudev configure
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
          VCPKG_DISABLE_METRICS: "1"
          VCPKG_BINARY_SOURCES: clear
        run: |
          set -euo pipefail
          upstream="$GITHUB_WORKSPACE/private-vcpkg/.diag-upstream"
          test "$(git -C private-vcpkg rev-parse HEAD)" = "aaed4aa90086389b491b84db2a648e8e34a14266"
          bash "$upstream/bootstrap-vcpkg.sh" -disableMetrics >"$RUNNER_TEMP/libudev-bootstrap.log" 2>&1
          set +e
          "$upstream/vcpkg" install cef-libudev             --triplet=x64-linux-static-release             --host-triplet=x64-linux-static-release             "--overlay-ports=$GITHUB_WORKSPACE/private-vcpkg/ports"             "--overlay-triplets=$GITHUB_WORKSPACE/private-vcpkg/triplets"             "--x-install-root=$RUNNER_TEMP/libudev-installed"             --binarysource=clear >"$RUNNER_TEMP/libudev-install.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "CEF_LIBUDEV_CONFIGURE_QUALIFIED"
            exit 0
          fi
          python - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "private-vcpkg/.diag-upstream/buildtrees/cef-libudev"
          pieces = []
          if root.is_dir():
              candidates = sorted(
                  [p for p in root.rglob("*") if p.is_file() and (p.name.endswith(".log") or p.name == "config.log")],
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )[:16]
              pieces = [p.read_text(errors="replace")[-262144:] for p in candidates]
          text = "\n".join(pieces)
          cause = "unknown"
          checks = [
              ("c99-compiler", r"no C99 compiler found"),
              ("posix-header", r"POSIX header not found"),
              ("kernel-header", r"KERNEL header not found"),
              ("gperf", r"gperf not found"),
              ("unshare", r"unshare nor SYS_unshare found"),
              ("compiler-executable", r"C compiler cannot create executables"),
              ("autoconf-macro", r"possibly undefined macro"),
              ("auxiliary-files", r"cannot find required auxiliary files"),
              ("pkg-config", r"pkg-config"),
          ]
          for label, pattern in checks:
              if re.search(pattern, text, re.I):
                  cause = label
                  break
          missing = re.search(r"fatal error:\s*([A-Za-z0-9_+./-]+):\s*No such file", text)
          if missing and re.fullmatch(r"[A-Za-z0-9_+./-]+", missing.group(1)):
              cause += "-missing-" + pathlib.PurePosixPath(missing.group(1)).name.lower()
          print("CEF_LIBUDEV_CONFIGURE_FAILURE cause=" + cause)
          PY
          exit "$rc"

  gtk3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: aaed4aa90086389b491b84db2a648e8e34a14266
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: private-vcpkg/.diag-upstream
          persist-credentials: false
      - name: Install native GTK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 autoconf autoconf-archive automake libtool pkg-config ninja-build gettext
      - name: Restore reviewed static dependency caches
        env:
          GH_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gtk-cache"
          fetch_cache() {
            id="$1"; sha="$2"; name="$3"
            archive="$RUNNER_TEMP/gtk-cache/$name.zip"
            target="$RUNNER_TEMP/gtk-cache/$name"
            gh api "repos/dobord/vcpkg/actions/artifacts/$id/zip" > "$archive"
            echo "$sha  $archive" | sha256sum -c - >/dev/null
            mkdir "$target"
            unzip -q "$archive" -d "$target"
          }
          fetch_cache 10510999882 7fce9a50b14a91452f939011155c265ac5e996815c5d442ba7d1c6b7f5da2b05 core
          fetch_cache 10513582038 13070e63a1a5ccdaef82d483f4296ba31fa7ef1f237cd17729cf81fddf3d118f cups
          fetch_cache 10512319512 c837f50873e149ac8c1d823ab906fbb36217616c3198e029bc6ee647e0222b8e gbm
      - name: Reproduce static GTK3 configure
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
          VCPKG_DISABLE_METRICS: "1"
          VCPKG_BINARY_SOURCES: clear
        run: |
          set -euo pipefail
          upstream="$GITHUB_WORKSPACE/private-vcpkg/.diag-upstream"
          test "$(git -C private-vcpkg rev-parse HEAD)" = "aaed4aa90086389b491b84db2a648e8e34a14266"
          bash "$upstream/bootstrap-vcpkg.sh" -disableMetrics >"$RUNNER_TEMP/gtk-bootstrap.log" 2>&1
          set +e
          "$upstream/vcpkg" install gtk3             --triplet=x64-linux-static-release             --host-triplet=x64-linux-static-release             "--overlay-ports=$GITHUB_WORKSPACE/private-vcpkg/ports"             "--overlay-triplets=$GITHUB_WORKSPACE/private-vcpkg/ci/cef-platform/triplets"             "--x-install-root=$RUNNER_TEMP/gtk-installed"             --binarysource=clear             "--binarysource=files,$RUNNER_TEMP/gtk-cache/core,read"             "--binarysource=files,$RUNNER_TEMP/gtk-cache/cups,read"             "--binarysource=files,$RUNNER_TEMP/gtk-cache/gbm,read" >"$RUNNER_TEMP/gtk-install.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "CEF_GTK3_CONFIGURE_QUALIFIED"
            exit 0
          fi
          python - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "private-vcpkg/.diag-upstream/buildtrees/gtk3"
          pieces = []
          if root.is_dir():
              candidates = sorted(
                  [p for p in root.rglob("*") if p.is_file() and (p.name.endswith(".log") or p.name == "meson-log.txt")],
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )[:20]
              pieces = [p.read_text(errors="replace")[-262144:] for p in candidates]
          text = "\n".join(pieces)
          cause = "unknown"
          detail = ""
          patterns = [
              ("unknown-option", r"Unknown options?:\s*["']?([A-Za-z0-9_+.-]+)"),
              ("missing-dependency", r"(?:Dependency|Run-time dependency)\s+["']?([A-Za-z0-9_+.-]+)["']?[^\n]*(?:not found|found:\s*NO)"),
              ("missing-program", r"Program\s+["']?([A-Za-z0-9_+.-]+)["']?[^\n]*(?:not found|found:\s*NO)"),
              ("missing-file", r"ERROR:\s*File\s+([A-Za-z0-9_+./-]+)\s+does not exist"),
          ]
          for label, pattern in patterns:
              match = re.search(pattern, text, re.I)
              if match:
                  cause = label
                  token = match.group(1).lower()
                  if re.fullmatch(r"[a-z0-9_+./-]+", token):
                      detail = " token=" + pathlib.PurePosixPath(token).name
                  break
          if cause == "unknown":
              if re.search(r"patch failed|does not apply|corrupt patch", text, re.I):
                  cause = "patch"
              elif re.search(r"meson\.build:\d+:\d+: ERROR:", text):
                  cause = "meson-error"
              elif re.search(r"ninja: build stopped", text, re.I):
                  cause = "build"
          print("CEF_GTK3_CONFIGURE_FAILURE cause=" + cause + detail)
          PY
          exit "$rc"
