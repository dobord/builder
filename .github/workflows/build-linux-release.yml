name: Build static Linux SDK
run-name: Linux static SDK request ${{ inputs.release_id }}
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      salt:
        required: true
        type: string
      request:
        description: Signed encrypted Linux-only release request
        required: true
        type: string
permissions: {}
concurrency:
  group: encrypted-build-${{ inputs.release_id }}
  cancel-in-progress: false
env:
  RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
  BUILDER_COMMIT_SHA: ${{ vars.BUILDER_COMMIT_SHA }}
  SDK_BUILD_WORKFLOW: build-linux-release.yml
jobs:
  prepare:
    if: >-
      github.repository_id == '1372874997' &&
      github.ref == 'refs/heads/main' &&
      github.sha == vars.BUILDER_COMMIT_SHA &&
      vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/builder
          ref: ${{ vars.BUILDER_COMMIT_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned request tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - name: Authenticate Linux-only request and fetch pinned sources
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          SOURCE_ALLOWLIST: ${{ secrets.SOURCE_ALLOWLIST }}
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
          REQUEST_VERIFY_PUBLIC_KEY: ${{ secrets.REQUEST_VERIFY_PUBLIC_KEY }}
          ARTIFACT_ENCRYPTION_PUBLIC_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_PUBLIC_KEY }}
        run: python -m secure_release prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-input/input.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Clean preparation workspace
        if: always()
        run: python -m secure_release cleanup
  linux:
    needs: prepare
    runs-on: ${{ fromJSON(vars.CEF_STATIC_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    env:
      TARGET_PLATFORM: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/builder
          ref: ${{ vars.BUILDER_COMMIT_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Recover hosted Linux capacity before the source build
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h /
      - name: Install pinned build tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r build-tools.lock
      - name: Install Linux build and runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake gcc-14 g++-14 lld-18 libtool pkg-config ninja-build nasm gperf flex bison gettext texinfo xvfb xauth openssl libglib2.0-dev libnss3-dev libnspr4-dev libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libx11-dev libxcomposite-dev libxdamage-dev libxext-dev libxfixes-dev libxrandr-dev libxrender-dev libxtst-dev libxi-dev libxkbcommon-dev libgbm-dev libdrm-dev libexpat1-dev uuid-dev libxcb1-dev libpci-dev libudev-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev libasound2-dev zlib1g-dev libatspi2.0-dev libxshmfence-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-input
      - name: Build and verify the Linux static SDK
        id: build-sdk
        env:
          BUILD_CACHE_READ_TOKEN: ${{ github.token }}
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
          REQUEST_VERIFY_PUBLIC_KEY: ${{ secrets.REQUEST_VERIFY_PUBLIC_KEY }}
          ARTIFACT_ENCRYPTION_PUBLIC_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_PUBLIC_KEY }}
        run: python -m secure_release build
      - name: Persist accepted engine checkpoint
        if: ${{ !cancelled() && steps.build-sdk.outputs.cef_checkpoint_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cef-checkpoint-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-cache/cef-checkpoint/*.enc
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Persist completed static package cache
        if: ${{ !cancelled() && steps.build-sdk.outputs.binary_cache_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vcpkg-binaries-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-cache/vcpkg-binaries/*.enc
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Require a completed SDK before publication
        if: steps.build-sdk.outputs.sdk_ready != 'true'
        run: exit 1
      - name: Upload verified Linux SDK for the publication stage
        if: success() && steps.build-sdk.outputs.sdk_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-output/sdk.enc
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Save private build diagnostics
        if: always()
        env:
          ARTIFACT_ENCRYPTION_PUBLIC_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_PUBLIC_KEY }}
        run: python -m secure_release diagnostics
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: diagnostic-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-diagnostics/diagnostic.enc
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
      - name: Clean Linux build workspace
        if: always()
        run: python -m secure_release cleanup
