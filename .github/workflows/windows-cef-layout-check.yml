name: Windows CEF layout verification
on:
  push:
    branches: [repair/windows-cef-40-layout]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 03abd124ebe3b8a57fb78470a75b5aa3ce064e31
          path: private-cef
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Snapshot reviewed public candidate sources
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git archive HEAD -- secure_release/cef_windows_source_repair.py ci/cef-windows-engine-lock.json tests/cef_windows_layout_inputs.py tests/test_cef_windows_source_repair.py tests/test_cef_windows_autofill_repair.py tests/test_cef_windows_iterator_repair.py tests/test_cef_windows_atomic_ref_repair.py tests/test_cef_windows_layout_repair.py > candidate-source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: runner.os == 'Linux'
        with:
          name: public-layout-candidate-${{ github.run_id }}
          path: candidate-source.tar
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Install verified offline test runtime
        run: |
          python tools/verify_wheelhouse.py
          python -m pip install --disable-pip-version-check --no-index --find-links vendor/wheels --require-hashes --only-binary=:all: -r requirements.lock
      - name: Check syntax
        run: python -m compileall -q secure_release tests
      - name: Verify native layout and all checkpoint regressions
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
          REQUIRE_TINK_TESTS: '1'
        run: python -m unittest tests.test_cef_windows_source_repair tests.test_cef_windows_diagnostics tests.test_cef_qualification_workflows tests.test_openssl_tink_logs tests.test_encrypted_logs -v
