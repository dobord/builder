name: Windows CEF layout verification
on:
  push:
    branches: [repair/windows-cef-40-layout]
permissions:
  contents: read
jobs:
  layout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Measure public ABI control without engine or secrets
        run: python ci/cef-windows-layout/native.py
