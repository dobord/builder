name: Windows CEF atomic reference verification
on:
  push:
    branches: [repair/windows-cef-39-atomic-ref]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 03abd124ebe3b8a57fb78470a75b5aa3ce064e31
          path: private-cef
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install hash-pinned test runtime
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - name: Verify syntax
        run: python -m compileall -q secure_release tests
      - name: Report native Windows Clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify strict atomic reference and checkpoint contracts
        env:
          CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
          REQUIRE_TINK_TESTS: '1'
        run: python -m unittest tests.test_cef_windows_source_repair tests.test_cef_windows_diagnostics tests.test_cef_qualification_workflows tests.test_openssl_tink_logs tests.test_encrypted_logs -v
