name: Truthful listener transport and native regression
on:
  push:
    branches: [investigate/frdpd-103-mstsc-20260924]
    paths: ['.github/workflows/frdpd-103-tcp-policy.yml']
permissions:
  contents: read
concurrency:
  group: frdpd-103-tcp-policy-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ca82a3cea02ba7eb1655a2781a24003467300595
  CANDIDATE_SHA: ca82a3cea02ba7eb1655a2781a24003467300595
  CANDIDATE_TREE: 7e2506adb48269d2d8eabe3aadb4c222d5dd83c8
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          mkdir -m 700 "$RUNNER_TEMP/tcp-private"
      - name: Fetch exact private candidate as data
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os,subprocess,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'tcp-private';source=root/'source';ask=root/'askpass'
          ask.write_text('#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%s\\n" "$SOURCE_READ_TOKEN" ;; esac\n');ask.chmod(0o700)
          try:
              env=dict(os.environ,GIT_ASKPASS=str(ask),GIT_TERMINAL_PROMPT='0')
              with (root/'fetch.log').open('w') as log:
                  def git(*args):subprocess.run(['git',*args],env=env,stdout=log,stderr=log,timeout=600,check=True)
                  git('init',str(source));git('-C',str(source),'remote','add','origin','https://github.com/dobord/frdpd.git')
                  git('-C',str(source),'fetch','--depth=1','origin',os.environ['SOURCE_SHA']);git('-C',str(source),'checkout','--detach','FETCH_HEAD')
                  assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD^{tree}'],text=True).strip()==os.environ['CANDIDATE_TREE']
                  git('-C',str(source),'-c','url.https://github.com/.insteadOf=git@github.com:','submodule','update','--init','--recursive','--depth=1')
                  (root/'provenance.json').write_text(json.dumps({'commit':os.environ['SOURCE_SHA'],'tree':os.environ['CANDIDATE_TREE'],'source_edits':False}))
          finally:ask.unlink(missing_ok=True)
          PY
      - name: Build unchanged product and execute actual transport-policy tests
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tcp-private"
          docker build --build-arg FRDP_BUILD_COMPONENT_TESTS=ON -f "$root/source/server/frdp/test/e2e/Dockerfile" -t frdpd-tcp:fixed "$root/source" >"$root/build.log" 2>&1
          docker run --rm --init --network none --entrypoint bash frdpd-tcp:fixed -lc 'ctest --test-dir /opt/freerdp-build --timeout 120 --output-on-failure --no-tests=error -R "TestFreeRDPFrdp(TransportPolicy|GfxPolicy|RemoteAppContract|GraphicsAdapter|E2EScripts|ListenerPolicyBoundary|SessionResources|X11WindowCapture.*|SharedBuffer|AgentStop|AgentNativeTopology)$"' >"$root/focused.log" 2>&1
      - name: Independent client regression on both Xorg backends
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tcp-private"
          for backend in xorg-dummy xorg-native; do
            FRDP_E2E_NO_BUILD=1 FRDP_E2E_IMAGE=frdpd-tcp:fixed FRDP_LAYERED_DISPLAY_BACKEND="$backend" FRDP_E2E_PROFILE_TIMEOUT=300 FRDP_E2E_ARTIFACTS="$root/e2e-$backend" COMPOSE_PROJECT_NAME="tcp-${backend}-${GITHUB_RUN_ID}" bash "$root/source/server/frdp/test/e2e/run-layered.sh" >"$root/e2e-$backend.log" 2>&1
          done
      - name: Export exact stripped runtime
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tcp-private"
          docker run --name tcp-export --network none --entrypoint bash frdpd-tcp:fixed -lc 'rm -rf /src /opt/freerdp-pristine-source /opt/freerdp-pristine-build; find /opt/freerdp-build -type d -name CMakeFiles -prune -exec rm -rf {} +; rm -rf /opt/freerdp-build/Testing; apt-get clean' >"$root/export.log" 2>&1
          docker export tcp-export | gzip -1 > "$root/native-rootfs.tar.gz"
          docker rm tcp-export >>"$root/export.log"
      - name: Encrypt runner-to-runner image
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from secure_release.crypto import encrypt_file,public_text
          root=Path(os.environ['RUNNER_TEMP'])
          encrypt_file(root/'tcp-private'/'native-rootfs.tar.gz',root/'native.enc',public_text(os.environ['BUILDER_INPUT_PRIVATE_KEY']),{'purpose':'frdpd-103-native-input','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA']})
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tcp-native-input-${{ github.run_id }}
          path: ${{ runner.temp }}/native.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Encrypt build evidence
        if: always()
        run: |
          python - <<'PY'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'tcp.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for p in (root/'tcp-private').glob('*'):
                  if p.name not in ('source','askpass','native-rootfs.tar.gz'):out.add(p,arcname=p.name)
          encrypt_file(archive,root/'tcp.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-tcp-build','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA']})
          archive.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-tcp-build-${{ github.run_id }}
          path: ${{ runner.temp }}/tcp.enc
          retention-days: 1
          compression-level: 0
      - if: always()
        run: |
          sudo rm -rf "$RUNNER_TEMP/tcp-private" "$RUNNER_TEMP/tcp.enc" "$RUNNER_TEMP/native.enc"
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SOURCE_RUN: ${{ github.run_id }}
      TEST_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
          architecture: x64
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/native-private" | Out-Null
      - name: Native ARM64 VM host packages
        if: matrix.os == 'windows-11-arm'
        id: msys
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: true
          cache: false
          install: mingw-w64-clang-aarch64-qemu mingw-w64-clang-aarch64-qemu-image-util
      - name: ARM platform verification before loading runtime
        if: matrix.os == 'windows-11-arm'
        env:
          MSYS2_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          python investigations/frdpd-103/native-arm-platform.py
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: X64 fixture readiness and stability
        if: matrix.os != 'windows-11-arm'
        run: |
          @'
          from pathlib import Path
          p=Path('investigations/frdpd-103/native.py');s=p.read_text()
          boot="set +e; sudo cloud-init status --wait --format=json; rc=$?; set -e; case $rc in 0|2) ;; *) exit $rc ;; esac; test -f /var/lib/cloud/instance/boot-finished; sudo systemctl is-active --quiet docker; sudo docker info >/dev/null\\n"
          for old,new in [('FRDP_DISPLAY_BACKEND=xorg-dummy\\n','FRDP_DISPLAY_BACKEND=xorg-dummy\\nWLOG_LEVEL=DEBUG\\n'),('time.monotonic()-stable_since>=10','time.monotonic()-stable_since>=30'),("REPORT.get('stable_window_seconds',0)>=10","REPORT.get('stable_window_seconds',0)>=30"),('sudo cloud-init status --wait; sudo docker info >/dev/null\\n',boot)]:
              assert s.count(old)==1
              s=s.replace(old,new,1)
          p.write_text(s)
          '@ | python -
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Fixture-only first-use consent
        run: |
          & powershell.exe -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File investigations/frdpd-103/native-preflight.ps1
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tcp-native-input-${{ github.run_id }}
          path: ${{ runner.temp }}/native-cipher
      - name: Authenticate candidate runtime
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
        run: |
          @'
          import os
          from pathlib import Path
          from secure_release.crypto import decrypt_file
          root=Path(os.environ['RUNNER_TEMP'])
          decrypt_file(root/'native-cipher'/'native.enc',root/'native-private'/'native-rootfs.tar.gz',os.environ['BUILDER_INPUT_PRIVATE_KEY'],{'purpose':'frdpd-103-native-input','run_id':os.environ['SOURCE_RUN'],'source_sha':os.environ['SOURCE_SHA']})
          '@ | python -
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Record actual native client product
        run: |
          @{ operating_system=(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture); processor=(Get-CimInstance Win32_Processor | Select-Object Architecture); video=(Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,VideoProcessor) } | ConvertTo-Json -Depth 5 | Set-Content "$env:RUNNER_TEMP/native-private/host-product.json"
      - name: Native mstsc without client transport or security overrides
        env:
          MSYS2_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          python investigations/frdpd-103/native.py
          Set-Content "$env:RUNNER_TEMP/native-exit" $LASTEXITCODE
          exit 0
      - name: Encrypt native evidence
        if: always()
        run: |
          @'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'native.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for p in (root/'native-private').glob('*'):
                  if p.is_file() and p.suffix in ('.log','.json','.png','.txt'):out.add(p,arcname=p.name)
          encrypt_file(archive,root/'native.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-tcp-native','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA'],'os':os.environ['TEST_OS']})
          archive.unlink()
          '@ | python -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-tcp-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native.enc
          retention-days: 1
          compression-level: 0
      - name: Clean and report actual native result
        if: always()
        run: |
          Get-Process qemu-system-x86_64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $rc=1
          if (Test-Path "$env:RUNNER_TEMP/native-exit") {$rc=[int](Get-Content "$env:RUNNER_TEMP/native-exit")}
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP/native-private","$env:RUNNER_TEMP/native-cipher" -ErrorAction SilentlyContinue
          exit $rc
