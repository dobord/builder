name: FRDPD issue 91 final verification
on:
  push:
    branches: [test/frdpd-91-window-capture-20260928]
    paths: ['.github/workflows/frdpd-91-review-verified.yml']
permissions:
  contents: read
concurrency:
  group: frdpd-91-final-${{ github.sha }}
  cancel-in-progress: false
env:
  SOURCE_SHA: c81948de0dfff46c76e15b35d07cf00fb01e1c0c
  SOURCE_TREE: 29a3de393c32e932a50f817662c50f5b3dbaf80b
  REVIEW_BASE: 3c9171929662704418ed989cb46aa2c021234c76
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        variant: [full, asan, noavc]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      REVIEW_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Exact source, strict production mode and isolated regression
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import runpy,sys,os
          api=runpy.run_path('investigations/frdpd-103/review-ci.py')
          original=api['docker']
          def verified(name,script,timeout=900):
              script=script.replace('-DWITH_FRDPD_STRICT_WARNINGS=ON','-DWITH_FRDPD_STRICT_WARNINGS=ON -DWITH_VERBOSE_WINPR_ASSERT=OFF')
              script=script.replace('GfxPolicy|ZGfxHistory','GfxPolicy|CursorAdapter|ZGfxHistory')
              script=script.replace('X11WindowTracker|RemoteAppContract','X11WindowTracker|NativePath|RemoteAppContract')
              if name=='focused':
                  script="grep -q '^#define WITH_GFX_H264' /opt/freerdp-build/include/freerdp/config.h && "+script
              if name.startswith('production-'):
                  positive="grep -q '^#define WITH_GFX_H264' /tmp/review-prod/include/freerdp/config.h"
                  gate=('! '+positive) if os.environ['REVIEW_VARIANT']=='noavc' else positive
                  script=script.replace('ctest --test-dir /tmp/review-prod',gate+'\nctest --test-dir /tmp/review-prod')
                  script=script.replace('--target frdpd frdp-session-agent TestFreeRDPFrdp','--target frdpd frdp-session-agent TestFreeRDPFrdp -- -k 0')
              script=script.replace('--output-on-failure --timeout','--output-on-failure --verbose --timeout')
              return original(name,script,timeout)
          api['main'].__globals__['docker']=verified
          sys.exit(api['main']())
          PY
      - name: Export exact committed corrections without publishing private source
        if: always() && matrix.variant == 'full'
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os,subprocess,json,hashlib
          from pathlib import Path
          os.umask(0o077)
          root=Path(os.environ['RUNNER_TEMP'])/'review-validation'; source=root/'source'
          if not (source/'.git').exists(): raise SystemExit('Source checkout unavailable')
          ask=root/'askpass-export'
          ask.write_text('#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%s\\n" "$SOURCE_READ_TOKEN" ;; esac\n'); ask.chmod(0o700)
          try:
              env=dict(os.environ,GIT_ASKPASS=str(ask),GIT_TERMINAL_PROMPT='0')
              base=os.environ['REVIEW_BASE']; head=os.environ['SOURCE_SHA']
              with (root/'patch-export.log').open('w') as log:
                  def git(*args): subprocess.run(['git','-C',str(source),*args],env=env,stdout=log,stderr=log,check=True,timeout=300)
                  git('fetch','--depth=16','origin',head)
                  git('merge-base','--is-ancestor',base,head)
                  output=root/'corrections'; output.mkdir(exist_ok=True)
                  git('format-patch','--full-index','--binary','--no-signature','--output-directory',str(output),base+'..'+head)
                  with (output/'combined.patch').open('wb') as patch:
                      subprocess.run(['git','-C',str(source),'diff','--full-index','--binary',base,head],env=env,stdout=patch,stderr=log,check=True,timeout=60)
                  files=subprocess.check_output(['git','-C',str(source),'diff','--name-only',base,head],text=True).splitlines()
                  metadata={'base':base,'head':head,'tree':os.environ['SOURCE_TREE'],'files':files}
                  (output/'provenance.json').write_text(json.dumps(metadata,indent=2))
                  manifest={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in output.iterdir() if p.is_file()}
                  (output/'sha256.json').write_text(json.dumps(manifest,sort_keys=True,indent=2))
          finally:
              ask.unlink(missing_ok=True)
          PY
      - name: Encrypt complete diagnostics
        if: always()
        run: |
          python - <<'PY'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'review-evidence.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for p in (root/'review-validation').glob('*'):
                  if p.name not in ('source','askpass','askpass-export'):out.add(p,arcname=p.name)
          encrypt_file(archive,root/'review.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-91-review-validation','source_sha':os.environ['SOURCE_SHA'],'tree_sha':os.environ['SOURCE_TREE'],'run_id':os.environ['GITHUB_RUN_ID'],'variant':os.environ['REVIEW_VARIANT']})
          archive.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-frdpd-91-final-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/review.enc
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - if: always()
        run: sudo rm -rf "$RUNNER_TEMP/review-validation" "$RUNNER_TEMP/review.enc"
