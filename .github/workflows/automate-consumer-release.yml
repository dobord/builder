name: Automatically sign and publish a verified consumer release
run-name: Consumer automation ${{ inputs.request_digest }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      request_digest:
        required: true
        type: string
      request:
        description: Encrypted exact release request with independently approved acceptance
        required: true
        type: string
permissions: {}
concurrency:
  group: consumer-release-publication
  cancel-in-progress: false
env:
  CONSUMER_AUTOMATION_ENABLED: ${{ vars.CONSUMER_AUTOMATION_ENABLED }}
jobs:
  prepare-signing:
    if: >-
      github.repository_id == '1372874997' &&
      github.sha == vars.CONSUMER_AUTOMATION_BUILDER_SHA &&
      github.ref == format('refs/tags/consumer-automation-{0}', vars.CONSUMER_AUTOMATION_BUILDER_SHA) &&
      github.run_attempt == 1 &&
      github.actor_id == '5323024' &&
      vars.CONSUMER_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: consumer-release-preparation
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/builder
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install reviewed offline crypto runtime
        run: |
          python tools/verify_wheelhouse.py
          python -m pip install --disable-pip-version-check --no-index --find-links=vendor/wheels --require-hashes --only-binary=:all: -r requirements.lock
      - name: Verify qualification and prepare encrypted signing input
        env:
          CONSUMER_AUTOMATION_REQUEST_ID: ${{ inputs.request_id }}
          CONSUMER_AUTOMATION_REQUEST_DIGEST: ${{ inputs.request_digest }}
          CONSUMER_AUTOMATION_REQUEST: ${{ inputs.request }}
          CONSUMER_RELEASE_POLICY_B64: ${{ secrets.CONSUMER_RELEASE_POLICY_B64 }}
          CONSUMER_POLICY_B64: ${{ secrets.CONSUMER_CI_POLICY_B64 }}
          CONSUMER_INPUT_PRIVATE_KEY_B64: ${{ secrets.CONSUMER_CI_INPUT_PRIVATE_KEY_B64 }}
          CONSUMER_VERIFY_PUBLIC_KEY_B64: ${{ secrets.CONSUMER_CI_VERIFY_PUBLIC_KEY_B64 }}
          CONSUMER_PUBLISH_PRIVATE_KEY_B64: ${{ secrets.CONSUMER_CI_PUBLISH_PRIVATE_KEY_B64 }}
          CONSUMER_SIGNER_INPUT_PUBLIC_KEY_B64: ${{ secrets.CONSUMER_SIGNER_INPUT_PUBLIC_KEY_B64 }}
          BUILDER_READ_TOKEN: ${{ github.token }}
        run: python -m secure_release.consumer_automation prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumer-signing-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-signing-input/input.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Encrypt bounded automation diagnostics
        if: always()
        run: python -m secure_release.consumer_automation diagnostics
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consumer-automation-prepare-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-publication-diagnostics.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove plaintext automation staging
        if: always()
        run: python -m secure_release.consumer_automation cleanup
  release:
    needs: prepare-signing
    runs-on: ubuntu-24.04
    environment: consumer-publication
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/builder
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install reviewed offline crypto runtime
        run: |
          python tools/verify_wheelhouse.py
          python -m pip install --disable-pip-version-check --no-index --find-links=vendor/wheels --require-hashes --only-binary=:all: -r requirements.lock
      - name: Dispatch pinned signer and authenticate its encrypted result
        id: signer
        env:
          CONSUMER_RELEASE_POLICY_B64: ${{ secrets.CONSUMER_RELEASE_POLICY_B64 }}
          CONSUMER_POLICY_B64: ${{ secrets.CONSUMER_CI_POLICY_B64 }}
          CONSUMER_SIGNER_INPUT_PUBLIC_KEY_B64: ${{ secrets.CONSUMER_SIGNER_INPUT_PUBLIC_KEY_B64 }}
          CONSUMER_DISPATCH_TOKEN: ${{ secrets.BIN_DISPATCH_TOKEN }}
          BUILDER_READ_TOKEN: ${{ github.token }}
        run: python -m secure_release.consumer_automation orchestrate
      - name: Reverify isolated signatures, qualification and exact original assets
        id: verify
        env:
          CONSUMER_RELEASE_POLICY_B64: ${{ secrets.CONSUMER_RELEASE_POLICY_B64 }}
          CONSUMER_POLICY_B64: ${{ secrets.CONSUMER_CI_POLICY_B64 }}
          CONSUMER_SIGNER_RETURN_DIGEST: ${{ steps.signer.outputs.signer_return_digest }}
          CONSUMER_INPUT_PRIVATE_KEY_B64: ${{ secrets.CONSUMER_CI_INPUT_PRIVATE_KEY_B64 }}
          CONSUMER_VERIFY_PUBLIC_KEY_B64: ${{ secrets.CONSUMER_CI_VERIFY_PUBLIC_KEY_B64 }}
          CONSUMER_PUBLISH_PRIVATE_KEY_B64: ${{ secrets.CONSUMER_CI_PUBLISH_PRIVATE_KEY_B64 }}
          CONSUMER_RELEASE_VERIFY_PUBLIC_KEY_B64: ${{ secrets.CONSUMER_RELEASE_VERIFY_PUBLIC_KEY_B64 }}
          BUILDER_READ_TOKEN: ${{ github.token }}
        run: python -m secure_release.consumer_automation complete
      - name: Publish exact verified release and signed presentation
        env:
          CONSUMER_RELEASE_POLICY_B64: ${{ secrets.CONSUMER_RELEASE_POLICY_B64 }}
          CONSUMER_POLICY_B64: ${{ secrets.CONSUMER_CI_POLICY_B64 }}
          CONSUMER_RELEASE_STAGING_DIGEST: ${{ steps.verify.outputs.staging_digest }}
          CONSUMER_RELEASE_VERIFY_PUBLIC_KEY_B64: ${{ secrets.CONSUMER_RELEASE_VERIFY_PUBLIC_KEY_B64 }}
          CONSUMER_RELEASE_PUBLISH_TOKEN: ${{ secrets.BIN_PUBLISH_TOKEN }}
          BUILDER_READ_TOKEN: ${{ github.token }}
        run: python -m secure_release.consumer_automation publish
      - name: Encrypt bounded automation diagnostics
        if: always()
        run: python -m secure_release.consumer_automation diagnostics
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consumer-automation-release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-publication-diagnostics.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove plaintext automation staging
        if: always()
        run: python -m secure_release.consumer_automation cleanup
