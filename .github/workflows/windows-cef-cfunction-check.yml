name: Windows CEF CFunction span verification
on:
  push:
    branches: [repair/windows-cef-42-cfunction-span]
permissions:
  contents: read
jobs:
  public-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: v8/v8
          ref: 4323497a6a73839e6d5260f6acd7ec0212cb3321
          persist-credentials: false
          sparse-checkout: |
            include
            src/torque
            src/objects
      - name: Archive pinned public V8 inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4323497a6a73839e6d5260f6acd7ec0212cb3321
          mkdir public-inputs
          git archive --format=tar HEAD include LICENSE src/torque/implementation-visitor.cc src/objects/map.h src/objects/object-macros.h src/objects/js-interceptor-map.h src/objects/map.tq src/objects/js-interceptor-map.tq > public-inputs/v8-inputs.tar
          git rev-parse HEAD > public-inputs/v8-commit.txt
          cd public-inputs
          sha256sum *.tar *-commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-cfunction-inputs-${{ github.run_id }}
          path: public-inputs/*
          if-no-files-found: error
          retention-days: 3
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: v8/v8
          ref: 4323497a6a73839e6d5260f6acd7ec0212cb3321
          path: public-v8
          persist-credentials: false
          sparse-checkout: |
            include
            src/torque
            src/objects
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact public V8 revision
        shell: pwsh
        run: |
          if ((git -C public-v8 rev-parse HEAD) -ne '4323497a6a73839e6d5260f6acd7ec0212cb3321') {
            throw 'V8 revision mismatch'
          }
      - name: Run Windows source-repair regressions
        shell: pwsh
        env:
          CEF_WINDOWS_LAYOUT_SOURCE_ROOT: ${{ github.workspace }}/public-v8
          CEF_WINDOWS_CFUNCTION_SOURCE_ROOT: ${{ github.workspace }}/public-v8
        run: |
          python -m unittest tests.test_cef_windows_cfunction_span_repair -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.test_cef_windows_source_repair -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.test_cef_windows_layout_repair -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.test_cef_windows_tail_size_repair -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
