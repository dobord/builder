name: lfc-ui static FreeRDP feature qualification
on:
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/lfc-ui-static-freerdp.yml
permissions:
  contents: read
concurrency:
  group: lfc-ui-static-freerdp-linux
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: f2495f0da9db29dfea129e2b04a371933b9d2f4d
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: private-vcpkg/.freerdp-upstream
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/lfc-ui
          ref: 85ced5b0f72cb55b9e07b2ab58d27fc43d9420b5
          path: private-lfc-ui
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Install native static build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 autoconf autoconf-archive automake libtool pkg-config ninja-build nasm yasm
      - name: Prepare exact private lfc-ui source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-vcpkg rev-parse HEAD)" = "f2495f0da9db29dfea129e2b04a371933b9d2f4d"
          test "$(git -C private-vcpkg/.freerdp-upstream rev-parse HEAD)" = "9e593bb18ea69cc5095e012465dcd675a822ed0d"
          test "$(git -C private-lfc-ui rev-parse HEAD)" = "85ced5b0f72cb55b9e07b2ab58d27fc43d9420b5"
          mkdir -p private-vcpkg/.freerdp-upstream/downloads
          git -C private-lfc-ui -c core.autocrlf=false archive --format=tar.gz             85ced5b0f72cb55b9e07b2ab58d27fc43d9420b5             -o "$GITHUB_WORKSPACE/private-vcpkg/.freerdp-upstream/downloads/lfc-ui-85ced5b0f72cb55b9e07b2ab58d27fc43d9420b5.tar.gz"
      - name: Install and export lfc-ui freerdp feature
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
          VCPKG_DISABLE_METRICS: "1"
          VCPKG_BINARY_SOURCES: clear
        run: |
          set -euo pipefail
          upstream="$GITHUB_WORKSPACE/private-vcpkg/.freerdp-upstream"
          export VCPKG_ROOT="$upstream"
          export VCPKG_DOWNLOADS="$upstream/downloads"
          bash "$upstream/bootstrap-vcpkg.sh" -disableMetrics >"$RUNNER_TEMP/lfc-ui-freerdp-bootstrap.log" 2>&1
          installed="$RUNNER_TEMP/lfc-ui-freerdp-installed"
          common=(
            --triplet=x64-linux-static-release
            --host-triplet=x64-linux-static-release
            "--overlay-ports=$GITHUB_WORKSPACE/private-vcpkg/ports"
            "--overlay-triplets=$GITHUB_WORKSPACE/private-vcpkg/triplets"
            "--x-install-root=$installed"
            --binarysource=clear
          )
          "$upstream/vcpkg" install 'lfc-ui[freerdp]' "${common[@]}" >"$RUNNER_TEMP/lfc-ui-freerdp-install.log" 2>&1
          export_root="$RUNNER_TEMP/lfc-ui-freerdp-export"
          mkdir -p "$export_root"
          "$upstream/vcpkg" export lfc-ui freerdp ffmpeg "${common[@]}"             --raw --output=sdk "--output-dir=$export_root" >"$RUNNER_TEMP/lfc-ui-freerdp-export.log" 2>&1
          sdk="$export_root/sdk"
          mkdir -p "$sdk/triplets"
          cp "$GITHUB_WORKSPACE/private-vcpkg/triplets/x64-linux-static-release.cmake" "$sdk/triplets/"
          prefix="$sdk/installed/x64-linux-static-release"
          if find "$prefix" -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.dll' -o -name '*.dylib' \) -print -quit | grep -q .; then
            echo "LFC_UI_FREERDP_SHARED_TARGET_PAYLOAD" >&2
            exit 1
          fi
          echo "LFC_UI_FREERDP_SDK=$sdk" >> "$GITHUB_ENV"
      - name: Link relocated FreeRDP proxy and server probe
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/lfc-ui-freerdp-probe"
          build="$RUNNER_TEMP/lfc-ui-freerdp-probe-build"
          mkdir -p "$src"
          cat >"$src/main.cpp" <<'CPP'
          #include <lfc/ui/platform/freerdp_proxy/freerdp_proxy_platform.hpp>
          #include <lfc/ui/platform/freerdp_server/freerdp_server_platform.hpp>
          #include <freerdp/server/proxy/proxy_server.h>
          #include <freerdp/server/shadow.h>
          int main() {
            lfc::ui::FreeRdpProxyConfig proxy{};
            lfc::ui::FreeRdpServerConfig server{};
            return (proxy.desktopWidth > 0 && server.desktopWidth > 0) ? 0 : 1;
          }
          CPP
          cat >"$src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.32)
          project(lfc_ui_freerdp_probe LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 23)
          find_package(lfc-ui CONFIG REQUIRED)
          foreach(t IN ITEMS freerdp freerdp-client freerdp-server freerdp-server-proxy freerdp-shadow lfc::ui)
            if(NOT TARGET ${t})
              message(FATAL_ERROR "missing target ${t}")
            endif()
          endforeach()
          add_executable(lfc_ui_freerdp_probe main.cpp)
          target_link_libraries(lfc_ui_freerdp_probe PRIVATE lfc::ui)
          target_link_options(lfc_ui_freerdp_probe PRIVATE -static-libstdc++ -static-libgcc)
          CMAKE
          cmake -S "$src" -B "$build" -G Ninja             "-DCMAKE_TOOLCHAIN_FILE=$LFC_UI_FREERDP_SDK/scripts/buildsystems/vcpkg.cmake"             -DVCPKG_TARGET_TRIPLET=x64-linux-static-release             -DVCPKG_HOST_TRIPLET=x64-linux-static-release             -DVCPKG_MANIFEST_MODE=OFF
          cmake --build "$build" --parallel 2
          "$build/lfc_ui_freerdp_probe"
          if readelf -d "$build/lfc_ui_freerdp_probe" | grep -Eiq 'libfreerdp|libwinpr|libavcodec|libavformat|libavutil|libstdc\+\+|libgcc_s'; then
            echo "LFC_UI_FREERDP_SHARED_RUNTIME_DEPENDENCY" >&2
            exit 1
          fi
          echo "LFC_UI_STATIC_FREERDP_QUALIFIED"
