name: CEF integration contracts
on:
  push:
    branches: [feature/cef-static-integration]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install hash-pinned test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --require-hashes --only-binary=:all: -r build-tools.lock
      - name: Activate native x64 MSVC for archive-format regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Native MSVC installation is required' }
          cmd /d /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^(Path|INCLUDE|LIB|LIBPATH|VSINSTALLDIR|VCINSTALLDIR|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|VSCMD_[^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment activation failed' }
      - name: Test builder contracts with real disposable Tink keys and native archives
        env:
          REQUIRE_TINK_TESTS: '1'
          REQUIRE_NATIVE_ARCHIVE_AUDIT: '1'
        run: python -m unittest discover -s tests -v
      - name: Fetch exact public CEF integration recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: ca8392fc1dc2dd639ae4a36e3635ee288b1fca53
          path: cef-recipe
          persist-credentials: false
      - name: Test pinned CEF contracts
        working-directory: cef-recipe
        run: python -m unittest discover -s vcpkg/integration/tests -v
