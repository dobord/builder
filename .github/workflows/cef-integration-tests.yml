name: CEF integration contracts
on:
  push:
    branches: [feature/cef-static-integration]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install hash-pinned test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --require-hashes --only-binary=:all: -r build-tools.lock
      - name: Test builder contracts with real disposable Tink keys
        env:
          REQUIRE_TINK_TESTS: '1'
        run: python -m unittest discover -s tests -v
      - name: Fetch exact public CEF integration recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 4b8a42f5d212bb40b0f229ff983c2abb5d562ba1
          path: cef-recipe
          persist-credentials: false
      - name: Test pinned CEF contracts
        working-directory: cef-recipe
        run: python -m unittest discover -s vcpkg/integration/tests -v
