name: Strict CEF source contracts
on:
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/cef-strict-source-contracts.yml
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: c47b1b3cae1b2291b558ec674f61d653614ff637
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 03abd124ebe3b8a57fb78470a75b5aa3ce064e31
          path: private-vcpkg/.full-cef
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/builder
          ref: 457fd41f39cbcff940c7af654da899d44ba5e553
          path: private-vcpkg/.contract-builder
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact revisions and private vcpkg contracts
        env:
          CEF_CONTRACT_SOURCE: ${{ github.workspace }}/private-vcpkg/.full-cef
          CEF_CONTRACT_BUILDER: ${{ github.workspace }}/private-vcpkg/.contract-builder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-vcpkg rev-parse HEAD)" = "c47b1b3cae1b2291b558ec674f61d653614ff637"
          test "$(git -C private-vcpkg/.full-cef rev-parse HEAD)" = "03abd124ebe3b8a57fb78470a75b5aa3ce064e31"
          test "$(git -C private-vcpkg/.contract-builder rev-parse HEAD)" = "457fd41f39cbcff940c7af654da899d44ba5e553"
          cmp triplets/x64-linux-static-release.cmake private-vcpkg/triplets/x64-linux-static-release.cmake
          cmp triplets/x64-windows-static-release.cmake private-vcpkg/triplets/x64-windows-static-release.cmake
          cd private-vcpkg
          python -I -m unittest discover -s ci/cef/tests -v
          python -I -m unittest discover -s ci/cef-full/tests -v
          python -I .full-cef/vcpkg/static/tests/test_platform_contract.py -v
          python -I .full-cef/vcpkg/static/tests/test_platform_gn.py -v
          python -I .full-cef/vcpkg/ports/cef-static/tests/test_native_regressions.py -v
          python -m py_compile ci/cef-full/verify_prefix.py ci/cef-full/native.py ci/cef-full/gn_check.py
      - name: Verify strict release import remains fail-closed in reviewed CEF bytes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'static-third-party requires a source-built CEF engine' private-vcpkg/.full-cef/vcpkg/integration/install.cmake
          grep -Fq 'required_profile == "engine-static"' private-vcpkg/.full-cef/vcpkg/integration/sdk_import.py
          grep -Fq 'strict_requalification_required": False' private-vcpkg/.full-cef/vcpkg/integration/sdk_import.py
          grep -Fq 'CEF::cpp' private-vcpkg/.full-cef/vcpkg/integration/install.cmake
          grep -Fq 'cpp_support' private-vcpkg/.full-cef/vcpkg/integration/install.cmake
          test ! -e private-vcpkg/ports/cef-static/strict-windows-release-import.patch
          ! grep -Fq 'strict-windows-release-import.patch' private-vcpkg/ports/cef-static/portfile.cmake
      - name: Verify content-addressed publisher policy snapshot
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests/vcpkg_bin_snapshot
          PUBLISHER_POLICY_COMMIT: e407d6b853d908b659bea8565f8a607ce5ff637d
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json,os,pathlib; v=json.loads(pathlib.Path("tests/vcpkg_bin_snapshot/LOCK.json").read_text()); assert v["commit"] == os.environ["PUBLISHER_POLICY_COMMIT"]'
          python -m unittest tests.test_vcpkg_bin_snapshot -v
          python -m unittest discover -s tests/vcpkg_bin_snapshot -p 'test_*.py' -v
