name: Strict CEF Windows locked-release qualification
on:
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/cef-strict-windows.yml
      - secure_release/cef_strict_windows.py
      - secure_release/static_audit.py
      - tests/test_static_audit.py
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: 324c4c677119df4f4d4b8beced7ef4623afc2512
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: private-vcpkg/.windows-upstream
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 6a36621ea5493a94d7e79dc388746bbb8829b1d2
          path: private-vcpkg/.full-cef
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact Windows qualification revisions
        shell: pwsh
        run: |
          if ((git -C private-vcpkg rev-parse HEAD) -ne '324c4c677119df4f4d4b8beced7ef4623afc2512') { throw 'vcpkg revision mismatch' }
          if ((git -C private-vcpkg/.windows-upstream rev-parse HEAD) -ne '9e593bb18ea69cc5095e012465dcd675a822ed0d') { throw 'upstream revision mismatch' }
          if ((git -C private-vcpkg/.full-cef rev-parse HEAD) -ne '6a36621ea5493a94d7e79dc388746bbb8829b1d2') { throw 'CEF revision mismatch' }
      - name: Install pinned CMake
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r build-tools.lock
      - name: Validate strict Windows worker syntax
        run: python -m py_compile secure_release/cef_strict_windows.py
      - name: Qualify locked Windows static CEF through vcpkg
        run: python -m secure_release.cef_strict_windows
      - name: Upload non-sensitive Windows qualification summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cef-strict-windows-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cef-strict-windows-summary.json
          retention-days: 7
          if-no-files-found: ignore
