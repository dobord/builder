name: Strict CEF Windows locked-release qualification
on:
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/cef-strict-windows.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg
          ref: 9b8c4b30b943375eaca5ac177d79a26df8035ba7
          path: private-vcpkg
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Validate strict Windows worker syntax
        run: python -m py_compile secure_release/cef_strict_windows.py
