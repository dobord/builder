name: Windows CEF frame-tree V17 verification
on:
  push:
    branches: [repair/windows-cef-60-credit-card-string-v16]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CEF_REPAIR_RECIPE_DIR: ${{ github.workspace }}/private-cef
      CEF_WINDOWS_LAYOUT_SOURCE_ROOT: ${{ github.workspace }}/public-v8
      CEF_WINDOWS_CFUNCTION_SOURCE_ROOT: ${{ github.workspace }}/public-v8
      CEF_WINDOWS_ACCESSIBILITY_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
      CEF_WINDOWS_DOM_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
      CEF_WINDOWS_STRING_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
      CEF_WINDOWS_INLINE_ITEMS_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
      CEF_WINDOWS_API_KEY_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
      CEF_WINDOWS_CREDIT_CARD_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
      CEF_WINDOWS_FRAME_TREE_SOURCE_ROOT: ${{ github.workspace }}/public-chromium
    steps:
      - name: Preserve exact public source newlines
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 03abd124ebe3b8a57fb78470a75b5aa3ce064e31
          path: private-cef
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: v8/v8
          ref: 4323497a6a73839e6d5260f6acd7ec0212cb3321
          path: public-v8
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /include/
            /src/torque/implementation-visitor.cc
            /src/objects/map.h
            /src/objects/object-macros.h
            /src/objects/js-interceptor-map.h
            /src/objects/map.tq
            /src/objects/js-interceptor-map.tq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chromium/chromium
          ref: 79460ebecaa5625e57a5fb679a735659e73dc687
          path: public-chromium
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /third_party/rust/cxx/v1/cxx.h
            /third_party/rust/chromium_crates_io/vendor/cxx-v1/include/cxx.h
            /base/containers/adapters.h
            /base/containers/adapters_internal.h
            /ui/accessibility/ax_node.h
            /ui/accessibility/platform/browser_accessibility.h
            /ui/accessibility/platform/browser_accessibility.cc
            /ui/accessibility/platform/child_iterator.h
            /ui/accessibility/platform/browser_accessibility_manager.cc
            /third_party/blink/renderer/platform/wtf/text/wtf_string.h
            /third_party/blink/renderer/platform/wtf/text/code_point_iterator.h
            /third_party/blink/renderer/core/layout/inline/inline_items_data.cc
            /third_party/blink/renderer/platform/wtf/text/text_offset_map.h
            /base/no_destructor.h
            /google_apis/common/api_key_request_util.h
            /components/autofill/core/common/credit_card_number_validation.h
            /content/browser/renderer_host/frame_tree.h
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with: {python-version: '3.12'}
      - name: Verify exact inputs and offline runtime
        shell: python
        run: |
          import os, subprocess, sys
          pins = {
              '.': os.environ['GITHUB_SHA'],
              'private-cef': '03abd124ebe3b8a57fb78470a75b5aa3ce064e31',
              'public-v8': '4323497a6a73839e6d5260f6acd7ec0212cb3321',
              'public-chromium': '79460ebecaa5625e57a5fb679a735659e73dc687',
          }
          for path, pin in pins.items():
              actual = subprocess.check_output(
                  ['git', '-C', path, 'rev-parse', 'HEAD'], text=True
              ).strip()
              if actual != pin:
                  raise RuntimeError('Regression revision mismatch: ' + path)
          subprocess.run([sys.executable, 'tools/verify_wheelhouse.py'], check=True)
          subprocess.run([
              sys.executable, '-m', 'pip', 'install',
              '--disable-pip-version-check', '--no-index',
              '--find-links', 'vendor/wheels', '--require-hashes',
              '--only-binary=:all:', '-r', 'requirements.lock',
          ], check=True)
          subprocess.run([sys.executable, 'tools/tink_offline.py', '--version'], check=True)
      - name: Authenticate frame-tree iterator failure and repair
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          output = Path('frame-tree-iterator-diagnostic-results.json')
          report = {
              'schema': 1,
              'kind': 'public-windows-frame-tree-iterator-diagnostic-results',
              'sha': os.environ['GITHUB_SHA'],
              'run': int(os.environ['GITHUB_RUN_ID']),
              'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'os': os.environ['RUNNER_OS'],
              'proof': {},
              'blobs': {},
              'stages': {},
          }

          def save():
              output.write_bytes(
                  (json.dumps(report, sort_keys=True, indent=2) + '\n').encode()
              )

          save()
          source = Path(
              'public-chromium/content/browser/renderer_host/frame_tree.h'
          )
          raw = source.read_bytes()

          def git_blob(data):
              return hashlib.sha1(
                  b'blob ' + str(len(data)).encode() + b'\0' + data
              ).hexdigest()

          if (
              git_blob(raw) != '2259ef06982e610888fcf35a5dd293bdfa38f5fe'
              or b'\r' in raw
          ):
              raise RuntimeError('Pinned public frame_tree.h identity mismatch')

          edits = (
              (
                  b'    NodeIterator(const NodeIterator& other);\n'
                  b'    ~NodeIterator();\n',
                  b'    NodeIterator(const NodeIterator& other);\n'
                  b'    NodeIterator& operator=(const NodeIterator&) = default;\n'
                  b'    ~NodeIterator();\n',
              ),
              (
                  b'    RAW_PTR_EXCLUSION const FrameTreeNode* const '
                  b'root_of_subtree_to_skip_;\n\n'
                  b'    const bool should_descend_into_inner_trees_;\n'
                  b'    const bool include_delegate_nodes_for_inner_frame_trees_;\n',
                  b'    RAW_PTR_EXCLUSION const FrameTreeNode* '
                  b'root_of_subtree_to_skip_;\n\n'
                  b'    bool should_descend_into_inner_trees_;\n'
                  b'    bool include_delegate_nodes_for_inner_frame_trees_;\n',
              ),
          )
          fixed = raw
          for anchor, replacement in edits:
              if fixed.count(anchor) != 1:
                  raise RuntimeError('Frame-tree repair anchor mismatch')
              fixed = fixed.replace(anchor, replacement, 1)

          def class_block(data, name, next_name):
              begin = data.index(
                  ('  class CONTENT_EXPORT ' + name + ' {\n').encode()
              )
              end = data.index(
                  ('\n  class CONTENT_EXPORT ' + next_name + ' {').encode(),
                  begin,
              )
              return data[begin:end]

          def state(data):
              block = class_block(data, 'NodeIterator', 'NodeRange')
              assignment = (
                  block.count(
                      b'NodeIterator& operator=(const NodeIterator&) = default;'
                  )
                  == 1
              )
              root_const = (
                  block.count(
                      b'const FrameTreeNode* const root_of_subtree_to_skip_;'
                  )
                  == 1
              )
              root_mutable = (
                  block.count(
                      b'const FrameTreeNode* root_of_subtree_to_skip_;'
                  )
                  == 1
              )
              const_flags = (
                  block.count(
                      b'\n    const bool should_descend_into_inner_trees_;'
                  )
                  == 1
                  and block.count(
                      b'\n    const bool '
                      b'include_delegate_nodes_for_inner_frame_trees_;'
                  )
                  == 1
              )
              mutable_flags = (
                  block.count(
                      b'\n    bool should_descend_into_inner_trees_;'
                  )
                  == 1
                  and block.count(
                      b'\n    bool include_delegate_nodes_for_inner_frame_trees_;'
                  )
                  == 1
              )
              return (
                  assignment,
                  root_const,
                  root_mutable,
                  const_flags,
                  mutable_flags,
              )

          if state(raw) != (False, True, False, True, False):
              raise RuntimeError('Unexpected original NodeIterator declaration state')
          if state(fixed) != (True, False, True, False, True):
              raise RuntimeError('Unexpected fixed NodeIterator declaration state')

          raw_range = raw[
              raw.index(b'  class CONTENT_EXPORT NodeRange {\n'):
              raw.index(b'\n  class CONTENT_EXPORT Delegate {')
          ]
          fixed_range = fixed[
              fixed.index(b'  class CONTENT_EXPORT NodeRange {\n'):
              fixed.index(b'\n  class CONTENT_EXPORT Delegate {')
          ]
          if raw_range != fixed_range:
              raise RuntimeError('Frame-tree repair changed NodeRange')

          before = hashlib.sha256(raw).hexdigest()
          after = hashlib.sha256(fixed).hexdigest()
          report['proof'] = {
              'schema': 1,
              'kind': 'public-windows-frame-tree-iterator-proof',
              'public_git_blob': '2259ef06982e610888fcf35a5dd293bdfa38f5fe',
              'before_sha256': before,
              'after_sha256': after,
              'semantic_edits': 4,
              'original_copy_assignable': False,
              'windows_find_if_failed': False,
              'fixed_copy_assignable': True,
              'fixed_find_if_runs': False,
              'node_range_unchanged': True,
          }
          save()

          def probe(assignable, use_find):
              assignment = (
                  '  NodeIterator& operator=(const NodeIterator&) = default;\n'
                  if assignable
                  else ''
              )
              root_type = (
                  'const FrameTreeNode*'
                  if assignable
                  else 'const FrameTreeNode* const'
              )
              flag_type = 'bool' if assignable else 'const bool'
              body = (
                  '''  auto found = std::find_if(
              begin, end, [](FrameTreeNode* node) { return node->value == 2; });
            return found == end || (*found)->value != 2;
          '''
                  if use_find
                  else '''  return std::is_copy_assignable_v<NodeIterator> ? 7 : 0;
          '''
              )
              return f'''#include <algorithm>
          #include <cstddef>
          #include <deque>
          #include <initializer_list>
          #include <iterator>
          #include <type_traits>
          struct FrameTreeNode {{ int value; }};
          class NodeIterator {{
           public:
            using iterator_category = std::forward_iterator_tag;
            using value_type = FrameTreeNode*;
            using difference_type = std::ptrdiff_t;
            using pointer = FrameTreeNode**;
            using reference = FrameTreeNode*&;
            NodeIterator(
                std::initializer_list<FrameTreeNode*> nodes,
                const FrameTreeNode* root,
                bool descend,
                bool include)
                : current_node_(nullptr),
                  root_of_subtree_to_skip_(root),
                  should_descend_into_inner_trees_(descend),
                  include_delegate_nodes_for_inner_frame_trees_(include),
                  queue_(nodes) {{ Advance(); }}
            NodeIterator(const NodeIterator&) = default;
          {assignment}  ~NodeIterator() = default;
            NodeIterator& operator++() {{ Advance(); return *this; }}
            bool operator==(const NodeIterator& rhs) const {{
              return current_node_ == rhs.current_node_;
            }}
            FrameTreeNode* operator*() {{ return current_node_; }}
            bool policy() const {{
              return root_of_subtree_to_skip_ == nullptr &&
                     should_descend_into_inner_trees_ &&
                     include_delegate_nodes_for_inner_frame_trees_;
            }}
           private:
            void Advance() {{
              if (queue_.empty()) {{
                current_node_ = nullptr;
              }} else {{
                current_node_ = queue_.front();
                queue_.pop_front();
              }}
            }}
            FrameTreeNode* current_node_;
            {root_type} root_of_subtree_to_skip_;
            {flag_type} should_descend_into_inner_trees_;
            {flag_type} include_delegate_nodes_for_inner_frame_trees_;
            std::deque<FrameTreeNode*> queue_;
          }};
          static_assert(std::is_copy_constructible_v<NodeIterator>);
          static_assert(
              std::is_copy_assignable_v<NodeIterator> == {str(assignable).lower()});
          int main() {{
            FrameTreeNode first{{1}}, second{{2}};
            NodeIterator begin({{&first, &second}}, nullptr, true, true);
            NodeIterator end({{}}, nullptr, true, true);
            if (!begin.policy()) return 5;
          {body}}}
          '''

          with tempfile.TemporaryDirectory(
              prefix='frame-tree-iterator-'
          ) as folder:
              root = Path(folder)
              original_traits = root / 'original_traits.cc'
              original_find = root / 'original_find.cc'
              fixed_find = root / 'fixed_find.cc'
              original_traits.write_text(probe(False, False), encoding='utf-8')
              original_find.write_text(probe(False, True), encoding='utf-8')
              fixed_find.write_text(probe(True, True), encoding='utf-8')

              def command(src, out):
                  if os.name == 'nt':
                      where = (
                          Path(
                              os.environ.get(
                                  'ProgramFiles(x86)', 'C:/Program Files (x86)'
                              )
                          )
                          / 'Microsoft Visual Studio/Installer/vswhere.exe'
                      )
                      clang = (
                          Path(
                              os.environ.get(
                                  'ProgramFiles', 'C:/Program Files'
                              )
                          )
                          / 'LLVM/bin/clang-cl.exe'
                      )
                      if not where.is_file() or not clang.is_file():
                          raise RuntimeError('Native Windows toolchain required')
                      vs = Path(
                          subprocess.check_output(
                              [
                                  str(where),
                                  '-latest',
                                  '-products',
                                  '*',
                                  '-requires',
                                  'Microsoft.VisualStudio.Component.'
                                  'VC.Tools.x86.x64',
                                  '-property',
                                  'installationPath',
                              ],
                              text=True,
                          ).strip()
                      )
                      version = (
                          vs
                          / 'VC/Auxiliary/Build/'
                          'Microsoft.VCToolsVersion.default.txt'
                      ).read_text().strip()
                      clang_version = subprocess.check_output(
                          [str(clang), '--version'], text=True
                      ).splitlines()[0]
                      if (
                          not version.startswith('14.44.')
                          or re.search(
                              r'clang version 20\.1\.8\b', clang_version
                          )
                          is None
                      ):
                          raise RuntimeError(
                              'Reviewed Windows toolchain changed'
                          )
                      batch = root / (src.stem + '.cmd')
                      batch.write_bytes(
                          (
                              '@echo off\r\n'
                              f'call "{vs}/VC/Auxiliary/Build/'
                              'vcvarsall.bat" x64 >nul\r\n'
                              'if errorlevel 1 exit /b 90\r\n'
                              f'"{clang}" /nologo /std:c++20 /EHsc /W4 /WX '
                              f'"{src}" /Fe:"{out}"\r\n'
                          ).encode()
                      )
                      return ['cmd.exe', '/d', '/c', str(batch)]
                  clang = shutil.which('clang++')
                  if not clang:
                      raise RuntimeError('Native Clang required')
                  return [
                      clang,
                      '-std=c++20',
                      '-Wall',
                      '-Wextra',
                      '-Werror',
                      str(src),
                      '-o',
                      str(out),
                  ]

              def build(src, label):
                  out = root / (
                      label + ('.exe' if os.name == 'nt' else '')
                  )
                  result = subprocess.run(
                      command(src, out),
                      capture_output=True,
                      text=True,
                      errors='replace',
                      timeout=90,
                  )
                  return result, out

              traits, traits_bin = build(
                  original_traits, 'original_traits'
              )
              if traits.returncode:
                  raise RuntimeError(
                      'Original iterator trait probe failed unexpectedly: '
                      + (traits.stdout + traits.stderr)[-2000:]
                  )
              subprocess.run(
                  [str(traits_bin)],
                  check=True,
                  capture_output=True,
                  timeout=15,
              )

              old, _ = build(original_find, 'original_find')
              if os.name == 'nt':
                  evidence = old.stdout + old.stderr
                  if (
                      old.returncode in (0, 90)
                      or 'copy assignment operator is implicitly deleted'
                      not in evidence
                      or 'root_of_subtree_to_skip_' not in evidence
                  ):
                      raise RuntimeError(
                          'Exact Windows std::find_if failure was not '
                          'reproduced: ' + evidence[-2000:]
                      )
                  report['proof']['windows_find_if_failed'] = True

              fixed_result, fixed_bin = build(fixed_find, 'fixed_find')
              if fixed_result.returncode:
                  raise RuntimeError(
                      'Fixed iterator probe failed: '
                      + (fixed_result.stdout + fixed_result.stderr)[-2000:]
                  )
              subprocess.run(
                  [str(fixed_bin)],
                  check=True,
                  capture_output=True,
                  timeout=15,
              )
              report['proof']['fixed_find_if_runs'] = True

          save()
          print(
              'CEF_FRAME_TREE_ITERATOR_NATIVE '
              'original_nonassignable=true '
              'windows_find_if_failed='
              + str(report['proof']['windows_find_if_failed']).lower()
              + ' fixed_assignable=true fixed_find_if_runs=true '
              'public_blob=true edits=4 before_sha256='
              + before
              + ' after_sha256='
              + after
          )
      - name: Bind exact V17 implementation digest
        shell: python
        run: |
          import copy, hashlib, json
          from pathlib import Path
          from secure_release import cef_windows_source_repair as repair
          from secure_release import cef_windows_iteration as worker
          from secure_release.crypto import canonical, parse
          path = Path('ci/cef-windows-engine-lock.json')
          raw = path.read_bytes()
          value = parse(raw)
          digest = hashlib.sha256(Path('secure_release/cef_windows_source_repair.py').read_bytes()).hexdigest()
          current = repair.profile()
          if current['id'] != 'windows-frame-tree-node-iterator-assignment-v17' or len(current['corrections']) != 17:
              raise RuntimeError('Not the reviewed V17 source profile')
          if current['implementation_sha256'] != digest:
              raise RuntimeError('Source implementation digest mismatch')
          if (value.get('schema') != 2 or value.get('platform') != 'windows'
                  or value.get('vcpkg_commit') != worker.VCPKG
                  or value.get('cef_recipe_commit') != worker.CEF
                  or canonical(value.get('checkpoint')) != canonical(repair.UPGRADE_V16)):
              raise RuntimeError('V17 candidate changed exact V16 checkpoint input or source pins')
          branch_digest = value.get('source_repair', {}).get('implementation_sha256')
          if branch_digest not in ('0' * 64, digest):
              raise RuntimeError('Unreviewed implementation binding; only explicit bootstrap or exact lock permitted')
          expected_branch = copy.deepcopy(current)
          expected_branch['implementation_sha256'] = branch_digest
          if canonical(value.get('source_repair')) != canonical(expected_branch):
              raise RuntimeError('V17 correction/profile mismatch')
          original = copy.deepcopy(value)
          matched = branch_digest == digest
          if not matched:
              value['source_repair']['implementation_sha256'] = digest
              reverted = copy.deepcopy(value)
              reverted['source_repair']['implementation_sha256'] = branch_digest
              if canonical(reverted) != canonical(original):
                  raise RuntimeError('Binding changed more than the implementation digest')
              path.write_bytes((json.dumps(value, indent=2) + '\n').encode('utf-8'))
          binding = {
              'schema': 1, 'kind': 'public-windows-frame-tree-v17-lock-binding',
              'branch_lock_matched': matched,
              'branch_implementation_sha256': branch_digest,
              'implementation_sha256': digest,
              'branch_lock_sha256': hashlib.sha256(raw).hexdigest(),
              'effective_lock_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
          }
          Path('frame-tree-v17-lock-binding.json').write_bytes((json.dumps(binding, indent=2) + '\n').encode())
          print('CEF_FRAME_TREE_V17_LOCK_BINDING branch_lock_matched=' + str(matched).lower() + ' implementation_sha256=' + digest)
      - name: V17 focused and complete regressions
        shell: python
        run: |
          import ast, hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          from secure_release.crypto import parse
          tested = ('.github/workflows/cef-windows-engine-iteration.yml', '.github/workflows/windows-cef-credit-card-v16-check.yml', 'ci/cef-windows-engine-lock.json', 'secure_release/cef_windows_iteration.py', 'secure_release/cef_windows_source_repair.py', 'tests/cef_windows_callable_repair_base.py', 'tests/cef_windows_layout_inputs.py', 'tests/cef_windows_source_repair_base.py', 'tests/cef_windows_tail_size_repair_base.py', 'tests/fixtures/cef-windows/credit_card_number_validation.h', 'tests/fixtures/cef-windows/frame_tree.h', 'tests/test_cef_windows_accessibility_iterator_repair.py', 'tests/test_cef_windows_api_key_string_repair.py', 'tests/test_cef_windows_callable_repair.py', 'tests/test_cef_windows_credit_card_string_repair.py', 'tests/test_cef_windows_dom_memory_repair.py', 'tests/test_cef_windows_frame_tree_iterator_repair.py', 'tests/test_cef_windows_inline_empty_repair.py', 'tests/test_cef_windows_inline_items_lifetime_repair.py', 'tests/test_cef_windows_source_repair.py', 'tests/test_cef_windows_string_iterator_repair.py', 'tests/test_cef_windows_tail_size_repair.py', 'tests/test_cef_windows_workspace_path_migration.py')
          for path in tested:
              if path.endswith('.py'):
                  ast.parse(Path(path).read_bytes(), filename=path)
          binding = parse(Path('frame-tree-v17-lock-binding.json').read_bytes())
          diagnostic = parse(Path('frame-tree-iterator-diagnostic-results.json').read_bytes())
          if (diagnostic.get('sha') != os.environ['GITHUB_SHA']
                  or diagnostic.get('run') != int(os.environ['GITHUB_RUN_ID'])
                  or diagnostic.get('attempt') != 1
                  or diagnostic.get('proof', {}).get('fixed_find_if_runs') is not True):
              raise RuntimeError('Original exact native diagnostic missing')
          stages = {
              'focused': ['tests.test_cef_windows_frame_tree_iterator_repair',
                          'tests.test_cef_windows_workspace_path_migration',
                          'tests.test_cef_windows_credit_card_string_repair', '-v'],
              'repair': ['discover', '-s', 'tests', '-p', 'test_cef_windows_source_repair.py', '-v'],
              'full': ['discover', '-s', 'tests', '-v'],
          }
          report = {
              'schema': 1, 'kind': 'public-windows-frame-tree-v17-test-results',
              'sha': os.environ['GITHUB_SHA'], 'run': int(os.environ['GITHUB_RUN_ID']),
              'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'os': os.environ['RUNNER_OS'],
              'binding': binding, 'diagnostic_proof': diagnostic['proof'],
              'blobs': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tested},
              'stages': {},
          }
          output = Path('frame-tree-v17-ci-results.json')
          def save():
              output.write_bytes((json.dumps(report, sort_keys=True, indent=2) + '\n').encode())
          save()
          for name, args in stages.items():
              result = subprocess.run([sys.executable, '-m', 'unittest', *args],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
                  errors='replace', timeout=1800)
              print(result.stdout)
              count = re.findall(r'Ran (\d+) tests? in ([0-9.]+)s', result.stdout)
              skips = re.findall(r'OK \(skipped=(\d+)\)', result.stdout)
              def proofs(prefix):
                  return [line for line in result.stdout.splitlines() if line.startswith(prefix + ' ')]
              report['stages'][name] = {
                  'exit_code': result.returncode,
                  'tests': int(count[-1][0]) if len(count) == 1 else None,
                  'skipped': int(skips[-1]) if skips else 0,
                  'frame_proof': proofs('CEF_FRAME_TREE_V17_NATIVE'),
                  'credit_proof': proofs('CEF_CREDIT_CARD_STRING_NATIVE'),
                  'workspace_proof': proofs('CEF_WINDOWS_WORKSPACE_PATH_NATIVE'),
