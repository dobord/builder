name: Encrypted scene lifecycle diagnosis
on:
  push:
    branches: [test/frdpd-46-installed-window-20261003]
    paths: ['.github/workflows/frdpd-scene-diagnostic.yml']
permissions:
  contents: read
env:
  SOURCE_SHA: 'c887750c9a7dfc5a785a20e928418f58b5f7bf4c'
  SOURCE_TREE: '464cbb5b27157630342d26456fa7870ce1586b01'
  REVIEW_VARIANT: full
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Install pinned public encryption dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Diagnose exact source inside Docker
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib, json, os, runpy, sys, traceback
          from pathlib import Path
          os.umask(0o077)
          root = Path(os.environ['RUNNER_TEMP']) / 'review-validation'
          root.mkdir(mode=0o700, exist_ok=True)
          rc = 1
          try:
              driver = Path('investigations/frdpd-103/review-ci.py')
              data = driver.read_bytes()
              if hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != '4e2d834907346471c343414fa482190445cc366a':
                  raise ValueError('Regression driver changed')
              api = runpy.run_path(str(driver))
              original = api['run']
              def diagnostic_run(name, args, *, env=None, timeout=900):
                  result = original(name, args, env=env, timeout=timeout)
                  if name in ('e2e-xorg-dummy', 'e2e-xorg-native'):
                      for index in (2, 3):
                          label = name + '-diagnostic-' + str(index)
                          local = dict(env)
                          local['FRDP_E2E_ARTIFACTS'] = str(root / label)
                          local['COMPOSE_PROJECT_NAME'] += '-diag-' + str(index)
                          original(label, args, env=local, timeout=timeout)
                  return result
              api['main'].__globals__['run'] = diagnostic_run
              rc = api['main']()
          except Exception:
              (root / 'driver-error.log').write_text(traceback.format_exc())
          finally:
              os.environ.pop('SOURCE_READ_TOKEN', None)
              proof = {'source_sha': os.environ['SOURCE_SHA'], 'tree_sha': os.environ['SOURCE_TREE'], 'builder_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'variant': 'full', 'diagnostic_only': True, 'exit_code': rc}
              (root / 'verification.json').write_text(json.dumps(proof, indent=2))
          sys.exit(rc)
          PY
      - name: Transfer private diagnostic ownership
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/review-validation"; then
            sudo chown -R --no-dereference "$(id -u):$(id -g)" "$RUNNER_TEMP/review-validation"
          fi
      - name: Encrypt all detailed diagnostics
        if: always()
        run: |
          python - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path
          os.umask(0o077)
          data = Path('secure_release/crypto.py').read_bytes()
          if hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != 'cfbe7a904805f71ca94f8245e3bf5f83c9a6be69':
              raise ValueError('Envelope implementation changed')
          from secure_release.crypto import encrypt_file
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'review-evidence.tar.gz'
          with tarfile.open(archive, 'w:gz') as out:
              for path in (root / 'review-validation').glob('*'):
                  if path.name not in ('source', 'askpass', 'askpass-export'):
                      out.add(path, arcname=path.name)
          context = {'purpose': 'frdpd-scene-diagnostic-v1', 'source_sha': os.environ['SOURCE_SHA'], 'tree_sha': os.environ['SOURCE_TREE'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'builder_sha': os.environ['GITHUB_SHA'], 'variant': 'full', 'repository': os.environ['GITHUB_REPOSITORY']}
          encrypt_file(archive, root / 'review.enc', os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'], context)
          archive.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scene-diagnostic-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review.enc
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - if: always()
        run: sudo rm -rf "$RUNNER_TEMP/review-validation" "$RUNNER_TEMP/review.enc" "$RUNNER_TEMP/review-evidence.tar.gz"
