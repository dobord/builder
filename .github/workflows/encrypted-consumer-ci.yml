name: Encrypted native consumer qualification
run-name: Encrypted consumer ${{ inputs.request_digest }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      request_digest:
        required: true
        type: string
      request:
        description: Signed HPKE ciphertext only
        required: true
        type: string
permissions: {}
concurrency:
  group: encrypted-consumer-${{ inputs.request_digest }}
  cancel-in-progress: false
env:
  CONSUMER_REQUEST_ID: ${{ inputs.request_id }}
  CONSUMER_REQUEST_DIGEST: ${{ inputs.request_digest }}
  CONSUMER_REQUEST: ${{ inputs.request }}
  CONSUMER_BUILDER_SHA: ${{ vars.CONSUMER_CI_BUILDER_SHA }}
jobs:
  prepare:
    if: >-
      github.repository_id == '1372874997' &&
      github.sha == vars.CONSUMER_CI_BUILDER_SHA &&
      vars.CONSUMER_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install reviewed crypto runtime
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r project-ci-requirements.lock
      - name: Authenticate consumer and prepare pinned inputs
        id: prepare
        env:
          CONSUMER_INPUT_PRIVATE_KEY_B64: ${{ secrets.CONSUMER_CI_INPUT_PRIVATE_KEY_B64 }}
          CONSUMER_VERIFY_PUBLIC_KEY_B64: ${{ secrets.CONSUMER_CI_VERIFY_PUBLIC_KEY_B64 }}
          CONSUMER_POLICY_B64: ${{ secrets.CONSUMER_CI_POLICY_B64 }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          BUILDER_READ_TOKEN: ${{ github.token }}
        run: python -m secure_release.consumer_ci prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumer-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-cipher/inputs.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Encrypt diagnostics
        if: always()
        run: python -m secure_release.consumer_ci outputs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consumer-diagnostics-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-output/*.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove plaintext staging
        if: always()
        run: python -m secure_release.consumer_ci cleanup
  qualify:
    name: Consumer ${{ matrix.lane }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CONSUMER_LANE: ${{ matrix.lane }}
      CONSUMER_POLICY_B64: ${{ secrets.CONSUMER_CI_POLICY_B64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install reviewed crypto runtime
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r project-ci-requirements.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: consumer-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-cipher
      - name: Authenticate and materialize inputs
        env:
          CONSUMER_INPUT_PRIVATE_KEY_B64: ${{ secrets.CONSUMER_CI_INPUT_PRIVATE_KEY_B64 }}
          CONSUMER_VERIFY_PUBLIC_KEY_B64: ${{ secrets.CONSUMER_CI_VERIFY_PUBLIC_KEY_B64 }}
        run: python -m secure_release.consumer_ci materialize
      - name: Execute native recipe
        run: python -m secure_release.consumer_ci run
      - name: Encrypt results and diagnostics
        if: always()
        run: python -m secure_release.consumer_ci outputs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consumer-output-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-output/*.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove plaintext staging
        if: always()
        run: python -m secure_release.consumer_ci cleanup
  required:
    name: Consumer required
    if: always()
    needs: [prepare, qualify]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every consumer lane
        env:
          PREPARE: ${{ needs.prepare.result }}
          QUALIFY: ${{ needs.qualify.result }}
        run: |
          test "$PREPARE" = success
          test "$QUALIFY" = success
