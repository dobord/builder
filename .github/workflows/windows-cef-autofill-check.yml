name: Windows CEF Autofill lifetime verification
on:
  push:
    branches: [repair/windows-cef-37-autofill]
permissions:
  contents: read
jobs:
  public-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/cef
          ref: 03abd124ebe3b8a57fb78470a75b5aa3ce064e31
          path: public-cef
          persist-credentials: false
      - name: Snapshot tracked public inputs only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/public-autofill-inputs"
          mkdir -p "$out/chromium"
          git archive --format=tar HEAD > "$out/builder-source.tar"
          git rev-parse HEAD > "$out/builder-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$out/builder-tree.txt"
          git -C public-cef archive --format=tar HEAD > "$out/cef-source.tar"
          for path in components/autofill/core/common/form_field_data.cc components/autofill/core/common/autocomplete_parsing_util.h components/autofill/core/common/html_field_types.h base/no_destructor.h; do
            mkdir -p "$out/chromium/$(dirname "$path")"
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "$out/chromium/$path" "https://raw.githubusercontent.com/chromium/chromium/79460ebecaa5625e57a5fb679a735659e73dc687/$path"
          done
          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-autofill-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/public-autofill-inputs
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
