name: Desktop Windows 11 baseline RemoteApp
on:
  push:
    branches: [investigate/frdpd-103-mstsc-20260924]
    paths: ['.github/workflows/frdpd-103-win11-baseline.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: frdpd-103-win11-baseline-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 3637007a36881a460693be50d66079291c1f4d33
  CANDIDATE_SHA: 3637007a36881a460693be50d66079291c1f4d33
  CANDIDATE_TREE: ffa3bd512e739cc396ec56431f0759e501d9c359
  SOURCE_RUN: '36026580121'
  ARTIFACT_ENCRYPTION_PUBLIC_KEY: '{"primaryKeyId":341452413,"key":[{"keyData":{"typeUrl":"type.googleapis.com/google.crypto.tink.HpkePublicKey","value":"EgYIARABGAIaIEZ8/6Ix7wwUaPaf97F3P+pJFZYdq4doLNb8MNvTrsQJ","keyMaterialType":"ASYMMETRIC_PUBLIC"},"status":"ENABLED","keyId":341452413,"outputPrefixType":"TINK"}]}'
jobs:
  desktop-win11-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
          architecture: x64
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Fixture-specific first-use consent
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File investigations/frdpd-103/native-preflight.ps1
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: differential-input-${{ env.SOURCE_RUN }}
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-cipher
      - name: Authenticate exact baseline runtime
        env:
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from secure_release.crypto import decrypt_file
          root=Path(os.environ['RUNNER_TEMP']);(root/'native-private').mkdir(exist_ok=True)
          decrypt_file(root/'native-cipher'/'native.enc',root/'native-private'/'native-rootfs.tar.gz',os.environ['BUILDER_INPUT_PRIVATE_KEY'],{'purpose':'frdpd-103-native-input','run_id':os.environ['SOURCE_RUN'],'source_sha':os.environ['SOURCE_SHA']})
          '@ | python -
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Record actual client platform and display driver
        shell: pwsh
        run: |
          @{ operating_system=(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture); processor=(Get-CimInstance Win32_Processor | Select-Object Architecture); video=(Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,VideoProcessor); python_architecture='x64'; backend='xorg-dummy' } | ConvertTo-Json -Depth 5 | Set-Content "$env:RUNNER_TEMP/native-private/host-product.json"
      - name: Native desktop client without capability or security overrides
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path('investigations/frdpd-103/native.py');s=p.read_text()
          boot="set +e; sudo cloud-init status --wait --format=json; rc=$?; set -e; case $rc in 0|2) ;; *) exit $rc ;; esac; test -f /var/lib/cloud/instance/boot-finished; sudo systemctl is-active --quiet docker; sudo docker info >/dev/null\\n"
          for old,new in [('FRDP_DISPLAY_BACKEND=xorg-dummy\\n','FRDP_DISPLAY_BACKEND=xorg-dummy\\nWLOG_LEVEL=DEBUG\\n'),('time.monotonic()-stable_since>=10','time.monotonic()-stable_since>=30'),("REPORT.get('stable_window_seconds',0)>=10","REPORT.get('stable_window_seconds',0)>=30"),('sudo cloud-init status --wait; sudo docker info >/dev/null\\n',boot)]:
              assert s.count(old)==1, 'Fixture contract changed'
              s=s.replace(old,new,1)
          p.write_text(s)
          '@ | python -
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python investigations/frdpd-103/native.py
          Set-Content "$env:RUNNER_TEMP/native-exit" $LASTEXITCODE
          exit 0
      - name: Encrypt baseline evidence
        if: always()
        shell: pwsh
        run: |
          @'
          import os,tarfile
          from pathlib import Path
          from secure_release.crypto import encrypt_file
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'native.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for p in (root/'native-private').glob('*'):
                  if p.is_file() and p.suffix in ('.log','.json','.png','.txt'):out.add(p,arcname=p.name)
          encrypt_file(archive,root/'native.enc',os.environ['ARTIFACT_ENCRYPTION_PUBLIC_KEY'],{'purpose':'frdpd-103-win11-arm-baseline','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['SOURCE_SHA'],'input_run':os.environ['SOURCE_RUN']})
          archive.unlink()
          '@ | python -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-win11-arm-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/native.enc
          retention-days: 1
          compression-level: 0
      - name: Clean and report actual result
        if: always()
        shell: pwsh
        run: |
          Get-Process qemu-system-x86_64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $rc=1
          if (Test-Path "$env:RUNNER_TEMP/native-exit") {$rc=[int](Get-Content "$env:RUNNER_TEMP/native-exit")}
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP/native-private","$env:RUNNER_TEMP/native-cipher" -ErrorAction SilentlyContinue
          exit $rc
