name: CEF private publisher policy contracts
on:
  push:
    branches:
      - feature/cef-static-integration
    paths:
      - .github/workflows/cef-publisher-policy-contracts.yml
permissions:
  contents: read
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/vcpkg-bin
          ref: 41fa35bd3a3a68bc887fd29811a2f8b9ca18da12
          path: private-publisher
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact private publisher and non-executing CEF policy tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-publisher rev-parse HEAD)" = "41fa35bd3a3a68bc887fd29811a2f8b9ca18da12"
          cd private-publisher
          python -I -m unittest discover -s ci/tests -v
          python -m py_compile ci/cef_publication.py ci/cef_archive_gate.py
