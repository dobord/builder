name: Encrypted project qualification
run-name: Encrypted qualification ${{ inputs.request_digest }}
on:
  workflow_dispatch:
    inputs:
      request_schema:
        description: Explicit transport protocol (1 Actions artifact, 2 local operator Git blob)
        default: '1'
        required: true
        type: choice
        options: ['1', '2']
      request_id:
        required: true
        type: string
      request_digest:
        required: true
        type: string
      request:
        description: Signed HPKE ciphertext; no plaintext source metadata
        required: true
        type: string
permissions: {}
concurrency:
  group: encrypted-project-${{ inputs.request_digest }}
  cancel-in-progress: false
env:
  CI_REQUEST_ID: ${{ inputs.request_id }}
  CI_REQUEST_SCHEMA: ${{ inputs.request_schema }}
  CI_REQUEST_DIGEST: ${{ inputs.request_digest }}
  CI_BUILDER_SHA: ${{ vars.PROJECT_CI_BUILDER_SHA }}
jobs:
  prepare:
    if: >-
      github.repository_id == '1372874997' &&
      github.sha == vars.PROJECT_CI_BUILDER_SHA &&
      vars.PROJECT_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install reviewed crypto runtime
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r project-ci-requirements.lock
      - name: Authenticate request, policy and encrypted sources without execution
        id: prepare
        env:
          CI_REQUEST: ${{ inputs.request }}
          CI_INPUT_PRIVATE_KEY_B64: ${{ secrets.PROJECT_CI_INPUT_PRIVATE_KEY_B64 }}
          CI_VERIFY_PUBLIC_KEY_B64: ${{ secrets.PROJECT_CI_VERIFY_PUBLIC_KEY_B64 }}
          CI_SOURCE_POLICY_B64: ${{ secrets.PROJECT_CI_SOURCE_POLICY_B64 }}
          SOURCE_READ_TOKEN: ${{ secrets.PROJECT_CI_SOURCE_READ_TOKEN }}
          BUILDER_READ_TOKEN: ${{ github.token }}
        run: python -m secure_release.project_ci prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-dependency/dependency-review.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-input/sources.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove staging plaintext
        if: always()
        run: python -m secure_release.project_ci cleanup
  qualify:
    name: Encrypted lane ${{ matrix.lane }}
    needs: prepare
    concurrency:
      group: ${{ matrix.lane == 'performance-fixed-runner-benchmarks-0' && 'project-ci-fixed-performance' || format('project-ci-{0}-{1}', github.run_id, matrix.lane) }}
      cancel-in-progress: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CI_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install reviewed crypto runtime
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r project-ci-requirements.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-input
      - name: Authenticate and decrypt this attempt into ephemeral staging
        env:
          CI_INPUT_PRIVATE_KEY_B64: ${{ secrets.PROJECT_CI_INPUT_PRIVATE_KEY_B64 }}
          BUILDER_READ_TOKEN: ${{ github.token }}
          CI_VERIFY_PUBLIC_KEY_B64: ${{ secrets.PROJECT_CI_VERIFY_PUBLIC_KEY_B64 }}
        run: python -m secure_release.project_ci materialize
      - name: Execute credential-free qualification with private stdout and stderr
        env:
          CI_INPUT_PUBLIC_KEY_B64: ${{ secrets.PROJECT_CI_INPUT_PUBLIC_KEY_B64 }}
        run: python -m secure_release.project_ci run
      - name: Encrypt reports and fuzz corpora even after failure
        if: always()
        run: python -m secure_release.project_ci reports
      - name: Encrypt private diagnostics
        if: always()
        run: python -m secure_release.project_ci diagnostics
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ШИФРОВАНЫЕ ЛОГИ-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-logs/*.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reports-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cipher-reports/reports.enc
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Remove all staging plaintext
        if: always()
        run: python -m secure_release.project_ci cleanup
  required:
    name: Encrypted qualification required
    if: always()
    needs: [prepare, qualify]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Fail closed on every missing, skipped or unsuccessful lane
        env:
          PREPARE: ${{ needs.prepare.result }}
          QUALIFY: ${{ needs.qualify.result }}
        run: |
          test "$PREPARE" = success
          test "$QUALIFY" = success
