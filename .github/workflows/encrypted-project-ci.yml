name: Isolated encrypted native CMake trial
run-name: Native CMake trial ${{ inputs.request_digest }}
on:
  workflow_dispatch:
    inputs:
      request_schema:
        default: '2'
        required: true
        type: choice
        options: ['2']
      request_id:
        required: true
        type: string
      request_digest:
        required: true
        type: string
      request:
        description: Signed HPKE ciphertext only
        required: true
        type: string
permissions: {}
concurrency:
  group: native-cmake-trial-${{ inputs.request_digest }}
  cancel-in-progress: false
jobs:
  native:
    if: >-
      github.repository_id == '1372874997' &&
      github.ref == 'refs/heads/ci/isolated-native-cmake-validation' &&
      github.actor_id == '5323024' && github.run_attempt == 1 &&
      inputs.request_schema == '2'
    name: Native trial (${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: linux-host, runner: ubuntu-24.04}
          - {lane: linux-sanitizers, runner: ubuntu-24.04}
          - {lane: Debug, runner: windows-2022}
          - {lane: Release, runner: windows-2022}
    env:
      TRIAL_LANE: ${{ matrix.lane }}
      CI_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install the reviewed crypto runtime from the offline wheelhouse
        run: >-
          python -m pip install --no-index --require-hashes --only-binary=:all:
          --find-links vendor/wheels -r requirements.lock
      - name: Verify native Windows process-tree ownership
        if: runner.os == 'Windows'
        run: python -m secure_release.windows_ownership_gate
      - name: Authenticate and materialize the signed encrypted input
        env:
          CI_REQUEST_DIGEST: ${{ inputs.request_digest }}
          CI_REQUEST: ${{ inputs.request }}
          BUILDER_INPUT_PRIVATE_KEY: ${{ secrets.BUILDER_INPUT_PRIVATE_KEY }}
          REQUEST_VERIFY_PUBLIC_KEY: ${{ secrets.REQUEST_VERIFY_PUBLIC_KEY }}
          BUILDER_READ_TOKEN: ${{ github.token }}
        run: python -m secure_release.native_cmake_trial materialize
      - name: Build and test without credentials or public compiler output
        run: python -m secure_release.native_cmake_trial build
      - name: Encrypt diagnostics
        if: always()
        env:
          BUILDER_ENCRYPTED_LOGS_PUBLIC_KEY_B64: ${{ secrets.BUILDER_ENCRYPTED_LOGS_PUBLIC_KEY_B64 }}
        run: python -m secure_release.native_cmake_trial logs
      - name: Upload only encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-trial-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-cmake-trial.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Remove plaintext staging
        if: always()
        run: python -m secure_release.native_cmake_trial cleanup
