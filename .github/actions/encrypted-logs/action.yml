name: Upload encrypted CI logs
description: Encrypt runner-local diagnostics and upload ciphertext-only artifact.
inputs:
  public_key_b64:
    description: Base64-encoded Tink public hybrid keyset.
    required: false
    default: ""
  roots:
    description: Newline-separated diagnostic roots. Defaults to RUNNER_TEMP.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Report missing encrypted-log key
      if: ${{ inputs.public_key_b64 == '' }}
      shell: bash
      run: echo "::warning::BUILDER_ENCRYPTED_LOGS_PUBLIC_KEY_B64 is not configured; encrypted log artifact skipped"
    - name: Install pinned log-encryption runtime
      if: ${{ inputs.public_key_b64 != '' }}
      shell: bash
      run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/requirements.lock"
    - name: Encrypt runner-local diagnostics
      if: ${{ inputs.public_key_b64 != '' }}
      shell: bash
      env:
        BUILDER_ENCRYPTED_LOGS_PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
        BUILDER_ENCRYPTED_LOG_ROOTS: ${{ inputs.roots }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/builder-encrypted-logs/${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.enc"
        mkdir -p "$(dirname "$out")"
        python -m secure_release.encrypted_logs collect --output "$out"
        test -s "$out"
        if find "$RUNNER_TEMP/builder-encrypted-logs" -type f ! -name '*.enc' -print -quit | grep -q .; then
          echo "BUILDER_ENCRYPTED_LOGS_PLAINTEXT_LEAK" >&2
          exit 1
        fi
    - name: Upload ШИФРОВАНЫЕ ЛОГИ
      if: ${{ always() && inputs.public_key_b64 != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ШИФРОВАНЫЕ ЛОГИ-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/builder-encrypted-logs/*.enc
        compression-level: 0
        retention-days: 14
        if-no-files-found: error
