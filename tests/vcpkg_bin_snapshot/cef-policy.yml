name: CEF publication policy contracts
on:
  push:
    branches: [feature/cef-static-integration]
    paths: ['ci/cef*', 'ci/tests/**', '.github/workflows/cef-policy.yml', '.github/workflows/publish.yml']
  pull_request:
    branches: [main]
    paths: ['ci/cef*', 'ci/tests/**', '.github/workflows/cef-policy.yml', '.github/workflows/publish.yml']
permissions:
  contents: read
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dobord/builder
          ref: 457fd41f39cbcff940c7af654da899d44ba5e553
          path: .builder-tools
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ci/tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}/.builder-tools
      - run: python -m compileall -q ci
